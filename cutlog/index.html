  function openMenu(title, opts) {
    $("#menu-panel").innerHTML = `<div class="grab"></div><div class="ph" style="margin-bottom:var(--s1)"><h2 style="font-size:var(--t-lg)">${esc(title)}</h2><button class="btn" data-menuclose>Close</button></div>` +
      opts.map((o, i) => `<button class="opt ${o.danger ? "danger" : ""}" data-opt="${i}">${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</button>`).join("");
    openMenu.opts = opts; $("#menu").hidden = false; const o = $("#menu-panel .opt"); if (o) o.focus({ preventScroll: true });
  }
  function setMenu(id, k) {
    const arr = LOG.ex[id], st = arr[k];
    const opts = [{ label: st.warm ? "Make it a working set" : "Make it a warm-up set", hint: st.warm ? "" : "won't count for progress", fn: () => { st.warm = !st.warm; } }];
    if (k > 0) opts.push({ label: "Copy the set above", hint: `${arr[k - 1].kg || "—"} kg × ${arr[k - 1].reps || "—"}`, fn: () => { st.kg = arr[k - 1].kg; st.reps = arr[k - 1].reps; st.rpe = arr[k - 1].rpe; } });
    opts.push({ label: "Delete this set", danger: true, fn: () => {
      const removed = arr.splice(k, 1)[0];
      toast("Set deleted", { label: "Undo", fn: () => { arr.splice(k, 0, removed); saveDraft(LOG); redrawLog(); } });
    } });
    openMenu(`${nameOf(id)}, set ${k + 1}`, opts);
  }
  function exMenu(id) {
    const e = exOf(id), opts = [];
    if (e.added) {
      opts.push({ label: "Add a warm-up set", hint: "goes first", fn: () => { LOG.ex[id].unshift({ ...blankSet(), warm: true }); } });
      if (exDone(id)) opts.push({ label: "Edit sets", fn: () => { LOG.open[id] = true; } });
      opts.push({ label: "Remove", hint: "added today", danger: true, fn: () => removeEx(id) });
      return openMenu(nameOf(id), opts);
    }
    (e.alternatives || []).forEach((alt) => { if (alt !== LOG.swap[id]) opts.push({ label: `Swap for ${nice(alt)}`, hint: "busy or pain", fn: () => { LOG.swap[id] = alt; LOG.ex[id].forEach((x) => { x.kg = ""; x.done = false; }); } }); });
    if (LOG.swap[id]) opts.push({ label: `Back to ${nice(id)}`, fn: () => { delete LOG.swap[id]; } });
    opts.push({ label: "Add a warm-up set", hint: "goes first", fn: () => { const first = LOG.ex[id][0] || {}; const w = parseFloat(num(first.kg)); LOG.ex[id].unshift({ kg: Number.isFinite(w) ? Math.round((w * 0.5) / 2.5) * 2.5 : "", reps: "", rpe: "", done: false, warm: true }); } });
    if (exDone(id) && !LOG.skip[id]) opts.push({ label: "Edit sets", fn: () => { LOG.open[id] = true; } });
    opts.push(LOG.skip[id] ? { label: "Bring it back", fn: () => { delete LOG.skip[id]; } } : { label: "Skip this exercise", danger: true, fn: () => { LOG.skip[id] = true; } });
    openMenu(nameOf(id), opts);
  }

  // add / remove an exercise for the day: the logger changes now, the plan change goes to the coach as a PLAN line
  const slug = (t) => String(t).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "exercise";
  function addexPane() {
    return `<div class="grab"></div><div class="ph"><h2>Add exercise</h2><button class="btn" data-close-pane>Close</button></div>
      <input class="inp" id="addex-q" type="search" placeholder="Search: fly, row, leg press…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search exercises" aria-controls="addex-list">
      <div class="pick" id="addex-list">${addexList("")}</div>
      <p class="note" style="margin:0">Adds 3 sets of 8–12, 90 s rest, RPE ${esc(addRpe())}. Add or delete sets in the logger.</p>`;
  }
  const addRpe = () => (LOG && LOG.rpeCap && LOG.rpeCap < 8 ? `≤${LOG.rpeCap}` : "8");
  function addexList(q) {
    const t = q.trim().toLowerCase(), have = new Set(LOG.order), cat = (D.exercise_catalog || []).filter((x) => !have.has(x.id));
    const words = t.split(/\s+/).filter(Boolean), hits = cat.filter((x) => words.every((w) => x.name.toLowerCase().includes(w) || x.id.includes(w))).slice(0, 30);
    const exact = cat.some((x) => x.name.toLowerCase() === t || x.id === slug(t));
    return hits.map((x) => `<button data-addex-id="${esc(x.id)}"><span>${esc(x.name)}</span><small>3 × 8–12</small></button>`).join("")
      + (t && !exact ? `<button class="new" data-addex-new="${esc(q.trim())}">Add “${esc(q.trim())}” as a new exercise</button>` : "")
      + (!hits.length && !t ? `<p class="muted" style="margin:0">No exercise list in your data yet: type a name.</p>` : "");
  }
  function addExercise(id, name, custom) {
    if (LOG.ex[id] && LOG.order.includes(id)) { toast(`${name} is already in this workout`); return; }
    const rpe = addRpe(), base = { sets: 3, reps: "8-12", rest_s: 90 };
    LOG.order.push(id); LOG.extra[id] = { name, ...base, rpe, added: true, custom: !!custom };
    LOG.ex[id] = Array.from({ length: 3 }, () => blankSet()); delete LOG.skip[id];
    planChange(LOG.date, "add:" + id, `added ${name.toLowerCase()} 3x8-12${custom ? " (new exercise, not in the list yet)" : ""}`, (c) => {
      c.add_exercises = [...(c.add_exercises || []).filter((x) => x.id !== id), { id, ...base, rpe: rpe.replace("≤", ""), ...(custom ? { name } : {}) }];
      if (c.exercises && c.exercises[id] === "skip") delete c.exercises[id];
    });
    saveDraft(LOG); closePane(); redrawLog(); toast(`Added ${name}`);
    const el = document.querySelector(`[data-ex="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: "center" });
  }
  function removeEx(id) {
    const k = LOG.order.indexOf(id), snap = { ex: LOG.ex[id], extra: LOG.extra[id] }, iso = LOG.date;
    const fromPhone = (localChanges(iso).add_exercises || []).some((x) => x.id === id);
    LOG.order.splice(k, 1); delete LOG.ex[id]; delete LOG.extra[id];
    const undo = planChange(iso, "add:" + id, fromPhone && !planSent(iso, "add:" + id) ? null : `removed ${snap.extra.name.toLowerCase()} (added exercise)`, (c) => {
      if (fromPhone) c.add_exercises = (c.add_exercises || []).filter((x) => x.id !== id); else c.exercises = { ...(c.exercises || {}), [id]: "skip" };
    });
    toast(`${snap.extra.name} removed`, { label: "Undo", fn: () => { LOG.order.splice(k, 0, id); LOG.ex[id] = snap.ex; LOG.extra[id] = snap.extra; undo(); saveDraft(LOG); redrawLog(); } });
  }

  function viewTrain() {
    if (LOG && TAB_LOGGING) return viewLogger();
    const prog = D.program || [], today = dubaiISO(), wk0 = mondayOf(today), wk1 = addDays(wk0, 7);
    // when each session falls: the next planned date from today (this week or next), else what happened this week
    const whenOf = (p) => {
      let up = null;
      for (let i = 0; i < 14 && !up; i++) { const iso = addDays(today, i); const pl = planOf(iso); if (sessionFor(iso) === p && !(pl && pl.status === "done")) up = iso; }
      if (!inSched(today)) return up ? { iso: up, label: dowOf(up) + " " + +up.slice(8), up } : { label: "" };
      const past = (D.schedule.days || []).filter((r) => r.date >= wk0 && r.date < today && (r.logged || r.session) === p.id);
      const done = past.find((r) => r.status === "done"), missed = past.find((r) => r.status === "missed");
      if (done && (!up || up >= wk1)) return { iso: done.date, label: "Done " + dowOf(done.date), done: true, up };
      if (up) return { iso: up, label: (up === today ? "Today" : dowOf(up) + " " + +up.slice(8)) + (up >= wk1 ? ", next wk" : ""), up };
      return { label: missed ? "Missed" : "Not this week" };
    };
    const when = prog.map(whenOf);
    if (TRAINSEL == null) { const ups = when.map((w, i) => [w.up, i]).filter((x) => x[0]).sort(); TRAINSEL = ups.length ? ups[0][1] : 0; }
    const s = prog[TRAINSEL];
    if (!s) return `<div class="card"><p class="muted" style="margin:0">No program yet.</p></div>`;
    const w = when[TRAINSEL], sub = (s.name.match(/\((.+)\)/) || [])[1] || "", note = weekNote(today);
    const shown = sessionFor(today) === s ? sessionPlan(today) : s;
    const nextTxt = (e) => e.next ? (e.next.kg ? `next ${e.next.kg} kg × ${esc(e.next.reps)}` : e.next.action === "start" ? "first time: find your weight" : `next ${esc(e.next.reps)}`) : "";
    return `
      <div class="span" style="display:grid;gap:var(--s2)"><div class="daychips" role="group" aria-label="Sessions this week">${prog.map((p, i) => `<button data-sess="${i}" aria-pressed="${i === TRAINSEL}" aria-label="${esc(p.name.split(" (")[0])}: ${esc(when[i].label || "not scheduled")}"><span class="l">${esc(when[i].label || "—")}</span><span class="nm">${esc(p.name.split(" (")[0])}</span></button>`).join("")}</div>
        ${note ? `<p class="insight" style="margin:0">Re-planned by your coach: ${esc(note)}</p>` : ""}</div>
      ${shown !== s ? easyCard() : ""}
      <section class="card session" aria-label="Session plan">
        <span class="eyebrow">${w.up ? (w.up === today ? "Today, after 18:00" : "Next: " + longDate(w.up) + ", after 18:00") : w.done ? "Done " + longDate(w.iso) + ". Not planned again this week" : "Not planned this week. You can still log it"}</span>
        <h3>${esc(s.name.split(" (")[0])}</h3>
        <span class="muted" style="font-size:var(--t-sm)">${sub ? esc(sub[0].toUpperCase() + sub.slice(1)) + ". " : ""}${shown.exercises.filter((e) => !e.skip).length} exercises, ${esc(s.duration)} min${/upper/.test(s.id) && !shown.skipCond ? ", then a 20 min incline walk" : ""}</span>
        <ol class="exlist" style="list-style:none;margin:var(--s2) 0 0;padding:0">${shown.exercises.map((e, i) => `<li class="ex ${e.skip ? "skip" : ""}"><span class="n">${i + 1}</span><span style="font-weight:600">${esc(e.added ? e.name : cap(nice(e.id)))}${e.added ? ` <span class="pill yours">Added</span>` : ""}</span><span class="m num">${e.skip ? "skipped today" : `${e.sets} × ${esc(e.reps)}${e.rpe ? `, RPE ${esc(e.rpe)}` : ""}`}</span>${e.next ? `<span class="x">${e.last ? "last " + esc(e.last.text) + ", " : ""}${nextTxt(e)}</span>` : ""}</li>`).join("")}</ol>
        ${shown !== s && shown.changed ? `<p class="note"><span class="pill yours">Your change</span> Today${shown.rpeCap ? `: RPE ≤${shown.rpeCap}` : ""}${shown.setsDelta ? `, ${-shown.setsDelta} set less per exercise` : ""}.</p>` : ""}
        <p class="note">Progression: when every set reaches the top of the rep range at RPE 8 or easier, add weight next time.</p>
        <button class="cta pen" data-logstart="${TRAINSEL}" style="width:100%;margin-top:var(--s2)">${draftFor(s.id) ? "Resume workout" : "Start workout"}</button>
      </section>
      <div class="card"><div class="card-h"><h2>Strength</h2><span class="aside">estimated 1-rep max</span></div>
        ${D.lifts && D.lifts.length ? `<div class="list">${D.lifts.map((l) => `<button class="li" data-lift="${esc(l.exercise)}" style="width:100%;text-align:left"><div><b>${esc(cap(nice(l.exercise)))}</b><div class="muted num" style="font-size:var(--t-sm)">${fmt(l.e1rm, 1)} kg, ${l.e1rm - l.first >= 0 ? "+" : ""}${fmt(l.e1rm - l.first, 1)} since start</div></div><div style="width:110px">${spark(l.points.map((p) => p.e1rm), "var(--coral)", 110, 34)}</div></button>`).join("")}</div>`
          : `<p class="muted" style="margin:0">Starts with your first logged session: an estimated 1-rep max for each main lift, and its trend.</p>`}</div>`;
  }

  // ---------- HEALTH ----------
  function labRow(l) {
    const v = parseFloat(l.value), lo = l.ref_low !== "" ? parseFloat(l.ref_low) : 0, hi = l.ref_high !== "" ? parseFloat(l.ref_high) : null;
    const top = Math.max(v, hi ?? v) * 1.25, bot = Math.min(v, lo) * 0.75, P = (x) => ((x - bot) / (top - bot)) * 100;
    const H = l.flag === "H", c = H ? "var(--bad)" : "var(--warn)";
    return `<div class="labrow"><div class="row"><b>${esc(l.marker)}</b><span style="display:flex;align-items:center;gap:var(--s2)"><span class="v num">${esc(l.value)} <span class="muted" style="font-size:var(--t-xs)">${esc(l.unit)}</span></span><span class="pill ${H ? "bad" : "warn"}">${H ? "Above range" : "Below range"}</span></span></div>
      <div class="rtrack" role="img" aria-label="${esc(l.marker)} ${esc(l.value)} ${esc(l.unit)}, ${H ? "above" : "below"} the lab range ${l.ref_low !== "" ? esc(l.ref_low) : "0"} to ${esc(l.ref_high || "")}"><u style="left:${P(lo)}%;width:${P(hi ?? top) - P(lo)}%"></u><i style="--c:${c};left:${P(v)}%"></i></div>
      <div class="muted" style="font-size:var(--t-xs)">Lab range ${l.ref_low !== "" ? esc(l.ref_low) : "0"}–${esc(l.ref_high || "")} ${esc(l.unit)}</div></div>`;
  }
  function viewHealth() {
    const sup = D.supplements || [], labs = D.labs_flagged || [], doc = D.doctor || [], open = doc.filter((q) => q.status === "OPEN").length;
    return `
      <div class="card"><div class="card-h"><h2>Flagged lab results</h2><span class="aside">${labs[0] ? esc(longDate(labs[0].date)) : ""}</span></div>
        ${labs.length ? labs.map(labRow).join("") : emptyBox("No flagged results. Share a lab report with your coach to add one.", 90)}
        <p class="note">Values exactly as printed. The green band is the lab's own normal range. Not a diagnosis: discuss with your doctor.</p></div>
      <div class="card"><div class="card-h"><h2>Questions for your doctor</h2>${open ? `<span class="pill warn">${open} open</span>` : ""}</div>
        <div class="list">${doc.length ? doc.map((q) => `<div class="li"><b>${esc(q.question)}</b><span class="pill ${q.status === "OPEN" ? "warn" : "ok"}">${q.status === "OPEN" ? "Open" : "Answered"}</span><span class="sub">${esc(q.why)}</span></div>`).join("") : `<p class="muted" style="margin:0">None yet.</p>`}</div></div>
      ${sup.length ? `<div class="card"><div class="card-h"><h2>Supplements</h2></div><div class="list">${sup.map((x) => `<div class="li"><b>${esc(x.name)}</b><span class="muted" style="font-size:var(--t-xs)">${esc(x.timing || "")}</span><span class="sub">${x.dose ? esc(x.dose) : "Dose not recorded yet"}</span></div>`).join("")}</div>
        <p class="note">Dose questions go to your doctor. Your coach never changes a dose.</p></div>` : ""}
      ${(D.missing_info || []).length ? `<div class="card"><div class="card-h"><h2>Your coach still needs</h2></div><div class="list">${D.missing_info.map((m) => `<div class="li"><span>${esc(m)}</span></div>`).join("")}</div></div>` : ""}`;
  }

  // ---------- check-in templates ----------
  function template(kind) {
    const iso = SEL || dubaiISO(), m = menuFor(iso), s = sessionFor(iso), sup = supMap();
    const plan = (x) => x ? `plan meal (${stripId(x)})` : "describe it";
    const h = dubaiHour(), mealGuess = h < 16 ? "lunch" : "dinner";
    const exLines = s ? s.exercises.map((e) => `${nice(e.id)}:`).join("\n") : "exercise: kg x reps, kg x reps @RPE";
    const T = {
      morning: `MORNING ${iso}\nWeight (kg):\nFeel (1-5):\n${dowOf(iso) === "Sun" ? "Waist navel / midpoint (cm):\n" : ""}Notes:\n+ attach Zepp: sleep, resting HR, HRV`,
      meal: `MEAL ${iso} ${mealGuess}\nWhat: ${plan(m && (mealGuess === "lunch" ? m.lunch : m.dinner))}\nAte: all / most / half\nExtras (oil, sauce, sides, drinks):\nAdd-on eaten:${m && m.addon && mealGuess === "dinner" ? " (" + m.addon.items + ")" : ""}\n+ attach photo`,
      gym: `GYM ${iso} · ${s ? s.name.split(" (")[0] : "session"}\nDuration (min):\nSession RPE (1-10):\n${exLines}\nCardio (type, min, avg HR):${s && /upper/.test(s.id) ? " incline walk 20 min," : ""}\nPain (where, 0-10): none\nShake (${shakeTxt() || "protein"}): yes/no`,
      night: `NIGHT ${iso}\nSteps:\nWater (L):\nTea cups:\nSupplements (${supList().filter((x) => !["whey", "creatine"].includes(x.id)).map((x) => x.name).join(" / ") || "none recorded"}): all / missed:\nOther food or drinks not logged yet:\nAll food logged today: yes/no\nNotes:\n+ attach Zepp steps screenshot`,
      day: `DAY ${iso}\nWeight (kg):\nFeel (1-5):\nLunch: ${cancelledOf(m, "lunch") ? "cancelled" : plan(m && m.lunch) + ", ate all/most/half, extras:"}\nDinner: ${cancelledOf(m, "dinner") ? "cancelled" : plan(m && m.dinner) + ", ate all/most/half, extras:"}\nAdd-on / snacks:${m && m.addon ? " (" + m.addon.items + ")" : ""}\n${s ? `Gym: ${s.name.split(" (")[0]}, duration, RPE, sets per exercise:\nShake: yes/no\n` : ""}Steps:\nWater (L):\nTea cups:\nSupplements: all / missed:\nAll food logged: yes/no\nNotes:\n+ attach Zepp + food photos`,
    };
    return T[kind];
  }
  function toast(msg, action) {
    const t = $("#toast"), b = $("#toast-act"); $("#toast-msg").textContent = msg; t.classList.remove("pr");
    b.hidden = !action; if (action) { b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; }
    t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), action ? 6000 : 2600);
  }
  function openSheet(kind) {
    $("#sheet-title").textContent = { morning: "Morning check-in", meal: "Meal", gym: "Gym session", night: "Night check-in", day: "Full day" }[kind];
    $("#sheet-text").value = template(kind); $("#sheet-clear").hidden = true; $("#sheet").hidden = false; $("#sheet-text").focus({ preventScroll: true });
  }
  async function copyText(text, { quiet = false } = {}) {
    try { await navigator.clipboard.writeText(text); if (!quiet) toast("Copied. Paste it into Claude and send."); return true; }
    catch { if (quiet) return false; const ta = $("#sheet-text"); ta.focus(); ta.select(); toast("Selected. Tap Copy in the menu."); return false; }
  }

  // ---------- render ----------
  const wrapV = (html, cls = "") => `<div class="view ${cls}">${html}</div>`;
  const anim = () => requestAnimationFrame(() => requestAnimationFrame(animateRings));
  function drawToday() { $("#v-today").innerHTML = wrapV(viewToday()); anim(); }
  function drawProgress() { $("#v-progress").innerHTML = wrapV(viewProgress()); anim(); }
  function drawFood() { if (!$("#pane").hidden && $("#pane").dataset.kind === "week") { const y = $("#pane-box").scrollTop; openPane("week"); $("#pane-box").scrollTop = y; anim(); } }
  function drawTrain() { $("#v-train").innerHTML = wrapV(viewTrain(), LOG && TAB_LOGGING ? "narrow" : ""); }
  function render() {
    if (!D) return;
    const h = dubaiHour(), first = (D.name || "").split(" ")[0];
    $("#greet").textContent = parse(dubaiISO()).toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", timeZone: "UTC" }).replace(",", "");
    const gen = new Date((D.generated_at || "").replace(" ", "T") + ":00+04:00"), ageH = (Date.now() - gen) / 36e5;
    $("#dateline").innerHTML = `${D.plan.week ? "Plan week " + D.plan.week : "Before the plan"}. <span class="${ageH > 36 ? "stale" : ""}" title="When your coach last updated your records">${ageH > 36 ? "Updated " + Math.floor(ageH / 24) + " days ago" : "Updated " + esc((D.generated_at || "").slice(11))}</span>`;
    $("#settings").textContent = (D.name || "Cut Log").split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();
    drawToday();
    drawProgress();
    drawFood();
    drawTrain();
    $("#head").hidden = false; $("#tabs").hidden = false;
    if (!$("#pane").hidden && $("#pane").dataset.kind === "entries") openPane("entries");
    relayFromData(); drawSync();
    showTab(TAB);
  }

  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  document.addEventListener("click", (e) => {
    const d = e.target.closest("[data-day]"); if (d) { SEL = d.dataset.day; drawToday(); requestAnimationFrame(() => requestAnimationFrame(animateRings)); return; }
    const hit = e.target.closest(".hit"); if (hit) { showTip(hit); return; }
    const tkb = e.target.closest("[data-tick]"); if (tkb) { const iso = tkb.dataset.iso, t = ticks(iso); t[tkb.dataset.tick] ? delete t[tkb.dataset.tick] : (t[tkb.dataset.tick] = Date.now()); setTicks(iso, t); const y = window.scrollY; drawToday(); if (!$("#pane").hidden && $("#pane").dataset.kind === "day") openPane("day"); window.scrollTo({ top: y }); return; }
    const icb = e.target.closest("[data-ics]"); if (icb) { downloadIcs(icb.dataset.ics); return; }
    const plb = e.target.closest("[data-plates]"); if (plb) { openPane("plates", plb.dataset.plates); return; }
    const cub = e.target.closest("[data-cues]"); if (cub) { openPane("cues", cub.dataset.cues); return; }
    const lfb = e.target.closest("[data-lift]"); if (lfb) { openPane("lift", lfb.dataset.lift); return; }
    const rpb = e.target.closest("[data-report]"); if (rpb) { openPane("report", rpb.dataset.report); return; }
    const r = e.target.closest("[data-range]"); if (r) { RANGE = +r.dataset.range; drawProgress(); return; }
    const f = e.target.closest("[data-food]"); if (f) { FOODSEL = f.dataset.food; drawFood(); return; }
    const s = e.target.closest("[data-sess]"); if (s) { TRAINSEL = +s.dataset.sess; drawTrain(); return; }
    const t = e.target.closest("[data-tpl]"); if (t) { closePane(); openSheet(t.dataset.tpl); return; }
    const op2 = e.target.closest("[data-open-pane]"); if (op2) { openPane(op2.dataset.openPane, op2.dataset.mode); return; }
    const lm = e.target.closest("[data-ldmode]"); if (lm) { LD.mode = lm.dataset.ldmode; saveLd(LD); openPane("log"); return; }
    const ex = e.target.closest("[data-explain]"); if (ex) { openPane("explain", ex.dataset.explain); return; }
    if (e.target.closest("[data-close-pane]") || e.target.id === "pane") { closePane(); return; }
    if (e.target.closest("#fab")) { if (LD) LD.mode = ""; openPane("log"); return; }
    const gt = e.target.closest("[data-go-train]"); if (gt) { const i = parseInt(gt.dataset.i, 10); if (i >= 0) TRAINSEL = i; drawTrain(); showTab("train"); window.scrollTo({ top: 0 }); return; }
    if (e.target.closest("[data-setup]")) { closePane(); showSetup(); return; }
    const tsb = e.target.closest("[data-theme-set]"); if (tsb) { applyTheme(tsb.dataset.themeSet); openPane("you"); return; }
    if (e.target.closest("#sync")) { openPane("relay"); return; }
    const rqr = e.target.closest("[data-rq-retry]"); if (rqr) { relayRetry(rqr.dataset.rqRetry); return; }
    const rqc = e.target.closest("[data-rq-copy]"); if (rqc) { relayCopy(rqc.dataset.rqCopy); return; }
    const ask = e.target.closest("[data-ask]"); if (ask) { copyText(ask.dataset.ask + "\n(asked from Cut Log)"); return; }
    const ldb = e.target.closest("[data-ld]"); if (ldb) { LD[ldb.dataset.ld] = String(LD[ldb.dataset.ld]) === ldb.dataset.v ? "" : ldb.dataset.v; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    if (e.target.closest("[data-ld-toggle]")) { LD.adj = !LD.adj; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    const wb = e.target.closest("[data-water]"); if (wb) { LD.water = +wb.dataset.water ? LD.water + +wb.dataset.water : 0; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    if (e.target.closest("[data-ld-send]")) {
      const msg = ldMessage(); if (!msg) { toast("Nothing to send yet"); return; }
      const w = parseFloat(num(LD.weight)); if (LD.weight && !(w >= 40 && w <= 200)) { toast("Weight looks off: check the number"); return; }
      const pend = pendingPlan();
      const ob = outbox(); ob.push({ at: new Date().toISOString(), date: dubaiISO(), title: [LD.weight && "Weigh-in " + num(LD.weight) + " kg", LD.ate && (LD.meal === "lunch" ? "Lunch" : "Dinner") + " · " + LD.ate, LD.water && "Water", LD.free && "Note", pend.length && "Plan change"].filter(Boolean).join(" · ") || "Entry", text: msg }); setOutbox(ob);
      markPlanSent(pend, "log");
      const ci = checkinEntry(LD), hasText = relayHasText(LD, msg), today = dubaiISO();
      const sent = relayOn() && store.get().key ? (async () => {
        const a = Object.keys(ci).length ? await relaySend("checkin", today, { ...ci, message: msg }, { copy: msg, title: ob[ob.length - 1].title }) : true;
        const b = hasText ? await relaySend("text", today, { message: msg }, { copy: msg, title: ob[ob.length - 1].title }) : true;
        return a && b ? [a, b].filter((x) => typeof x === "string") : null;
      })() : null;
      const sentTicks = Object.keys(ticks(dubaiISO())); try { localStorage.removeItem(LD_KEY); } catch {} LD = { ...ld(), meal: LD.meal, sentTicks }; saveLd(LD);
      closePane(); $("#sheet-text").value = msg; $("#sheet-clear").hidden = true;
      if (sent) sent.then((ids) => { if (ids) { copyText(msg, { quiet: true }); relayToast(ids, () => { $("#sheet-title").textContent = "Ready for your coach"; $("#sheet").hidden = false; copyText(msg); }); } else { $("#sheet-title").textContent = "Ready for your coach"; $("#sheet").hidden = false; copyText(msg); } });
      else { $("#sheet-title").textContent = "Ready for your coach"; $("#sheet").hidden = false; copyText(msg); }
      drawToday(); return;
    }
    const eb = e.target.closest("[data-easy]"); if (eb) { chooseEasy(eb.dataset.easy); return; }
    if (e.target.closest("[data-addex]")) { openPane("addex"); const q = $("#addex-q"); if (q) q.focus(); return; }
    const ai = e.target.closest("[data-addex-id]"); if (ai) { addExercise(ai.dataset.addexId, catName(ai.dataset.addexId), false); return; }
    const an = e.target.closest("[data-addex-new]"); if (an) { const nm = cap(an.dataset.addexNew.trim()), id = slug(nm), known = (D.exercise_catalog || []).find((x) => x.id === id); addExercise(id, known ? known.name : nm, !known); return; }
    const ls = e.target.closest("[data-logstart]"); if (ls) { TAB_LOGGING = true; startLog(+ls.dataset.logstart); return; }
    const dn = e.target.closest("[data-done]"); if (dn) {
      const [id, k] = dn.dataset.done.split(":"), st = LOG.ex[id][+k], row = dn.closest(".setrow");
      if (!st.done && num(st.reps) === "") { const r = row.querySelector('[data-f="reps"]'); r.classList.remove("need"); void r.offsetWidth; r.classList.add("need"); r.focus(); toast("Type the reps first"); return; }
      st.done = !st.done; saveDraft(LOG); row.classList.toggle("done", st.done);
      // PR: a done working set whose estimated 1RM beats everything logged before (and earlier today)
      if (st.done && !st.warm) {
        const exid = LOG.swap[id] || id, v = e1rm(st.kg, st.reps), hist = (D.lift_bests || {})[exid], best = Math.max(hist || 0, LOG.prs[exid] || 0);
        if (v && hist && v > best + 0.05) { st.pr = true; saveDraft(LOG); row.classList.add("pr"); toast(`New best: ${cap(nice(exid))}, estimated 1RM ${fmt(v, 1)} kg (was ${fmt(best, 1)})`); $("#toast").classList.add("pr"); }
        if (v) { LOG.prs[exid] = Math.max(v, LOG.prs[exid] || 0); saveDraft(LOG); }
      } else if (!st.done) st.pr = false;
      if (st.done) { startRest(st.warm ? 60 : exOf(id).rest_s); if (exDone(id)) setTimeout(redrawLog, 350); }
      return;
    }
    const as = e.target.closest("[data-addset]"); if (as) { const arr = LOG.ex[as.dataset.addset], prev = [...arr].reverse().find((x) => !x.warm) || {}; arr.push({ kg: prev.kg ?? "", reps: "", rpe: "", done: false, warm: false }); saveDraft(LOG); redrawLog(); return; }
    const sm = e.target.closest("[data-setmenu]"); if (sm) { const [id, k] = sm.dataset.setmenu.split(":"); setMenu(id, +k); return; }
    const em = e.target.closest("[data-exmenu]"); if (em) { exMenu(em.dataset.exmenu); return; }
    const mm = e.target.closest("[data-mealmenu]"); if (mm) { mealMenu(mm.dataset.iso, mm.dataset.mealmenu); return; }
    const op = e.target.closest("[data-opt]"); if (op) { $("#menu").hidden = true; const o = openMenu.opts[+op.dataset.opt]; o.fn(); if (!o.noLog) { saveDraft(LOG); redrawLog(); } return; }
    if (e.target.closest("[data-menuclose]") || e.target.id === "menu") { $("#menu").hidden = true; return; }
    const oe = e.target.closest("[data-open]"); if (oe) { LOG.open[oe.dataset.open] = true; saveDraft(LOG); redrawLog(); return; }
    const sh = e.target.closest("[data-shake]"); if (sh) { LOG.shake = !LOG.shake; sh.setAttribute("aria-pressed", String(LOG.shake)); saveDraft(LOG); return; }
    if (e.target.closest("[data-finish]")) {
      const list = exList(), empty = list.filter((x) => !LOG.skip[x.id] && !LOG.ex[x.id].some((y) => !y.warm && num(y.reps) !== ""));
      // session summary: working sets, volume (kg x reps), new bests, time
      const work = list.filter((x) => !LOG.skip[x.id]).flatMap((x) => LOG.ex[x.id].filter((y) => !y.warm && num(y.reps) !== ""));
      const vol = work.reduce((a, y) => a + (parseFloat(num(y.kg)) || 0) * (parseInt(num(y.reps), 10) || 0), 0);
      const prs = list.filter((x) => LOG.ex[x.id].some((y) => y.pr)).length, mins = Math.round((Date.now() - LOG.start) / 60000);
      $("#sheet-title").textContent = `${work.length} set${work.length === 1 ? "" : "s"}, ${fmt(vol)} kg moved, ${mins} min${prs ? `, ${prs} new best${prs > 1 ? "s" : ""}` : ""}${empty.length ? `. ${empty.length} not done` : ""}`;
      markPlanSent(planLog().filter((x) => x.iso === LOG.date && !x.sent), LOG.start);
      const msg = logMessage(); $("#sheet-text").value = msg; $("#sheet-clear").hidden = false; $("#sheet").hidden = false;
      if (relayOn() && store.get().key) {
        // one entry per finished workout; Finish again after an edit sends the new version
        const w = workoutEntry(), sigt = JSON.stringify({ ...w, duration_min: 0, message: "" }), lg = LOG;
        if (lg.relaySent === sigt) { copyText(msg, { quiet: true }); toast("Already sent to your coach", { label: "Copy", fn: () => copyText(msg) }); return; }
        relaySend("workout", lg.date, w, { copy: msg, title: sessOf().name.split(" (")[0] }).then((id) => {
          if (id) { lg.relaySent = sigt; if (LOG === lg) saveDraft(LOG); copyText(msg, { quiet: true }); relayToast([id], () => copyText(msg)); }
          else copyText(msg);
        });
        return;
      }
      copyText(msg); return;
    }
    if (e.target.closest("[data-discard]")) { const bt = e.target.closest("[data-discard]"); if (bt.dataset.sure) { clearLog(); } else { bt.dataset.sure = "1"; bt.textContent = "Tap again to discard"; } return; }
    if (e.target.closest("[data-logback]")) { TAB_LOGGING = false; drawTrain(); return; }
    const rs = e.target.closest("[data-rest]"); if (rs) { const v = rs.dataset.rest; if (v === "skip") { restLeft = 0; clearInterval(restT); $("#rest").hidden = true; } else { restLeft = Math.max(0, restLeft + +v); $("#rest").classList.remove("go"); if (!$("#rest").hidden) restTick(); } return; }
  });
  function showTip(hit) { hit.closest("svg").querySelectorAll(".hit.on").forEach((x) => x.classList.remove("on")); hit.classList.add("on"); const tip = hit.closest(".chart").nextElementSibling; if (tip && tip.classList.contains("chart-tip")) tip.innerHTML = hit.dataset.tip; }
  document.addEventListener("pointerover", (e) => { const h = e.target.closest && e.target.closest(".hit"); if (h && e.pointerType === "mouse") showTip(h); });
  function clearLog() { saveDraft(null); LOG = null; TAB_LOGGING = false; clearInterval(restT); $("#rest").hidden = true; try { WAKE && WAKE.release(); } catch {} drawTrain(); }
  document.addEventListener("change", (e) => {
    const c = e.target.dataset && (e.target.dataset.ldc || e.target.dataset.sup);
    if (!c || !LD) return;
    if (e.target.dataset.ldc) LD[c] = e.target.checked; else LD.sup[c] = e.target.checked; saveLd(LD);
  });
  document.addEventListener("input", (e) => {
    if (e.target.dataset && e.target.dataset.ldi && LD) { LD[e.target.dataset.ldi] = e.target.value; saveLd(LD); return; }
    if (e.target.id === "addex-q") { $("#addex-list").innerHTML = addexList(e.target.value); return; }
    if (!LOG) return;
    const f = e.target.dataset.f, top = e.target.dataset.top;
    if (f) { const id = e.target.closest("[data-ex]").dataset.ex, k = +e.target.closest("[data-set]").dataset.set; LOG.ex[id][k][f] = e.target.value.trim(); saveDraft(LOG); }
    else if (top) { LOG[top] = e.target.value; saveDraft(LOG); }
    e.target.classList.remove("need");
  });
  setInterval(() => { const el = $("#elapsed"); if (el && LOG) el.textContent = Math.round((Date.now() - LOG.start) / 60000) + " min"; }, 30000);
  $("#sheet-copy").addEventListener("click", () => copyText($("#sheet-text").value));
  $("#sheet-close").addEventListener("click", () => { $("#sheet").hidden = true; $("#sheet-clear").hidden = true; });
  $("#sheet-clear").addEventListener("click", () => { $("#sheet").hidden = true; $("#sheet-clear").hidden = true; clearLog(); toast("Workout cleared from this phone"); });
  // keep Tab inside the top-most open dialog (sheet > menu > pane)
  const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), textarea, select, [tabindex]:not([tabindex="-1"])';
  const topDialog = () => ["#sheet", "#menu", "#pane"].map((x) => $(x)).find((x) => !x.hidden) || null;
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const dlg = topDialog(); if (!dlg) return;
    const f = [...dlg.querySelectorAll(FOCUSABLE)].filter((x) => x.offsetParent !== null); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#sheet").hidden = true; $("#menu").hidden = true; closePane(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && LOG && TAB_LOGGING) keepAwake(); });
  $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
  $("#refresh").addEventListener("click", () => load());
  $("#settings").addEventListener("click", () => { if (D) openPane("you"); else showSetup(); });
  $("#setup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("#f-pass").value.trim();
    if (!pass) return showSetup("Type your password first.");
    $("#unlock").textContent = "Unlocking…";
    try {
      const blob = await fetchBlob();
      const key = await deriveKey(pass, blob.salt, blob.iter);
      try { D = await decryptBlob(blob, key); } catch { $("#unlock").textContent = "Unlock"; return showSetup("Wrong password. Check it and try again."); }
      store.set({ key, salt: blob.salt, iter: blob.iter, cache: D, cachedAt: new Date().toISOString() });
      $("#f-pass").value = ""; $("#unlock").textContent = "Unlock"; render(); relayStart();
    } catch (err) { $("#unlock").textContent = "Unlock"; showSetup(err.message); }
  });
  $("#peek").addEventListener("click", () => { const f = $("#f-pass"), show = f.type === "password"; f.type = show ? "text" : "password"; $("#peek").textContent = show ? "Hide" : "Show"; $("#peek").setAttribute("aria-pressed", String(show)); });
  $("#forget").addEventListener("click", () => { store.set({}); D = null; showSetup(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && store.get().key) { load({ quiet: true }); relayFlush(false); relayPoll(); } });

  try { TAB = localStorage.getItem(KEY + ".tab") || "today"; } catch {}
  if (TAB === "trend" || TAB === "health") TAB = "progress";
  if (TAB === "food") TAB = "today";
  applyTheme(themePref());
  if (LOG) TAB_LOGGING = true;
  const c = store.get();
  if (c.cache) { D = c.cache; render(); if (!navigator.onLine) showOffline(true, c.cachedAt); }
  load(); relayStart();
  window.addEventListener("offline", () => { showOffline(true, store.get().cachedAt); drawSync(); });
  window.addEventListener("online", () => { showOffline(false); if (store.get().key) { load({ quiet: true }); relayFlush(true); } });
  // offline shell (sw.js): only on https or this computer
  if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
})();
