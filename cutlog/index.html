<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cut Log">
<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,1,400&display=swap">
<style>
/* Cut Log design system: "Clipboard".
   A printed gym log sheet on a clipboard. Black print on white (night: warm near-black sheet, paper-white ink), hard ruled lines,
   form fields instead of cards. One accent: ballpoint blue, for the coach's notes and actions. Yellow highlighter
   marks what needs attention; red pen only for floors and out-of-range lab values. Data is drawn in ink.
   Archivo's width axis carries everything: heavy condensed numerals, condensed caps for form labels, normal body.
   Newsreader italic is the coach's hand. */
:root {
  --paper: #FFFFFF; --ink: #000000; --ink-2: #3B3B3B; --ink-3: #5E5E5E; --rule-2: #CFCFCF; --tint: #F1F1EF;
  --pen: #1B3BCF; --on-pen: #FFFFFF; --hi: #FFE24A; --on-hi: #000000; --red: #C2161B; --amber: #7A5200;
  /* legacy names used by view code: everything maps onto paper / ink / pen */
  --bg: var(--paper); --surface: var(--paper); --raised: var(--tint); --sunken: var(--tint);
  --line: var(--rule-2); --line-2: var(--rule-2); --muted: var(--ink-2); --faint: var(--ink-3);
  --accent: var(--pen); --on-accent: var(--on-pen); --accent-ink: var(--pen);
  --kcal: var(--ink); --protein: var(--ink); --steps: var(--ink); --sleep: var(--ink); --info: var(--ink);
  --ok: var(--ink); --warn: var(--amber); --bad: var(--red);
  --scrim: rgb(0 0 0 / .45); --nav: var(--paper); --shadow: none;
  --f: "Archivo", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-2xl: 2.5rem; --t-3xl: 3.75rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;
  --r-xs: 2px; --r-sm: 2px; --r: 0; --r-lg: 0;
  --rule: 2px solid var(--ink); --hair: 1px solid var(--rule-2);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --nav-h: 60px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #16140F; --ink: #EEE9DF; --ink-2: #C4BDB1; --ink-3: #A0998D; --rule-2: #3A362E; --tint: #211E18;
  --pen: #A3B6FF; --on-pen: #16140F; --red: #FF8273; --amber: #FFD84A; --scrim: rgb(8 7 5 / .72); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #16140F; --ink: #EEE9DF; --ink-2: #C4BDB1; --ink-3: #A0998D; --rule-2: #3A362E; --tint: #211E18;
  --pen: #A3B6FF; --on-pen: #16140F; --red: #FF8273; --amber: #FFD84A; --scrim: rgb(8 7 5 / .72); color-scheme: dark; }

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--t-base)/1.5 var(--f); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
::selection { background: var(--hi); color: var(--on-hi); }
.muted { color: var(--ink-2); }
.mono, .num { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--f-serif); }
/* type roles */
.lbl, .eyebrow, .lab, .fl { font: 700 var(--t-sm)/1.2 var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.big { font: 800 var(--t-3xl)/.9 var(--f); font-stretch: 62%; letter-spacing: -.01em; }
.mid { font: 800 var(--t-2xl)/.95 var(--f); font-stretch: 62%; }
.cond { font-stretch: 75%; }
.mark { background: linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%); color: var(--on-hi); padding: 0 .15em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* ---------- shell ---------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--gutter) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 0; }
.view { display: grid; gap: 0; }
.head { display: flex; align-items: flex-end; gap: var(--s3); padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) 0 var(--s3); border-bottom: 4px solid var(--ink); }
.head .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.head h1 { margin: 0; font: 800 2.75rem/.9 var(--f); font-stretch: 62%; letter-spacing: -.005em; text-transform: uppercase; }
#dateline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.roundbtn { width: 44px; height: 44px; border: var(--rule); display: grid; place-items: center; flex: none; background: var(--paper); }
.roundbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: square; }
.roundbtn.spin svg { animation: spin .9s linear infinite; }
.avatar { font: 800 var(--t-sm) var(--f); font-stretch: 75%; background: var(--ink); color: var(--paper); }
@keyframes spin { to { transform: rotate(360deg); } }
.stale { background: var(--hi); color: var(--on-hi); padding: 0 4px; }

/* ---------- sheet sections: ruled blocks, never cards ---------- */
.card, .sec-block { padding: var(--s4) 0 var(--s5); border-bottom: var(--rule); min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.card-h h2, .h2 { margin: 0; font: 800 var(--t-md)/1.1 var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; }
.card-h .aside { font-size: var(--t-sm); color: var(--ink-2); text-align: right; }
.note { font-size: var(--t-sm); line-height: 1.5; color: var(--ink-2); margin: var(--s3) 0 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }

/* ---------- tags & status: words first, then ink marks ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 8px; border: 1.5px solid var(--ink); font: 700 var(--t-xs)/1.1 var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.pill.ok::before { content: "✓"; }
.pill.warn { background: var(--hi); color: var(--on-hi); border-color: var(--hi); }
.pill.bad { border-color: var(--red); color: var(--red); }
.pill.bad::before { content: "▲"; font-size: .8em; }
.pill.btn { min-height: 44px; padding: 0 12px; }
.src { display: inline-flex; align-items: center; gap: 5px; font: 600 var(--t-xs)/1 var(--f); font-stretch: 75%; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.src::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.src.est::before { background: transparent; border: 1.5px dashed currentColor; width: 7px; height: 7px; }
.src.unv { color: var(--amber); }
.src.unv::before { background: transparent; border: 1.5px dotted currentColor; }
.tags { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

/* ---------- buttons ---------- */
.btn { min-height: 44px; padding: 0 14px; border: var(--rule); background: var(--paper); color: var(--ink); font: 800 var(--t-sm) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: background .12s; }
.btn:active, .cta:active, .opt2:active { transform: translateY(1px); }
.btn.primary, .btn.train { background: var(--pen); border-color: var(--pen); color: var(--on-pen); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 20px; border: var(--rule); background: var(--ink); color: var(--paper); font: 800 var(--t-md) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.cta.ghost { background: var(--paper); color: var(--ink); }
.cta.pen { background: var(--pen); border-color: var(--pen); color: var(--on-pen); }
.linkbtn { color: var(--pen); font: 700 var(--t-sm) var(--f); min-height: 44px; display: flex; align-items: center; justify-content: space-between; width: 100%; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.linkbtn span { text-decoration: none; }
.addset { justify-self: start; font: 800 var(--t-sm) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; color: var(--pen); min-height: 44px; padding: 0 8px 0 2px; }

/* ---------- coach note (the coach's hand, in ballpoint) ---------- */
.brief { display: grid; gap: var(--s2); padding: var(--s4) 0 var(--s4); border-bottom: var(--rule); }
.who { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.who i { display: none; }
.serif-h { margin: 2px 0 0; font: italic 400 1.95rem/1.1 var(--f-serif); color: var(--pen); letter-spacing: -.01em; text-wrap: balance; }
.brief p { margin: 0; font: italic 400 1.125rem/1.6 var(--f-serif); color: var(--pen); max-width: 62ch; }
.who.calc + .serif-h, .who.calc ~ p { color: var(--ink); font-style: normal; }
.one { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s3); margin-top: var(--s2); padding-top: var(--s3); border-top: var(--hair); }
.one .t { display: contents; }
.one .t > span:last-child { font: 600 var(--t-md)/1.4 var(--f); min-width: 0; }

/* ---------- numbers block: label | big number | target, then a tally bar ---------- */
.nums { border-bottom: var(--rule); }
.nrow { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); align-items: end; padding: var(--s3) 0 var(--s4); border-bottom: var(--hair); width: 100%; text-align: left; }
.nrow:last-child { border-bottom: 0; }
@media (hover: hover) { button.nrow:hover .lbl > span:first-child { color: var(--pen); text-decoration: underline; } }
.nrow .lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: var(--s2); }
.nrow .val { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.nrow .val small { font: 700 var(--t-sm) var(--f); font-stretch: 75%; color: var(--ink-2); }
.nrow .tgt { text-align: right; font: 600 var(--t-sm)/1.3 var(--f); color: var(--ink-2); }
.nrow .tgt b { display: block; font: 800 var(--t-lg)/1 var(--f); font-stretch: 62%; color: var(--ink); }
.nrow .bar, .nrow .ruler { grid-column: 1 / -1; margin-top: var(--s2); display: block; }
.nil { color: var(--ink-3); font-weight: 400 !important; }
.nrow .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: var(--s2); font-size: var(--t-sm); color: var(--ink-2); flex-wrap: wrap; }
.meter { display: grid; gap: var(--s2); width: 100%; }
.meter .mh { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.meter .ml { font: 700 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.meter .ml i { display: none; }
.meter .mv { display: flex; align-items: baseline; gap: 6px; }
.meter .mv b { font: 800 var(--t-2xl)/.95 var(--f); font-stretch: 62%; }
.meter .mv small { font-size: var(--t-sm); color: var(--ink-2); }
.meter .mf { font-size: var(--t-sm); color: var(--ink-2); display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.meters { display: grid; gap: var(--s5); }
/* tally bar: outlined box, solid ink fill, target range hatched, floor in red pen */
.track { display: block; position: relative; height: 16px; border: 1.5px solid var(--ink); background: var(--paper); }
.track u { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 6px); opacity: .55; }
.track s { position: absolute; top: -6px; bottom: -6px; width: 2.5px; margin-left: -1.25px; background: var(--red); }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width .9s var(--ease); }
.track.sm { height: 10px; }

/* ---------- ruler (tape from start weight to goal) ---------- */
.cut { display: grid; gap: var(--s3); }
.ruler { position: relative; height: 52px; margin: 0 4px; }
.ruler .base { position: absolute; left: 0; right: 0; top: 0; height: 28px; border-bottom: 2px solid var(--ink); }
.ruler .tk { position: absolute; top: 16px; width: 1.5px; height: 12px; margin-left: -.75px; background: var(--ink-3); }
.ruler .tk.maj { top: 6px; height: 22px; width: 2px; background: var(--ink); }
.ruler .tl { position: absolute; top: 33px; transform: translateX(-50%); font: 700 var(--t-xs) var(--f); font-stretch: 75%; color: var(--ink-2); white-space: nowrap; }
.ruler .tl.end { color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.ruler .tl.end.l { transform: none; } .ruler .tl.end.r { transform: translateX(-100%); }
.ruler .done { position: absolute; top: 22px; height: 6px; background: var(--ink); transition: width 1s var(--ease); }
.ruler .mark { position: absolute; top: -4px; width: 0; height: 0; transition: left 1s var(--ease); }
.ruler .mark::before { content: ""; position: absolute; left: -7px; top: 0; border: 7px solid transparent; border-top: 10px solid var(--pen); }
.ruler .mark::after { content: ""; position: absolute; left: -1.5px; top: 8px; width: 3px; height: 22px; background: var(--pen); }

/* ---------- ruled tables / lists ---------- */
.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: var(--hair); }
.li:first-child { border-top: 0; padding-top: 0; }
.li:last-child { padding-bottom: 0; }
.li .sub { grid-column: 1 / -1; color: var(--ink-2); font-size: var(--t-sm); min-width: 0; }
.li b { font-weight: 700; }
.nx { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; border-top: var(--hair); min-height: 52px; }
.nx:first-of-type { border-top: 0; }
.nx .tm { font: 800 var(--t-lg) var(--f); font-stretch: 62%; }
.nx .w { display: grid; min-width: 0; }
.nx .w b { font-weight: 700; }
.nx .w span { font-size: var(--t-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.meal { display: grid; grid-template-columns: 62px 1fr auto; gap: var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: var(--hair); }
.meal:first-child { border-top: 0; padding-top: 0; }
.meal .ic { width: 16px; height: 16px; border: 2px solid var(--ink); align-self: start; margin-top: 3px; }
.meal .ic svg { display: none; }
.meal .ic.chk-on { background: var(--ink); }
.meal .nm { min-width: 0; }
.meal .nm b { display: block; font-weight: 700; }
.meal .nm span { color: var(--ink-2); font-size: var(--t-sm); }
.meal .q { text-align: right; font: 600 var(--t-xs) var(--f); font-stretch: 75%; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.meal .q b { display: block; color: var(--ink); font: 800 var(--t-lg)/1 var(--f); font-stretch: 62%; letter-spacing: 0; white-space: nowrap; }
.subh { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); margin: var(--s4) 0 var(--s2); padding-top: var(--s3); border-top: 1.5px solid var(--ink); }

/* ---------- grid cells (signals, recovery, stats): ruled boxes, no fills ---------- */
.signals, .stat3, .kvg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); border-left: 1.5px solid var(--ink); }
.stat3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.signals > *, .stat3 > div, .kvg > div { border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); padding: var(--s3); min-width: 0; display: grid; gap: 3px; align-content: start; text-align: left; }
.signals .k, .stat3 .eyebrow, .kvg .k { font: 700 var(--t-xs)/1.2 var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.signals .k i { display: none; }
.signals b, .rec b { font: 800 var(--t-2xl)/.95 var(--f); font-stretch: 62%; }
.signals b small, .rec b small { font: 700 var(--t-sm) var(--f); font-stretch: 75%; color: var(--ink-2); margin-left: 3px; }
.signals .g, .rec .u { font-size: var(--t-sm); color: var(--ink-2); }
.rec .u.unv { color: var(--amber); font-weight: 600; }
.stat3 b, .kvg b { display: block; font: 800 var(--t-lg)/1.05 var(--f); font-stretch: 62%; }
.kvg b small { font: 700 var(--t-xs) var(--f); color: var(--ink-2); }
.insight { margin: var(--s3) 0 0; font-size: var(--t-sm); line-height: 1.5; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
.insight::before { content: "!"; flex: none; width: 16px; height: 16px; display: grid; place-items: center; background: var(--hi); color: var(--on-hi); font: 800 11px/1 var(--f); }
.sig { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--hi); color: var(--on-hi); font: 800 var(--t-sm) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; }
.sig i { display: none; }

/* ---------- segmented controls & chips: boxed options ---------- */
.seg { display: inline-flex; border: var(--rule); }
.seg button { min-height: 44px; padding: 0 12px; font: 800 var(--t-sm) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); border-left: var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.scroller { display: flex; overflow-x: auto; scrollbar-width: none; border: var(--rule); }
.scroller::-webkit-scrollbar { display: none; }
.chipday, .daychips button { flex: 1 0 64px; min-height: 56px; padding: 8px 6px; display: grid; gap: 1px; text-align: center; align-content: center; border-left: var(--rule); background: var(--paper); }
.chipday:first-child, .daychips button:first-child { border-left: 0; }
.chipday .l, .daychips .l { font: 700 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.chipday .n { font: 800 var(--t-lg)/1 var(--f); font-stretch: 62%; }
.daychips .nm { font: 800 var(--t-md)/1.05 var(--f); font-stretch: 62%; text-transform: uppercase; }
.chipday[aria-pressed="true"], .daychips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chipday[aria-pressed="true"] .l, .daychips button[aria-pressed="true"] .l { color: var(--paper); }
.daychips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: var(--rule); }

/* ---------- charts: ink only ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font: 700 12px var(--f); font-stretch: 75%; font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit.on { fill: var(--hi); fill-opacity: .55; }
.chart-tip { min-height: 22px; font-size: var(--t-sm); color: var(--ink-2); margin-top: var(--s2); }
.chart-tip b { color: var(--ink); font-weight: 800; }
.empty { display: grid; gap: var(--s2); padding: var(--s4); border: 1.5px dashed var(--ink-3); color: var(--ink-2); font-size: var(--t-sm); }
.empty svg { display: none; }
.boxes { display: flex; gap: 6px; }
.boxes i { width: 22px; height: 22px; border: 2px solid var(--ink); display: grid; place-items: center; font: 900 14px/1 var(--f); font-style: normal; }
.boxes i.on { background: var(--ink); color: var(--paper); }
.band { position: relative; height: 16px; border: 1.5px solid var(--ink); margin: var(--s2) 0; }
.band u { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 6px); opacity: .55; }
.band i { position: absolute; top: -6px; width: 4px; height: 26px; background: var(--pen); transform: translateX(-50%); }
.dtr { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 4px var(--s3); align-items: center; padding: var(--s3) 0; border-top: var(--hair); }
.dtr:first-child { border-top: 0; padding-top: 0; }
.dtr .eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink); }
.dtr .val { margin-top: 2px; font: 800 var(--t-lg)/1 var(--f); font-stretch: 62%; }
.dtr .val small { color: var(--ink-2); font: 600 var(--t-xs) var(--f); }
.stack { display: flex; height: 16px; border: 1.5px solid var(--ink); }
.stack i { display: block; height: 100%; min-width: 2px; border-right: 1.5px solid var(--paper); }
.lgd { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-sm); color: var(--ink-2); }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { width: 10px; height: 10px; border: 1px solid var(--ink); }
.lgd b { color: var(--ink); font-weight: 700; }

/* ---------- labs ---------- */
.labrow { padding: var(--s3) 0; border-top: var(--hair); display: grid; gap: 6px; }
.labrow:first-of-type { border-top: 0; padding-top: 0; }
.labrow .v { font: 800 var(--t-lg) var(--f); font-stretch: 62%; }
.rtrack { position: relative; height: 10px; border: 1.5px solid var(--ink); margin: 6px 0; }
.rtrack u { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 6px); opacity: .55; }
.rtrack i { position: absolute; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%) rotate(45deg); background: var(--c); }

/* ---------- train ---------- */
.session { display: grid; gap: var(--s2); }
.session h3 { margin: 0; font: 800 var(--t-3xl)/.9 var(--f); font-stretch: 62%; text-transform: uppercase; }
.exlist { display: grid; margin-top: var(--s2); border-top: var(--rule); }
.ex { display: grid; grid-template-columns: 28px 1fr auto; gap: 2px var(--s3); align-items: baseline; padding: var(--s3) 0; border-bottom: var(--hair); }
.ex .n { font: 800 var(--t-lg) var(--f); font-stretch: 62%; color: var(--ink); }
.ex .m { font: 800 var(--t-md) var(--f); font-stretch: 62%; text-align: right; white-space: nowrap; }
.ex .x { grid-column: 2 / -1; font-size: var(--t-xs); color: var(--ink-2); }
.goalbar { height: 12px; border: 1.5px solid var(--ink); }
.goalbar i { display: block; height: 100%; background: var(--ink); transition: width .4s var(--ease); }
.lgx { display: grid; gap: var(--s3); }
.lgx .exh { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.lgx .exh b { font: 800 var(--t-xl)/1 var(--f); font-stretch: 62%; text-transform: uppercase; }
.tgt { display: flex; gap: 6px; flex-wrap: wrap; }
.colh, .setrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 60px 52px; gap: 6px; align-items: center; }
.colh { font: 700 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.setrow input { width: 100%; min-width: 0; height: 52px; font: 800 var(--t-xl) var(--f); font-stretch: 62%; text-align: center; padding: 0 4px; border: var(--rule); border-radius: 0; background: var(--paper); color: var(--ink); }
.setrow input:focus { outline: none; border-color: var(--pen); box-shadow: inset 0 0 0 1.5px var(--pen); }
.setrow input::placeholder { color: var(--ink-3); font-weight: 600; font-size: var(--t-md); }
.setrow .ok { height: 52px; border: var(--rule); display: grid; place-items: center; background: var(--paper); }
.setrow .ok svg { width: 22px; height: 22px; stroke: var(--ink-3); fill: none; stroke-width: 3; stroke-linecap: square; }
.setrow.done .ok { background: var(--ink); }
.setrow.done .ok svg { stroke: var(--paper); }
.setrow.done input { background: var(--tint); }
.setrow .sn { height: 52px; display: grid; place-items: center; font: 800 var(--t-lg) var(--f); font-stretch: 62%; border: 2px dashed var(--ink-3); }
.setrow.warm .sn { background: var(--hi); color: var(--on-hi); border: 2px solid var(--hi); }
.setrow input.need { border-color: var(--red); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.exh .more { width: 44px; height: 44px; display: grid; place-items: center; border: var(--rule); }
.exh .more svg { width: 20px; height: 20px; fill: currentColor; }
.lgx.skipped { opacity: .5; }
.lgx .sum { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.lgx .sum .tick { width: 30px; height: 30px; background: var(--ink); display: grid; place-items: center; flex: none; }
.lgx .sum .tick svg { width: 16px; height: 16px; stroke: var(--paper); fill: none; stroke-width: 3.5; stroke-linecap: square; }
.rest { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 4px; display: flex; align-items: center; gap: 4px; border: var(--rule); }
.rest button { color: inherit; font: 800 var(--t-sm) var(--f); font-stretch: 75%; min-height: 44px; padding: 0 12px; min-width: 52px; border: 1.5px solid currentColor; }
.rest .clock { font: 800 1.75rem/1 var(--f); font-stretch: 62%; padding: 0 12px; min-width: 76px; text-align: center; }
.rest.go { background: var(--hi); color: var(--on-hi); border-color: var(--hi); }

/* ---------- forms: boxes on a form ---------- */
.field, .field2 { display: grid; gap: 6px; }
.field label, .field2 label { font: 700 var(--t-xs)/1.2 var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field2 input, .inp { width: 100%; min-height: 52px; border: var(--rule); border-radius: 0; background: var(--paper); color: var(--ink); padding: 0 14px; font: 500 var(--t-md) var(--f); }
.field input:focus, .field2 input:focus, .inp:focus { outline: none; border-color: var(--pen); box-shadow: inset 0 0 0 1.5px var(--pen); }
.field input::placeholder, .field2 input::placeholder, .inp::placeholder { color: var(--ink-3); }
.inp.big { font: 800 var(--t-3xl) var(--f); font-stretch: 62%; text-align: center; min-height: 84px; }
.err { color: var(--red); font-size: var(--t-sm); font-weight: 600; margin: 0; display: flex; gap: 8px; align-items: baseline; }
.err::before { content: "▲"; flex: none; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: var(--rule); }
.opt2 { min-height: 50px; background: var(--paper); color: var(--ink); font: 800 var(--t-md) var(--f); font-stretch: 75%; text-align: center; border-left: var(--rule); }
.opts > .opt2:first-child { border-left: 0; }
.logmodes .opt2 { min-height: 48px; font-size: var(--t-sm); letter-spacing: .04em; text-transform: uppercase; }
.opt2[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.opt2.sm { min-height: 44px; padding: 0 14px; font-size: var(--t-sm); }
.chk { display: flex; align-items: center; gap: 12px; font-size: var(--t-base); min-height: 44px; }
.chk input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; margin: 0; background: var(--paper); }
.chk input:checked { background: var(--ink); }
.chk input:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--paper); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.adj { display: grid; gap: var(--s3); padding-top: var(--s3); border-top: var(--hair); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 56px; padding: 0 14px; border: var(--rule); text-align: left; font-weight: 600; }
.toggle .sw { width: 52px; height: 30px; border: var(--rule); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--ink-3); transition: left .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--ink); }
.toggle[aria-pressed="true"] .sw::after { left: 25px; background: var(--paper); }
.st { font: 800 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; } .st.wait { background: var(--hi); color: var(--on-hi); padding: 1px 5px; } .st.done { color: var(--ink); }

/* ---------- lock screen ---------- */
.setup { display: grid; gap: var(--s5); padding-top: max(10vh, 40px); max-width: 440px; width: 100%; margin: 0 auto; }
.setup .logo { display: flex; align-items: center; gap: var(--s3); }
.setup .logo svg { width: 40px; height: 40px; }
.setup .logo b { font: 900 2rem/1 var(--f); font-stretch: 62%; letter-spacing: .02em; }
.setup h2 { margin: 0; font: 800 3.5rem/.9 var(--f); font-stretch: 62%; text-transform: uppercase; border-top: 4px solid var(--ink); padding-top: var(--s3); }
.setup p { margin: 0; color: var(--ink-2); font-size: var(--t-md); }
.setup form { display: grid; gap: var(--s4); }
.setup .passwrap { position: relative; }
.setup .passwrap input { padding-right: 72px; }
.setup .passwrap button { position: absolute; right: 2px; top: 2px; bottom: 2px; padding: 0 12px; font: 800 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--pen); }
.setup .fine { font-size: var(--t-xs); color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.setup .fine svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }

/* ---------- navigation: bottom bar on phones, top bar on wide screens ---------- */
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 4px solid var(--ink);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar [data-tab], .tabbar .logbtn { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: var(--nav-h); font: 800 var(--t-sm) var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); border-left: 2px solid var(--ink); }
.tabbar > :first-child { border-left: 0; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
.tabbar [aria-current="page"] { background: var(--ink); color: var(--paper); }
.tabbar .logbtn { background: var(--pen); color: var(--on-pen); }
.tabbar .logbtn span { display: contents; }

/* ---------- body state panel (glanceable): stamp verdict + three instruments ---------- */
.vitals { padding: var(--s4) 0 var(--s4); border-bottom: var(--rule); display: grid; gap: var(--s3); }
.vh { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.stamprow { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); align-items: center; }
.stamp { display: inline-block; padding: 6px 10px 5px; border: 3px solid var(--ink); font: 900 1.375rem/1 var(--f); font-stretch: 62%; letter-spacing: .03em; text-transform: uppercase; transform: rotate(-2deg); white-space: nowrap; }
.stamp.ok { color: var(--ink); }
.stamp.bad { color: var(--red); border-color: var(--red); background: var(--hi); }
.stamp.wait { color: var(--ink-2); border-style: dashed; border-color: var(--ink-2); }
.stamprow .say { font-size: var(--t-sm); line-height: 1.4; color: var(--ink-2); }
.vgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--ink); }
.vcell { display: grid; gap: 4px; align-content: start; padding: var(--s3) var(--s3) var(--s3); border-left: 1.5px solid var(--ink); text-align: left; min-width: 0; }
.vcell:first-child { border-left: 0; }
.vcell .k { font: 700 var(--t-xs)/1.2 var(--f); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.vcell b { font: 800 var(--t-2xl)/.95 var(--f); font-stretch: 62%; }
.vcell b small { font: 700 var(--t-sm) var(--f); font-stretch: 75%; color: var(--ink-2); margin-left: 3px; }
.vcell .g { font-size: var(--t-sm); line-height: 1.3; color: var(--ink-2); }
.dev { display: block; position: relative; height: 12px; border: 1.5px solid var(--ink); margin: 2px 0; }
.dev u { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--ink) 0 1.5px, transparent 1.5px 5px); opacity: .45; }
.dev i { position: absolute; top: 0; bottom: 0; background: var(--ink); }
.dev b { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--pen); }
.dev.sleep b { display: none; }
.dev s { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--red); }
.dev em { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--pen); }
.vfoot { display: flex; flex-wrap: wrap; gap: 0 var(--s4); font-size: var(--t-sm); color: var(--ink-2); }
.vfoot button { min-height: 44px; }
.vfoot b { color: var(--ink); font: 800 var(--t-md) var(--f); font-stretch: 62%; }
@media (max-width: 370px) { .stamprow { grid-template-columns: 1fr; } .vcell { padding: var(--s2); } }

.journey { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
.journey li { display: grid; grid-template-columns: 26px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-bottom: var(--hair); }
.journey .jk { width: 22px; height: 22px; border: 2px solid var(--ink); display: grid; place-items: center; font: 900 14px/1 var(--f); }
.journey li.done .jk { background: var(--ink); color: var(--paper); }
.journey .jt { display: grid; min-width: 0; }
.journey .jt b { font: 800 var(--t-md)/1.15 var(--f); font-stretch: 75%; text-transform: uppercase; letter-spacing: .03em; }
.journey .jt span { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.35; }
.journey li.done .jt span { color: var(--ink-3); }
.journey .jr { display: grid; justify-items: end; gap: 6px; text-align: right; }
.journey .jn { font: 800 var(--t-lg)/1 var(--f); font-stretch: 62%; }
.journey .boxes i { width: 16px; height: 16px; font-size: 10px; }
@media (max-width: 420px) { .journey li { grid-template-columns: 26px 1fr; } .journey .jr { grid-column: 2; justify-items: start; text-align: left; } }

/* ---------- sheets & panes ---------- */
.pane, .sheet { position: fixed; z-index: 45; inset: 0; background: var(--scrim); display: grid; align-items: end; animation: fadein .15s ease; }
.sheet { z-index: 50; }
.pane .sheetbox, .sheet .panel { background: var(--paper); border-top: 4px solid var(--ink); max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--s3) max(var(--s4), env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px));
  display: grid; gap: var(--s4); max-width: 640px; width: 100%; margin: 0 auto; animation: rise .22s var(--ease); }
.grab { width: 44px; height: 4px; background: var(--ink); justify-self: center; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding-bottom: var(--s3); border-bottom: var(--rule); }
.ph h2, .pane-title { margin: 0; font: 800 var(--t-2xl)/.95 var(--f); font-stretch: 62%; text-transform: uppercase; }
.sec { padding: 0 0 var(--s4); border-bottom: var(--hair); display: grid; gap: var(--s3); }
.sec:last-of-type { border-bottom: 0; }
.sec > .row .lab { margin: 0; }
.sec .lab { padding: 0; border: 0; }
.sheet textarea { width: 100%; min-height: 240px; border: var(--rule); border-radius: 0; background: var(--paper); color: var(--ink); font: var(--t-sm)/1.55 var(--f); padding: var(--s3); resize: vertical; }
.menu .panel { gap: 0; }
.menu .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 var(--s2); border-bottom: var(--hair); font: 600 var(--t-md) var(--f); text-align: left; gap: var(--s3); }
.menu .opt.danger { color: var(--red); }
.menu .opt small { color: var(--ink-2); font-size: var(--t-xs); }
.srcs { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: var(--t-base); line-height: 1.45; }
.srcs b { font-weight: 700; }
.srcs .g { width: 10px; height: 10px; margin-top: 6px; background: var(--ink); }
.srcs .g.est { background: transparent; border: 1.5px dashed var(--ink); }
.srcs .g.calc { background: transparent; border: 1.5px solid var(--ink); }
.layer { display: grid; grid-template-columns: 28px 1fr; gap: 10px; line-height: 1.45; }
.layer .n { font: 800 var(--t-lg) var(--f); font-stretch: 62%; }
.explain-what { margin: 0; font: italic 400 1.1875rem/1.5 var(--f-serif); color: var(--pen); }
.divide { display: grid; gap: var(--s3); padding-top: var(--s4); border-top: var(--hair); }
.tpl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: var(--rule); }
.tpl button { display: grid; justify-items: center; gap: 6px; padding: 14px 4px; border-left: var(--rule); font: 800 var(--t-xs) var(--f); font-stretch: 75%; letter-spacing: .05em; text-transform: uppercase; }
.tpl button:first-child { border-left: 0; }
.tpl button i { display: grid; place-items: center; }
.tpl button svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; }
.tl { display: grid; }
.ti { display: grid; grid-template-columns: 52px 1fr; gap: 0 var(--s3); border-top: var(--hair); padding: var(--s2) 0; }
.ti:first-child { border-top: 0; }
.ti .time { font: 800 var(--t-lg)/1.2 var(--f); font-stretch: 62%; }
.ti .rail { display: none; }
.ti .body { min-width: 0; }
.ti .body b { font-weight: 700; display: block; }
.ti .body span { color: var(--ink-2); font-size: var(--t-sm); }
.ti .body .kv { font-size: var(--t-xs); color: var(--ink-2); margin-top: 2px; display: block; }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--paper); border: var(--rule);
  min-height: 48px; padding: 8px 16px; font: 700 var(--t-sm) var(--f); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; animation: drop .2s var(--ease); }
.toast button { font: 800 var(--t-sm) var(--f); color: var(--hi); text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; text-transform: uppercase; }

/* ---------- loading ---------- */
.skel { display: grid; gap: var(--s3); padding-top: var(--s4); }
.skel i { display: block; border: 1.5px dashed var(--ink-3); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .4; } }

/* ---------- motion ---------- */
.fade { animation: fadein .2s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(16px); } to { transform: none; } }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (hover: hover) {
  .roundbtn:hover { background: var(--tint); }
  .avatar:hover { background: var(--ink); }
  .btn:hover { background: var(--tint); }
  .cta:hover { background: var(--ink-2); border-color: var(--ink-2); }
  .cta.ghost:hover { background: var(--tint); }
  .signals button:hover { background: var(--tint); }
  .menu .opt:hover { background: var(--tint); }
  .tpl button:hover { background: var(--tint); }
  .btn.primary:hover, .btn.train:hover, .cta.pen:hover { background: var(--pen); border-color: var(--pen); filter: brightness(1.12); }
}
/* ---------- responsive ---------- */
.cols { display: grid; gap: 0; }
.col { display: grid; align-content: start; gap: 0; min-width: 0; }
@media (max-width: 370px) {
  .big, .session h3 { font-size: 3.1rem; }
  .head h1 { font-size: 2.3rem; }
  .colh, .setrow { grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr) 52px 46px; gap: 4px; }
  .tpl { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  :root { --nav-h: 0px; }
  .wrap { max-width: 1320px; padding: 0 var(--s7) var(--s8); }
  .head { padding-top: var(--s5); }
  .head h1 { font-size: 3.5rem; }
  .tabbar { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 4px solid var(--ink); display: flex; padding: 0; width: calc(100% - 2 * var(--s7)); max-width: calc(1320px - 2 * var(--s7)); margin: 0 auto; }
  .tabbar > :first-child { border-left: 2px solid var(--ink); }
  .tabbar [data-tab], .tabbar .logbtn { grid-auto-flow: column; gap: 8px; min-height: 52px; padding: 0 var(--s5); border-left: 0; border-right: 2px solid var(--ink); font-size: var(--t-md); }
  .tabbar .logbtn { order: 9; margin-left: auto; border-right: 0; border-left: 2px solid var(--ink); }
  .tabbar svg { width: 20px; height: 20px; }
  body.authed .wrap { padding-top: 0; }
  .cols { grid-template-columns: 1.15fr 1fr 1fr; column-gap: var(--s7); }
  .cols.two { grid-template-columns: 1fr 1fr; }
  .view.narrow { max-width: 760px; }
  .pane { align-items: stretch; justify-items: end; }
  .pane .sheetbox { max-width: 480px; max-height: none; height: 100%; margin: 0; border-top: 0; border-left: 4px solid var(--ink); animation: slide .22s var(--ease); }
  .sheet { align-items: center; }
  .sheet .panel { border: 4px solid var(--ink); max-height: 86vh; }
  .grab { display: none; }
  .rest { bottom: 24px; }
}
@keyframes slide { from { transform: translateX(24px); } to { transform: none; } }
@media (min-width: 640px) and (max-width: 999px) { .wrap { max-width: 720px; } }
</style>
</head>
<body>
<nav class="tabbar" id="tabs" aria-label="Main" hidden>
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17"/><path d="M9 2.5h6v3H9zM8.5 10h7M8.5 14h7M8.5 18h4"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>Train</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>Progress</button>
  <button class="logbtn" id="fab" aria-label="Log weight, a meal, water or supplements"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Log</button>
</nav>
<div class="wrap" id="app">
  <header class="head" id="head" hidden>
    <div class="t"><h1 id="greet">Cut Log</h1><span class="lbl" id="dateline">—</span></div>
    <button class="roundbtn" id="refresh" aria-label="Refresh data"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="roundbtn avatar" id="settings" aria-label="You: profile, appearance and privacy">CL</button>
  </header>

  <section id="v-setup" class="setup" hidden aria-labelledby="setup-h">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 34 34"><path d="M5 6v22M11 9v19M17 12v16M23 15v13" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="square"/><path d="M29 18v10" stroke="var(--pen)" stroke-width="3.2" stroke-linecap="square"/></svg><b>CUT LOG</b></div>
    <h2 id="setup-h">Today's sheet is locked</h2>
    <p>Type your Cut Log password once. This phone remembers it.</p>
    <form id="setup-form" novalidate>
      <div class="field"><label for="f-pass">Password</label><div class="passwrap"><input id="f-pass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="setup-err"><button type="button" id="peek" aria-pressed="false">Show</button></div></div>
      <p class="err" id="setup-err" role="alert" hidden></p>
      <button class="cta" type="submit" id="unlock">Unlock</button>
      <button class="cta ghost" type="button" id="forget" hidden>Remove password from this phone</button>
    </form>
    <span class="fine"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Unlocked on this phone only. The password never leaves it.</span>
  </section>

  <div id="loading" class="skel" hidden aria-label="Loading your data" role="status"><i style="height:120px"></i><i style="height:180px"></i><i style="height:120px"></i></div>
  <section id="v-today" hidden aria-label="Today"></section>
  <section id="v-progress" hidden aria-label="Progress"></section>
  <section id="v-train" hidden aria-label="Train"></section>
</div>

<div class="pane" id="pane" hidden><div class="sheetbox" id="pane-box" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
<div class="rest" id="rest" hidden role="timer" aria-label="Rest timer"><button data-rest="-15" aria-label="15 seconds less">−15</button><span class="clock" id="rest-clock">0:00</span><button data-rest="15" aria-label="15 seconds more">+15</button><button data-rest="skip">Skip</button></div>
<div class="sheet menu" id="menu" hidden><div class="panel" id="menu-panel" role="dialog" aria-modal="true" aria-label="Options"></div></div>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="ph"><h2 id="sheet-title">Check in</h2><button class="btn" id="sheet-close">Close</button></div>
  <label class="muted" for="sheet-text" style="font-size:var(--t-sm)">Fill the blanks, then copy and paste into Claude. Blank lines are fine.</label>
  <textarea id="sheet-text" spellcheck="false"></textarea>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)"><button class="cta" id="sheet-copy">Copy</button><a class="cta ghost" href="https://claude.ai/code" target="_blank" rel="noopener">Open Claude</a></div>
  <button class="cta ghost" id="sheet-clear" hidden style="width:100%">Sent it: clear this workout from the phone</button>
</div></div>


<script>
(() => {
  const KEY = "cutlog.v1";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
  };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v, d = 0) => (v == null || Number.isNaN(+v) ? null : Number(v).toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const nice = (s) => String(s || "").replace(/_/g, " ");
  const stripId = (s) => String(s || "").replace(/^SUB-\d{4} /, "").replace(/ \(\d+ g P\)$/, "");
  const pOf = (s) => (String(s || "").match(/\((\d+) g P\)/) || [])[1];
  let TAB_LOGGING = false;
  let D = null, TAB = "today", RANGE = 30, SEL = null, FOODSEL = null, TRAINSEL = null;

  const dubaiISO = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dubai", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const dubaiHour = () => +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", hour12: false }).format(new Date());
  const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const isoOf = (dt) => dt.toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
  const dowOf = (iso) => DOW[parse(iso).getUTCDay()];
  const menuLabel = (iso) => `${dowOf(iso)} ${iso.slice(8, 10)}`;
  const mondayOf = (iso) => { const g = parse(iso).getUTCDay(); return addDays(iso, g === 0 ? -6 : 1 - g); };
  const longDate = (iso) => parse(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });

  const b64d = (x) => Uint8Array.from(atob(x), (ch) => ch.charCodeAt(0));
  const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function deriveKey(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter }, base, 256);
    return b64e(bits);
  }
  async function decryptBlob(blob, rawKeyB64) {
    const key = await crypto.subtle.importKey("raw", b64d(rawKeyB64), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(blob.iv) }, key, b64d(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function fetchBlob() {
    const r = await fetch(`data.enc.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "No data published yet. Ask your coach to publish." : `Couldn't load (${r.status}). Try again.`);
    return r.json();
  }
  async function load({ quiet } = {}) {
    const cfg = store.get();
    if (!cfg.key) { showSetup(); return; }
    if (!D) $("#loading").hidden = false;
    $("#refresh").classList.add("spin");
    try {
      const blob = await fetchBlob();
      let key = cfg.key;
      if (cfg.salt !== blob.salt || cfg.iter !== blob.iter) {
        if (!cfg.pass) throw new Error("The lock changed. Type your password again.");
        key = await deriveKey(cfg.pass, blob.salt, blob.iter);
      }
      try { D = await decryptBlob(blob, key); }
      catch { store.set({ cache: cfg.cache }); throw new Error("Password no longer matches. Type the current one."); }
      store.set({ ...store.get(), key, salt: blob.salt, iter: blob.iter, cache: D });
      render();
    } catch (e) {
      const c = store.get();
      if (c.cache && c.key) { D = c.cache; render(); $("#dateline").textContent = "Offline copy. " + e.message; }
      else if (!quiet) showSetup(e.message);
    } finally { $("#refresh").classList.remove("spin"); }
  }

  function showSetup(err) {
    ["today", "train", "progress"].forEach((t) => ($(`#v-${t}`).hidden = true));
    $("#v-setup").hidden = false; $("#tabs").hidden = true; $("#loading").hidden = true; $("#pane").hidden = true; $("#head").hidden = !D;
    const c = store.get();
    $("#forget").hidden = !c.key;
    $("#setup-err").hidden = !err; $("#setup-err").textContent = err || "";
  }
  function showTab(t) {
    if (t === "trend" || t === "health") t = "progress";
    TAB = t; $("#v-setup").hidden = true; $("#loading").hidden = true;
    ["today", "train", "progress"].forEach((x) => ($(`#v-${x}`).hidden = x !== t));
    document.querySelectorAll("#tabs [data-tab]").forEach((b) => (b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    try { localStorage.setItem(KEY + ".tab", t); } catch {}
    const v = $(`#v-${t}`); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade");
    requestAnimationFrame(() => requestAnimationFrame(animateRings));
  }

  const seriesMap = () => Object.fromEntries((D.series || []).map((s) => [s.date, s]));
  const menuRows = () => Object.values(D.menus || {}).flat();
  // menus are matched by date when data.json has it (older data: by "Tue 03" label)
  const menuFor = (iso) => menuRows().find((r) => (r.date ? r.date === iso : r.day === menuLabel(iso))) || null;
  // ---------- week schedule (training/week_plan.yaml via data.json; default Mon/Tue/Thu/Fri when absent) ----------
  const progById = (id) => (D.program || []).find((p) => p.id === id) || null;
  const schedStart = () => mondayOf((D.generated_at || dubaiISO()).slice(0, 10));
  const inSched = (iso) => !!(D.schedule && D.schedule.days) && iso >= schedStart() && iso < addDays(schedStart(), 14);
  const planOf = (iso) => (inSched(iso) ? D.schedule.days.find((r) => r.date === iso) || null : null);
  function sessionFor(iso) {
    if (inSched(iso)) { const r = planOf(iso); return r && r.status !== "missed" && r.status !== "skipped" ? progById(r.logged || r.session) : null; }
    const i = (D.gym_days || []).indexOf(dowOf(iso)); return i >= 0 ? (D.program || [])[i] : null;
  }
  const isGym = (iso) => !!sessionFor(iso);
  const weekNote = (iso) => (D.schedule && D.schedule.notes && D.schedule.notes[isoWeek(iso)]) || null;
  function isoWeek(iso) { const d = parse(iso); const t = new Date(d); t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7)); const y = t.getUTCFullYear(), w1 = new Date(Date.UTC(y, 0, 4)); return `${y}-W${String(1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getUTCDay() + 6) % 7)) / 7)).padStart(2, "0")}`; }
  // ---------- supplements from profile/supplements.yaml (names, doses, timing as recorded) ----------
  const supList = () => D.supplements || [];
  const supAt = (re) => supList().filter((x) => re.test(x.timing || "") && !["whey", "creatine"].includes(x.id));
  function shakeTxt() { const s = supMap(); if (!s.whey) return null; return `${s.whey.dose || ""} ${s.whey.brand || s.whey.name}${s.creatine ? ` + ${s.creatine.dose || ""} creatine`.replace("  ", " ") : ""}`.trim(); }
  const supNames = (xs) => xs.map((x) => x.name).join(" + ");
  const supMap = () => Object.fromEntries((D.supplements || []).map((x) => [x.id, x]));

  function animateRings() { document.querySelectorAll("[data-fill]").forEach((c) => (c.style.width = c.dataset.fill)); document.querySelectorAll("[data-left]").forEach((c) => (c.style.left = c.dataset.left)); }

  function spark(vals, color, W = 300, H = 56) {
    const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
    if (pts.length < 2) return "";
    const ys = pts.map((p) => p[1]), a = Math.min(...ys), b = Math.max(...ys), n = vals.length - 1;
    const X = (i) => 4 + (i / Math.max(1, n)) * (W - 8), Y = (v) => 6 + (1 - (v - a) / Math.max(0.1, b - a)) * (H - 12);
    const d = pts.map((p, k) => `${k ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    const id = "g" + Math.random().toString(36).slice(2, 7), last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>
      <path d="${d}L${X(last[0])},${H}L${X(pts[0][0])},${H}Z" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  // ---------- DEVICE (Zepp, DEVICE source; absent = not provided, never defaulted) ----------
  const DEV = () => (D.device && D.device.latest) || null;
  const dv = (o, k) => (o && o[k] != null && !Number.isNaN(+o[k]) ? +o[k] : null);
  const SRC = '<span class="src">Watch (Zepp)</span>';
  // data.device.unverified: dotted path prefixes imported but not yet checked against the Zepp app
  const isUnv = (p) => !!p && ((D.device && D.device.unverified) || []).some((x) => (x.endsWith(".") ? p.startsWith(x) : p === x || p.startsWith(x + ".")));
  const UNV = '<span class="src unv" title="Imported from Zepp, not yet checked against the Zepp app">Unverified</span>';
  const tags = (p) => `<span class="tags">${SRC}${isUnv(p) ? UNV : ""}</span>`;
  const dval = (o, k, nd = 0) => { const v = o ? o[k] : null; return v == null ? null : typeof v === "boolean" ? (v ? "yes" : "no") : Number.isNaN(+v) ? esc(v) : fmt(+v, nd); };
  // ---------- body state: the fatigue rule's verdict + sleep / HRV / resting HR against your own baselines ----------
  // deviation bar: centre = baseline, hatched = the rule's normal zone, block = today's deviation
  function devBar(delta, zone, span, worseLow) {
    const P = (x) => Math.max(0, Math.min(100, 50 + (x / span) * 50));
    const lo = worseLow ? P(-zone) : 0, hi = worseLow ? 100 : P(zone);
    const a = Math.min(50, P(delta)), b = Math.max(50, P(delta));
    return `<span class="dev" aria-hidden="true"><u style="left:${lo}%;width:${hi - lo}%"></u><i style="left:${a}%;width:${Math.max(.8, b - a)}%"></i><b></b></span>`;
  }
  function vitalsPanel() {
    const R = D.recovery || {}, T = D.targets, pr = R.params || {}, L = D.latest, today = dubaiISO();
    const when = R.date ? (R.date === today ? "this morning" : "morning of " + longDate(R.date)) : "";
    const sl = R.sleep_today, hrv = R.hrv_today, rhr = R.rhr_today;
    const hb = R.hrv_baseline, rb = R.rhr_baseline, hd = R.hrv_delta_pct, rd = R.rhr_delta;
    let stamp, cls, say;
    if (R.fatigue) { stamp = "Fatigue rule fired"; cls = "bad"; say = `${(R.flags || []).join("; ")}. The plan says an easier session or a rest day: check with your coach.`; }
    else if (R.status === "ok") { stamp = "Within baseline"; cls = "ok"; say = `No fatigue flag: sleep ${pr.sleep_short_h ?? 6}+ h, resting HR and HRV inside your normal range. Train as planned.`; }
    else { const need = Math.max(0, (pr.baseline_min_points || 14) - Math.min(R.rhr_points || 0, R.hrv_points || 0)); stamp = "Building baseline"; cls = "wait"; say = `Your normal range needs ${need} more night${need === 1 ? "" : "s"} of watch data. Until then, go by how you feel.`; }
    const cell = (k, label, v, unit, sub, bar) => `<button class="vcell" data-explain="${k}"><span class="k">${label}</span><b class="${v == null ? "nil" : ""}">${v == null ? "–" : v}<small>${v == null ? "" : unit}</small></b>${bar || ""}<span class="g">${sub}</span></button>`;
    const sleepBar = sl != null ? `<span class="dev sleep" aria-hidden="true"><i style="left:0;width:${Math.min(100, sl / 9 * 100)}%"></i><s style="left:${(pr.sleep_short_h || 6) / 9 * 100}%"></s><em style="left:${T.sleep_min / 9 * 100}%"></em></span>` : "";
    const d = DEV(), rd2 = d && d.readiness && d.readiness.score;
    return `<section class="vitals" aria-label="Body state, ${esc(when)}">
      <div class="vh"><span class="lbl">Body, ${esc(when)}</span>${d ? `<button class="linkbtn" data-open-pane="watch" style="width:auto;min-height:32px">Watch details</button>` : ""}</div>
      <div class="stamprow"><span class="stamp ${cls}">${stamp}</span><span class="say">${esc(say)}</span></div>
      <div class="vgrid">
        ${cell("sleep", "Sleep", sl != null ? fmt(sl, 1) : null, "h", sl != null ? `target ${T.sleep_min}+ h` : "— missing", sleepBar)}
        ${cell("hrv", "HRV", hrv != null ? fmt(hrv) : null, "ms", hrv == null ? "— missing" : hb != null && hd != null ? `${hd > 0 ? "+" : hd < 0 ? "−" : "±"}${fmt(Math.abs(hd))}% vs ${fmt(hb)} baseline` : "baseline building", hrv != null && hd != null ? devBar(hd, pr.hrv_drop_pct || 15, 30, true) : "")}
        ${cell("rhr", "Resting HR", rhr != null ? fmt(rhr) : null, "bpm", rhr == null ? "— missing" : rb != null && rd != null ? `${rd > 0 ? "+" : rd < 0 ? "−" : "±"}${fmt(Math.abs(rd))} vs ${fmt(rb)} baseline` : "baseline building", rhr != null && rd != null ? devBar(-rd, pr.rhr_elevated_bpm || 5, 10, true) : "")}
      </div>
      <div class="vfoot"><button data-explain="steps">Steps <b>${L.steps != null && L.date === today ? fmt(L.steps) : "–"}</b> / ${fmt(T.steps_min)}</button><button data-explain="water">Water <b>${L.water != null && L.date === today ? fmt(L.water, 1) + " L" : "–"}</b> / ${T.water ? T.water[0] + "–" + T.water[1] : "2.5–3.5"} L</button>${rd2 != null ? `<button data-open-pane="watch">Watch readiness <b>${fmt(rd2)}</b></button>` : ""}</div>
    </section>`;
  }
  // one pane section: fields [label, key, unit, decimals]; tags per value only where the section is mixed
  function devSec(title, blk, fields, extra = "", after = "") {
    const d = DEV(), o = d && d[blk], paths = fields.map((f) => `device.${blk}.${f[1]}`);
    const allUnv = paths.every(isUnv);
    const items = fields.map(([label, k, unit, nd], i) => { const v = dval(o, k, nd);
      return `<div><span class="k">${label}</span><b>${v != null ? v + (unit ? `<small>${unit}</small>` : "") : "—"}</b>${!allUnv && isUnv(paths[i]) ? UNV : ""}</div>`; }).join("");
    return `<div class="sec"><div class="row"><span class="lab">${title}</span><span class="tags">${SRC}${allUnv ? UNV : ""}</span></div>
      ${o && typeof o === "object" ? extra + `<div class="kvg">${items}</div>` : `<p class="muted" style="margin:0;font-size:var(--t-sm)">— missing (not recorded by the watch that day)</p>`}${after}</div>`;
  }
  function stackBar(parts, label) {
    const have = parts.filter((p) => p.v != null && p.v > 0), tot = have.reduce((a, p) => a + p.v, 0);
    if (!tot) return "";
    return `<div class="stack" role="img" aria-label="${esc(label)}">${have.map((p) => `<i style="width:${(p.v / tot * 100).toFixed(2)}%;background:${p.c};opacity:${p.o ?? 1}"></i>`).join("")}</div>
      <div class="lgd">${parts.map((p) => `<span><i style="background:${p.c};opacity:${p.o ?? 1}"></i>${p.l} <b class="num">${p.v != null ? fmt(p.v) + p.u : "—"}</b></span>`).join("")}</div>`;
  }
  function watchPane() {
    const d = DEV();
    if (!d) return `<div class="grab"></div><div class="ph"><h2>Watch details</h2><button class="btn" data-close-pane>Close</button></div><p class="muted">— missing: no watch data yet.</p>`;
    const s = d.sleep, st = d.stress, hm = (m) => `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")} min`;
    const asleep = s ? ["deep_min", "light_min", "rem_min"].map((k) => dv(s, k)).filter((v) => v != null) : [];
    const sleepBar = s ? stackBar([{ l: "Deep", v: dv(s, "deep_min"), u: " min", c: "var(--sleep)" }, { l: "Light", v: dv(s, "light_min"), u: " min", c: "var(--sleep)", o: .55 },
      { l: "REM", v: dv(s, "rem_min"), u: " min", c: "var(--sleep)", o: .3 }, { l: "Awake", v: dv(s, "awake_min"), u: " min", c: "var(--line-2)" }], "Sleep stages") : "";
    const sleepSec = `<div class="sec"><div class="row"><span class="lab">Sleep stages</span>${tags("device.sleep")}</div>
      ${s ? `<div class="num" style="font-size:var(--t-base);font-weight:500">${asleep.length ? `Asleep ${hm(asleep.reduce((a, b) => a + b, 0))}${asleep.length < 3 ? " (partial)" : ""}` : "Asleep —"} · woke ${dv(s, "wake_count") != null ? fmt(dv(s, "wake_count")) + "×" : "—"}</div>${sleepBar}` : `<p class="muted" style="margin:0;font-size:var(--t-sm)">— missing (not recorded by the watch that day)</p>`}</div>`;
    const stressBar = st ? stackBar([{ l: "Relaxed", v: dv(st, "relax_pct"), u: "%", c: "var(--sleep)" }, { l: "Normal", v: dv(st, "normal_pct"), u: "%", c: "var(--ok)" },

    drawToday();
    drawProgress();
    drawFood();
    drawTrain();
    $("#head").hidden = false; $("#tabs").hidden = false;
    if (!$("#pane").hidden && $("#pane").dataset.kind === "entries") openPane("entries");
    showTab(TAB);
  }

  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  document.addEventListener("click", (e) => {
    const d = e.target.closest("[data-day]"); if (d) { SEL = d.dataset.day; drawToday(); requestAnimationFrame(() => requestAnimationFrame(animateRings)); return; }
    const hit = e.target.closest(".hit"); if (hit) { showTip(hit); return; }
    const r = e.target.closest("[data-range]"); if (r) { RANGE = +r.dataset.range; drawProgress(); return; }
    const f = e.target.closest("[data-food]"); if (f) { FOODSEL = f.dataset.food; drawFood(); return; }
    const s = e.target.closest("[data-sess]"); if (s) { TRAINSEL = +s.dataset.sess; drawTrain(); return; }
    const t = e.target.closest("[data-tpl]"); if (t) { closePane(); openSheet(t.dataset.tpl); return; }
    const op2 = e.target.closest("[data-open-pane]"); if (op2) { openPane(op2.dataset.openPane, op2.dataset.mode); return; }
    const lm = e.target.closest("[data-ldmode]"); if (lm) { LD.mode = lm.dataset.ldmode; saveLd(LD); openPane("log"); return; }
    const ex = e.target.closest("[data-explain]"); if (ex) { openPane("explain", ex.dataset.explain); return; }
    if (e.target.closest("[data-close-pane]") || e.target.id === "pane") { closePane(); return; }
    if (e.target.closest("#fab")) { if (LD) LD.mode = ""; openPane("log"); return; }
    const gt = e.target.closest("[data-go-train]"); if (gt) { const i = parseInt(gt.dataset.i, 10); if (i >= 0) TRAINSEL = i; drawTrain(); showTab("train"); window.scrollTo({ top: 0 }); return; }
    if (e.target.closest("[data-setup]")) { closePane(); showSetup(); return; }
    const tsb = e.target.closest("[data-theme-set]"); if (tsb) { applyTheme(tsb.dataset.themeSet); openPane("you"); return; }
    const ask = e.target.closest("[data-ask]"); if (ask) { copyText(ask.dataset.ask + "\n(asked from Cut Log)"); return; }
    const ldb = e.target.closest("[data-ld]"); if (ldb) { LD[ldb.dataset.ld] = String(LD[ldb.dataset.ld]) === ldb.dataset.v ? "" : ldb.dataset.v; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    if (e.target.closest("[data-ld-toggle]")) { LD.adj = !LD.adj; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    const wb = e.target.closest("[data-water]"); if (wb) { LD.water = +wb.dataset.water ? LD.water + +wb.dataset.water : 0; saveLd(LD); const y = $("#pane-box").scrollTop; openPane("log"); $("#pane-box").scrollTop = y; return; }
    if (e.target.closest("[data-ld-send]")) {
      const msg = ldMessage(); if (!msg) { toast("Nothing to send yet"); return; }
      const w = parseFloat(num(LD.weight)); if (LD.weight && !(w >= 40 && w <= 200)) { toast("Weight looks off: check the number"); return; }
      const ob = outbox(); ob.push({ at: new Date().toISOString(), date: dubaiISO(), title: [LD.weight && "Weigh-in " + num(LD.weight) + " kg", LD.ate && (LD.meal === "lunch" ? "Lunch" : "Dinner") + " · " + LD.ate, LD.water && "Water", LD.free && "Note"].filter(Boolean).join(" · ") || "Entry", text: msg }); setOutbox(ob);
      LD = { ...ld(), meal: LD.meal }; localStorage.removeItem(LD_KEY);
      closePane(); $("#sheet-title").textContent = "Ready for your coach"; $("#sheet-text").value = msg; $("#sheet-clear").hidden = true; $("#sheet").hidden = false; copyText(msg);
      drawToday(); return;
    }
    const ls = e.target.closest("[data-logstart]"); if (ls) { TAB_LOGGING = true; startLog(+ls.dataset.logstart); return; }
    const dn = e.target.closest("[data-done]"); if (dn) {
      const [id, k] = dn.dataset.done.split(":"), st = LOG.ex[id][+k], row = dn.closest(".setrow");
      if (!st.done && num(st.reps) === "") { const r = row.querySelector('[data-f="reps"]'); r.classList.remove("need"); void r.offsetWidth; r.classList.add("need"); r.focus(); toast("Type the reps first"); return; }
      st.done = !st.done; saveDraft(LOG); row.classList.toggle("done", st.done);
      if (st.done) { startRest(st.warm ? 60 : exOf(id).rest_s); if (exDone(id)) setTimeout(redrawLog, 350); }
      return;
    }
    const as = e.target.closest("[data-addset]"); if (as) { const arr = LOG.ex[as.dataset.addset], prev = [...arr].reverse().find((x) => !x.warm) || {}; arr.push({ kg: prev.kg ?? "", reps: "", rpe: "", done: false, warm: false }); saveDraft(LOG); redrawLog(); return; }
    const sm = e.target.closest("[data-setmenu]"); if (sm) { const [id, k] = sm.dataset.setmenu.split(":"); setMenu(id, +k); return; }
    const em = e.target.closest("[data-exmenu]"); if (em) { exMenu(em.dataset.exmenu); return; }
    const op = e.target.closest("[data-opt]"); if (op) { $("#menu").hidden = true; openMenu.opts[+op.dataset.opt].fn(); saveDraft(LOG); redrawLog(); return; }
    if (e.target.closest("[data-menuclose]") || e.target.id === "menu") { $("#menu").hidden = true; return; }
    const oe = e.target.closest("[data-open]"); if (oe) { LOG.open[oe.dataset.open] = true; saveDraft(LOG); redrawLog(); return; }
    const sh = e.target.closest("[data-shake]"); if (sh) { LOG.shake = !LOG.shake; sh.setAttribute("aria-pressed", String(LOG.shake)); saveDraft(LOG); return; }
    if (e.target.closest("[data-finish]")) {
      const s = D.program.find((p) => p.id === LOG.sid), empty = s.exercises.filter((x) => !LOG.skip[x.id] && !LOG.ex[x.id].some((y) => !y.warm && num(y.reps) !== ""));
      $("#sheet-title").textContent = empty.length ? `Workout ready: ${empty.length} not done` : "Workout ready";
      $("#sheet-text").value = logMessage(); $("#sheet-clear").hidden = false; $("#sheet").hidden = false; copyText(logMessage()); return;
    }
    if (e.target.closest("[data-discard]")) { const bt = e.target.closest("[data-discard]"); if (bt.dataset.sure) { clearLog(); } else { bt.dataset.sure = "1"; bt.textContent = "Tap again to discard"; } return; }
    if (e.target.closest("[data-logback]")) { TAB_LOGGING = false; drawTrain(); return; }
    const rs = e.target.closest("[data-rest]"); if (rs) { const v = rs.dataset.rest; if (v === "skip") { restLeft = 0; clearInterval(restT); $("#rest").hidden = true; } else { restLeft = Math.max(0, restLeft + +v); $("#rest").classList.remove("go"); if (!$("#rest").hidden) restTick(); } return; }
  });
  function showTip(hit) { hit.closest("svg").querySelectorAll(".hit.on").forEach((x) => x.classList.remove("on")); hit.classList.add("on"); const tip = hit.closest(".chart").nextElementSibling; if (tip && tip.classList.contains("chart-tip")) tip.innerHTML = hit.dataset.tip; }
  document.addEventListener("pointerover", (e) => { const h = e.target.closest && e.target.closest(".hit"); if (h && e.pointerType === "mouse") showTip(h); });
  function clearLog() { saveDraft(null); LOG = null; TAB_LOGGING = false; clearInterval(restT); $("#rest").hidden = true; try { WAKE && WAKE.release(); } catch {} drawTrain(); }
  document.addEventListener("change", (e) => {
    const c = e.target.dataset && (e.target.dataset.ldc || e.target.dataset.sup);
    if (!c || !LD) return;
    if (e.target.dataset.ldc) LD[c] = e.target.checked; else LD.sup[c] = e.target.checked; saveLd(LD);
  });
  document.addEventListener("input", (e) => {
    if (e.target.dataset && e.target.dataset.ldi && LD) { LD[e.target.dataset.ldi] = e.target.value; saveLd(LD); return; }
    if (!LOG) return;
    const f = e.target.dataset.f, top = e.target.dataset.top;
    if (f) { const id = e.target.closest("[data-ex]").dataset.ex, k = +e.target.closest("[data-set]").dataset.set; LOG.ex[id][k][f] = e.target.value.trim(); saveDraft(LOG); }
    else if (top) { LOG[top] = e.target.value; saveDraft(LOG); }
    e.target.classList.remove("need");
  });
  setInterval(() => { const el = $("#elapsed"); if (el && LOG) el.textContent = Math.round((Date.now() - LOG.start) / 60000) + " min"; }, 30000);
  $("#sheet-copy").addEventListener("click", () => copyText($("#sheet-text").value));
  $("#sheet-close").addEventListener("click", () => { $("#sheet").hidden = true; $("#sheet-clear").hidden = true; });
  $("#sheet-clear").addEventListener("click", () => { $("#sheet").hidden = true; $("#sheet-clear").hidden = true; clearLog(); toast("Workout cleared from this phone"); });
  // keep Tab inside the top-most open dialog (sheet > menu > pane)
  const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), textarea, select, [tabindex]:not([tabindex="-1"])';
  const topDialog = () => ["#sheet", "#menu", "#pane"].map((x) => $(x)).find((x) => !x.hidden) || null;
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const dlg = topDialog(); if (!dlg) return;
    const f = [...dlg.querySelectorAll(FOCUSABLE)].filter((x) => x.offsetParent !== null); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#sheet").hidden = true; $("#menu").hidden = true; closePane(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && LOG && TAB_LOGGING) keepAwake(); });
  $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
  $("#refresh").addEventListener("click", () => load());
  $("#settings").addEventListener("click", () => { if (D) openPane("you"); else showSetup(); });
  $("#setup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = $("#f-pass").value.trim();
    if (!pass) return showSetup("Type your password first.");
    $("#unlock").textContent = "Unlocking…";
    try {
      const blob = await fetchBlob();
      const key = await deriveKey(pass, blob.salt, blob.iter);
      try { D = await decryptBlob(blob, key); } catch { $("#unlock").textContent = "Unlock"; return showSetup("Wrong password. Check it and try again."); }
      store.set({ key, salt: blob.salt, iter: blob.iter, cache: D });
      $("#f-pass").value = ""; $("#unlock").textContent = "Unlock"; render();
    } catch (err) { $("#unlock").textContent = "Unlock"; showSetup(err.message); }
  });
  $("#peek").addEventListener("click", () => { const f = $("#f-pass"), show = f.type === "password"; f.type = show ? "text" : "password"; $("#peek").textContent = show ? "Hide" : "Show"; $("#peek").setAttribute("aria-pressed", String(show)); });
  $("#forget").addEventListener("click", () => { store.set({}); D = null; showSetup(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && store.get().key) load({ quiet: true }); });

  try { TAB = localStorage.getItem(KEY + ".tab") || "today"; } catch {}
  if (TAB === "trend" || TAB === "health") TAB = "progress";
  if (TAB === "food") TAB = "today";
  applyTheme(themePref());
  if (LOG) TAB_LOGGING = true;
  const c = store.get();
  if (c.cache) { D = c.cache; render(); }
  load();
})();
</script>
</body>
</html>
