<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cut Log">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Cut Log design system: "Iron Cut Pro".
   Skin = the user's approved Iron Cut brief (2026-11-03): void canvas, one hot coral accent (ONE THING slab, primary
   actions, Log tab, progress fill), poster coach titles, 14px soft cards, floating pill tab bar, dark by default.
   Each screen borrows the best pattern for its job: WHOOP recovery dial, Linear timeline, MacroFactor food bands,
   Hevy logger, Oura sleep. Futuristic layer: live glowing rings; pit-wall delta colours only on deltas
   (green better, amber worse, purple personal best), always with +/- words. */
:root {
  --void: #0B0B0D; --surface: #141416; --raised: #1A1A1E; --edge: #27272A; --edge-2: #34343A;
  --ink: #F4F4F5; --muted: #A1A1AA; --faint: #8A8A93;
  --coral: #FF4F3A; --on-coral: #0B0B0D; --coral-ink: #FF6B59;
  --better: #3DDC84; --worse: #FFB020; --pb: #B98CFF; --alert: #FF6B8A;
  --glow: 0 0 18px; --shadow: 0 18px 48px rgb(0 0 0 / .45);
  /* legacy names used by view code */
  --bg: var(--void); --paper: var(--void); --line: var(--edge); --line-2: var(--edge-2); --tint: var(--raised);
  --ink-2: var(--muted); --ink-3: var(--faint); --pen: var(--coral); --on-pen: var(--on-coral); --accent: var(--coral);
  --on-accent: var(--on-coral); --accent-ink: var(--coral-ink); --red: var(--alert); --amber: var(--worse); --hi: var(--worse); --on-hi: #0B0B0D;
  --kcal: var(--ink); --protein: var(--ink); --steps: var(--ink); --sleep: var(--ink); --info: var(--ink);
  --ok: var(--better); --warn: var(--worse); --bad: var(--alert); --sunken: var(--void); --rule-2: var(--edge);
  --scrim: rgb(0 0 0 / .62); --nav: rgb(20 20 22 / .82);
  --f-display: "Bricolage Grotesque", "Onest", system-ui, sans-serif;
  --f: "Onest", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-serif: var(--f-display);
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-2xl: 2.25rem; --t-3xl: 3rem;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;
  --r-xs: 8px; --r-sm: 10px; --r: 14px; --r-lg: 22px;
  --rule: 1px solid var(--edge); --hair: 1px solid var(--edge);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --nav-h: 64px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme]) {
  --void: #F7F7F8; --surface: #FFFFFF; --raised: #F0F0F2; --edge: #E4E4E7; --edge-2: #D4D4D8;
  --ink: #0B0B0D; --muted: #52525B; --faint: #63636B;
  --coral: #E03E2A; --on-coral: #0B0B0D; --coral-ink: #C2321F;
  --better: #0B7442; --worse: #A35A00; --pb: #7C3AED; --alert: #C8264B;
  --scrim: rgb(11 11 13 / .35); --nav: rgb(255 255 255 / .86); --shadow: 0 16px 40px rgb(11 11 13 / .14);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --void: #F7F7F8; --surface: #FFFFFF; --raised: #F0F0F2; --edge: #E4E4E7; --edge-2: #D4D4D8;
  --ink: #0B0B0D; --muted: #52525B; --faint: #63636B;
  --coral: #E03E2A; --on-coral: #0B0B0D; --coral-ink: #C2321F;
  --better: #0B7442; --worse: #A35A00; --pb: #7C3AED; --alert: #C8264B;
  --scrim: rgb(11 11 13 / .35); --nav: rgb(255 255 255 / .86); --shadow: 0 16px 40px rgb(11 11 13 / .14);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--void); color: var(--ink); font: 400 var(--t-base)/1.5 var(--f); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--coral); color: var(--on-coral); }
.muted { color: var(--muted); }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.serif { font-family: var(--f-display); }
.lbl, .eyebrow, .lab, .fl { font: 600 var(--t-xs)/1.3 var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.big { font: 700 var(--t-3xl)/.95 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.mid { font: 700 var(--t-2xl)/1 var(--f-display); letter-spacing: -.02em; }
.nil { color: var(--faint) !important; }
.mark { color: inherit; }
.up { color: var(--better); } .down { color: var(--worse); } .pbc { color: var(--pb); }

/* ---------- shell ---------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--gutter) calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--s3); }
.view { display: grid; gap: var(--s3); }
.head { display: flex; align-items: center; gap: var(--s3); padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) 0 var(--s2); }
.head .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.head h1 { margin: 0; font: 800 1.75rem/1.05 var(--f-display); letter-spacing: -.03em; }
#dateline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.roundbtn { width: 44px; height: 44px; border-radius: 50%; border: var(--rule); background: var(--surface); display: grid; place-items: center; flex: none; }
.roundbtn svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.roundbtn.spin svg { animation: spin .9s linear infinite; }
.avatar { font: 700 var(--t-sm) var(--f); background: var(--raised); color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }
.stale { color: var(--worse); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: var(--rule); border-radius: var(--r); padding: var(--s4); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.card-h h2, .h2 { margin: 0; font: 700 var(--t-md)/1.2 var(--f-display); letter-spacing: -.01em; }
.card-h .aside { font-size: var(--t-sm); color: var(--muted); text-align: right; }
.note { font-size: var(--t-sm); line-height: 1.5; color: var(--muted); margin: var(--s3) 0 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.subh { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); margin: var(--s4) 0 var(--s2); padding-top: var(--s3); border-top: var(--rule); }

/* ---------- pills, tags ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 999px; background: var(--raised); font: 600 var(--t-xs)/1.2 var(--f); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--better); background: color-mix(in srgb, var(--better) 14%, transparent); }
.pill.warn { color: var(--worse); background: color-mix(in srgb, var(--worse) 15%, transparent); }
.pill.bad { color: var(--alert); background: color-mix(in srgb, var(--alert) 14%, transparent); }
.pill.yours { color: var(--coral-ink); background: color-mix(in srgb, var(--coral) 14%, transparent); }
.pill.btn { min-height: 44px; padding: 0 14px; color: var(--ink); }
.src { display: inline-flex; align-items: center; gap: 5px; font: 500 var(--t-xs)/1 var(--f); color: var(--faint); white-space: nowrap; }
.src::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.src.est::before { background: transparent; border: 1.5px dashed currentColor; width: 7px; height: 7px; }
.src.unv { color: var(--worse); }
.src.unv::before { background: transparent; border: 1.5px dotted currentColor; }
.tags { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

/* ---------- buttons ---------- */
.btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: var(--rule); background: var(--raised); color: var(--ink); font: 600 var(--t-sm) var(--f); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: transform .1s, background .15s; }
.btn:active, .cta:active, .opt2:active { transform: scale(.97); }
.btn.primary, .btn.train { background: var(--coral); border-color: var(--coral); color: var(--on-coral); }
.btn.ink { background: var(--void); border-color: var(--void); color: var(--ink); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--ink); color: var(--void); font: 700 var(--t-md) var(--f); text-decoration: none; }
.cta.pen { background: var(--coral); color: var(--on-coral); box-shadow: 0 8px 28px color-mix(in srgb, var(--coral) 35%, transparent); }
.cta.ghost { background: var(--raised); color: var(--ink); border: var(--rule); }
.linkmini { justify-self: start; min-height: 44px; padding: 0; color: var(--accent-ink); font: 600 var(--t-xs) var(--f); text-align: left; }
.linkbtn { color: var(--coral-ink); font: 600 var(--t-sm) var(--f); min-height: 44px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
.addset { justify-self: start; font: 600 var(--t-sm) var(--f); color: var(--coral-ink); min-height: 44px; padding: 0 8px 0 2px; }

/* ---------- coach brief + ONE THING slab (Today hero) ---------- */
.brief { display: grid; gap: var(--s2); padding: var(--s2) 0 0; }
.who { display: flex; align-items: center; gap: 8px; }
.who i { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: var(--glow) var(--coral); }
.who.calc i { background: var(--faint); box-shadow: none; }
.serif-h { margin: 2px 0 0; font: 800 2.25rem/1.02 var(--f-display); letter-spacing: -.035em; text-wrap: balance; }
.brief p { margin: 0; font-size: var(--t-md); line-height: 1.55; color: var(--muted); max-width: 62ch; }
.one { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s3); margin: var(--s3) calc(-1 * var(--gutter)) 0; padding: var(--s4) var(--gutter); background: var(--coral); color: var(--on-coral); }
.one .t { display: grid; gap: 2px; min-width: 0; }
.one .t .lbl { color: var(--on-coral); opacity: .75; }
.one .t > span:last-child { font: 700 var(--t-lg)/1.25 var(--f-display); letter-spacing: -.01em; }
.one .btn { background: var(--void); border-color: var(--void); color: #F4F4F5; }

/* ---------- WHOOP-style recovery dial ---------- */
.dialcard { display: grid; grid-template-columns: auto 1fr; gap: var(--s4); align-items: center; }
.dial { position: relative; width: 152px; height: 152px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.dial .trk { fill: none; stroke: var(--edge); stroke-width: 9; }
.dial .arc { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1.1s var(--ease); filter: drop-shadow(0 0 6px currentColor); }
.dial .ctr { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; gap: 2px; }
.dial .ctr b { font: 800 1.35rem/1 var(--f-display); letter-spacing: -.02em; }
.dial .ctr span { font: 600 var(--t-xs) var(--f); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.dlegend { display: grid; gap: var(--s2); min-width: 0; }
.dleg { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: var(--rule); width: 100%; text-align: left; }
.dleg:last-child { border-bottom: 0; }
.dleg i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; align-self: center; }
.dleg .k { font-size: var(--t-sm); color: var(--muted); }
.dleg b { font: 600 var(--t-md) var(--f-num); color: var(--ink); }
.dleg small { grid-column: 2 / -1; font-size: var(--t-xs); color: var(--faint); }
.verdict { margin-top: var(--s3); font-size: var(--t-sm); color: var(--muted); line-height: 1.45; }
.verdict b { color: var(--ink); }

/* ---------- MacroFactor-style bands (protein, calories, weight) ---------- */
.nums { display: grid; gap: var(--s4); }
.nrow { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s3); align-items: end; width: 100%; text-align: left; }
.nrow .lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: var(--s2); }
.nrow .val { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.nrow .val .big { font-size: 2.5rem; }
.nrow .val small { font: 500 var(--t-sm) var(--f); color: var(--muted); }
.nrow .tgt { text-align: right; font: 500 var(--t-sm)/1.3 var(--f); color: var(--muted); }
.nrow .tgt b { display: block; font: 600 var(--t-md)/1.1 var(--f-num); color: var(--ink); }
.nrow .bar, .nrow .ruler { grid-column: 1 / -1; display: block; margin-top: var(--s2); }
.nrow .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: var(--s2); font-size: var(--t-sm); color: var(--muted); flex-wrap: wrap; }
.meters { display: grid; gap: var(--s5); }
.meter { display: grid; gap: var(--s2); width: 100%; }
.meter .mh { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.meter .ml { font: 600 var(--t-xs) var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.meter .ml i { display: none; }
.meter .mv { display: flex; align-items: baseline; gap: 6px; }
.meter .mv b { font: 700 var(--t-2xl)/1 var(--f-display); letter-spacing: -.02em; }
.meter .mv small { font-size: var(--t-sm); color: var(--muted); }
.meter .mf { font-size: var(--t-sm); color: var(--muted); display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.track { display: block; position: relative; height: 12px; border-radius: 99px; background: var(--raised); }
.track u { position: absolute; top: -3px; bottom: -3px; border-radius: 6px; border: 1.5px solid color-mix(in srgb, var(--better) 70%, transparent); background: color-mix(in srgb, var(--better) 10%, transparent); }
.track s { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--worse); border-radius: 1px; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--coral); box-shadow: 0 0 12px color-mix(in srgb, var(--coral) 55%, transparent); transition: width 1s var(--ease); }
.track.sm { height: 8px; }

/* ---------- ruler ---------- */
.cut { display: grid; gap: var(--s3); }
.ruler { position: relative; height: 50px; margin: 0 6px; }
.ruler .base { position: absolute; left: 0; right: 0; top: 0; height: 26px; border-bottom: 1.5px solid var(--edge-2); }
.ruler .tk { position: absolute; top: 14px; width: 1.5px; height: 12px; margin-left: -.75px; background: var(--edge-2); }
.ruler .tk.maj { top: 6px; height: 20px; background: var(--faint); }
.ruler .tl { position: absolute; top: 31px; transform: translateX(-50%); font: 500 var(--t-xs) var(--f-num); color: var(--faint); white-space: nowrap; }
.ruler .tl.end { color: var(--muted); }
.ruler .tl.end.l { transform: none; } .ruler .tl.end.r { transform: translateX(-100%); }
.ruler .done { position: absolute; top: 22px; height: 5px; border-radius: 3px; background: var(--coral); transition: width 1s var(--ease); }
.ruler .mark { position: absolute; top: -3px; width: 0; height: 0; transition: left 1s var(--ease); }
.ruler .mark::after { content: ""; position: absolute; left: -6px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px var(--surface), 0 0 14px var(--coral); }
.ruler .mark::before { content: ""; position: absolute; left: -1px; top: 10px; width: 2px; height: 16px; background: var(--coral); }

/* ---------- Linear-style timeline ---------- */
.tline { display: grid; }
.tli { display: grid; grid-template-columns: 52px 28px 1fr auto; gap: var(--s2); align-items: center; padding: var(--s2) 0; min-height: 56px; border-top: var(--rule); }
.tli:first-child { border-top: 0; }
.tli .tm { font: 600 var(--t-sm) var(--f-num); color: var(--muted); }
.tli .tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--edge-2); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.tli .tick svg { width: 14px; height: 14px; stroke: transparent; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tli.done .tick { background: var(--better); border-color: var(--better); }
.tli.done .tick svg { stroke: #0B0B0D; }
.tli .w { display: grid; min-width: 0; }
.tli .w b { font-weight: 600; }
.tli .w span { font-size: var(--t-sm); color: var(--muted); overflow-wrap: anywhere; }
.tli.done .w b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.tli.now .tm { color: var(--coral-ink); }
.tli.past:not(.done) .tm { color: var(--faint); }
.tli .w .yours { font-size: var(--t-xs); color: var(--coral-ink); }
.dayring { display: inline-flex; align-items: center; gap: 8px; font: 600 var(--t-sm) var(--f-num); color: var(--muted); }
.dayring svg { width: 28px; height: 28px; transform: rotate(-90deg); }
.dayring .trk { fill: none; stroke: var(--edge); stroke-width: 4; }
.dayring .arc { fill: none; stroke: var(--better); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.nx { display: grid; grid-template-columns: 52px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; border-top: var(--rule); min-height: 52px; }
.nx:first-of-type { border-top: 0; }
.nx .tm { font: 600 var(--t-sm) var(--f-num); color: var(--muted); }
.nx .w { display: grid; min-width: 0; } .nx .w b { font-weight: 600; } .nx .w span { font-size: var(--t-sm); color: var(--muted); }

/* ---------- lists, food rows ---------- */
.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: var(--rule); }
.li:first-child { border-top: 0; padding-top: 0; }
.li:last-child { padding-bottom: 0; }
.li .sub { grid-column: 1 / -1; color: var(--muted); font-size: var(--t-sm); min-width: 0; }
.li b { font-weight: 600; }
.meal { display: grid; grid-template-columns: 64px 1fr auto; gap: var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: var(--rule); }
.meal:first-child { border-top: 0; padding-top: 0; }
.meal .nm { min-width: 0; } .meal .nm b { display: block; font-weight: 600; } .meal .nm span { color: var(--muted); font-size: var(--t-sm); }
.meal .q { text-align: right; font-size: var(--t-xs); color: var(--muted); }
.meal .q b { display: block; color: var(--ink); font: 600 var(--t-md) var(--f-num); white-space: nowrap; }

/* ---------- grids: signals, stats ---------- */
.signals, .stat3, .kvg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.stat3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.signals > *, .stat3 > div, .kvg > div { background: var(--raised); border-radius: var(--r-sm); padding: var(--s3); min-width: 0; display: grid; gap: 3px; align-content: start; text-align: left; }
.signals .k, .stat3 .eyebrow, .kvg .k { font: 600 var(--t-xs)/1.2 var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.signals b, .rec b { font: 700 var(--t-xl)/1 var(--f-display); }
.signals b small, .rec b small { font: 500 var(--t-xs) var(--f); color: var(--muted); margin-left: 3px; }
.signals .g, .rec .u { font-size: var(--t-xs); color: var(--muted); }
.stat3 b, .kvg b { display: block; font: 600 var(--t-md)/1.1 var(--f-num); }
.kvg b small { font: 500 var(--t-xs) var(--f); color: var(--muted); }
.insight { margin: var(--s2) 0 0; font-size: var(--t-sm); line-height: 1.5; color: var(--muted); }
.sig { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--worse) 15%, transparent); color: var(--worse); font: 600 var(--t-sm) var(--f); }
.sig i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- Oura-style sleep ---------- */
.sleepbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--raised); gap: 2px; }
.sleepbar i { display: block; height: 100%; }
.debt { display: flex; align-items: flex-end; gap: 4px; height: 56px; }
.debt i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--edge-2); min-height: 3px; position: relative; }
.debt i.ok { background: color-mix(in srgb, var(--better) 75%, transparent); }
.debt i.short { background: color-mix(in srgb, var(--worse) 80%, transparent); }
.debt i.zero { background: var(--alert); min-height: 3px; }

/* ---------- segmented, chips ---------- */
.seg { display: inline-flex; background: var(--raised); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 999px; font: 600 var(--t-sm) var(--f); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--void); }
.scroller { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); }
.scroller::-webkit-scrollbar { display: none; }
.chipday, .daychips button { flex: none; min-width: 64px; min-height: 56px; padding: 8px 12px; border-radius: var(--r); background: var(--surface); border: var(--rule); display: grid; gap: 1px; text-align: center; align-content: center; }
.chipday .l, .daychips .l { font: 600 var(--t-xs) var(--f); color: var(--muted); }
.chipday .n { font: 700 var(--t-md)/1 var(--f-num); }
.daychips .nm { font: 700 var(--t-sm)/1.1 var(--f-display); }
.chipday[aria-pressed="true"], .daychips button[aria-pressed="true"] { background: var(--ink); color: var(--void); border-color: var(--ink); }
.chipday[aria-pressed="true"] .l, .daychips button[aria-pressed="true"] .l { color: var(--void); opacity: .7; }
.daychips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
.daychips button { min-width: 0; padding: 8px 4px; }

/* ---------- charts ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--faint); font: 500 11px var(--f-num); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit.on { fill: var(--ink); fill-opacity: .07; }
.chart-tip { min-height: 22px; font-size: var(--t-sm); color: var(--muted); margin-top: var(--s2); }
.chart-tip b { color: var(--ink); font-weight: 600; }
.empty { display: grid; gap: var(--s2); place-items: center; text-align: center; padding: var(--s5); border-radius: var(--r-sm); background: var(--raised); color: var(--muted); font-size: var(--t-sm); }
.empty svg { width: 22px; height: 22px; stroke: var(--faint); fill: none; stroke-width: 1.6; }
.boxes { display: flex; gap: 6px; }
.boxes i { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--edge-2); display: grid; place-items: center; font: 800 12px/1 var(--f); font-style: normal; }
.boxes i.on { background: var(--better); border-color: var(--better); color: #0B0B0D; }
.band { position: relative; height: 12px; border-radius: 99px; background: var(--raised); margin: var(--s2) 0; }
.band u { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: color-mix(in srgb, var(--better) 28%, transparent); }
.band i { position: absolute; top: -5px; width: 4px; height: 22px; border-radius: 2px; background: var(--coral); transform: translateX(-50%); }
.dtr { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 4px var(--s3); align-items: center; padding: var(--s3) 0; border-top: var(--rule); }
.dtr:first-child { border-top: 0; padding-top: 0; }
.dtr .eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: var(--t-sm); }
.dtr .val { margin-top: 2px; font: 600 var(--t-md) var(--f-num); }
.dtr .val small { color: var(--muted); font: 500 var(--t-xs) var(--f); }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--raised); gap: 2px; }
.stack i { display: block; height: 100%; min-width: 2px; }
.lgd { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-sm); color: var(--muted); }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { width: 9px; height: 9px; border-radius: 3px; }
.lgd b { color: var(--ink); font-weight: 600; }

/* ---------- labs ---------- */
.labrow { padding: var(--s3) 0; border-top: var(--rule); display: grid; gap: 6px; }
.labrow:first-of-type { border-top: 0; padding-top: 0; }
.labrow .v { font: 600 var(--t-md) var(--f-num); }
.rtrack { position: relative; height: 8px; border-radius: 99px; background: var(--raised); margin: 6px 0; }
.rtrack u { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: color-mix(in srgb, var(--better) 35%, transparent); }
.rtrack i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--c); box-shadow: 0 0 0 3px var(--surface); }

/* ---------- Hevy-style gym ---------- */
.session { display: grid; gap: var(--s2); }
.session h3 { margin: 0; font: 800 var(--t-2xl)/1 var(--f-display); letter-spacing: -.03em; }
.exlist { display: grid; margin-top: var(--s2); }
.ex { display: grid; grid-template-columns: 28px 1fr auto; gap: 2px var(--s3); align-items: baseline; padding: var(--s3) 0; border-top: var(--rule); }
.ex .n { font: 600 var(--t-sm) var(--f-num); color: var(--faint); }
.ex .m { font: 500 var(--t-sm) var(--f-num); color: var(--muted); text-align: right; white-space: nowrap; }
.ex .x { grid-column: 2 / -1; font-size: var(--t-xs); color: var(--muted); }
.ex.skip { opacity: .5; } .ex.skip span:nth-child(2) { text-decoration: line-through; }
.goalbar { height: 8px; border-radius: 99px; background: var(--raised); overflow: hidden; }
.goalbar i { display: block; height: 100%; border-radius: 99px; background: var(--coral); box-shadow: 0 0 12px var(--coral); transition: width .4s var(--ease); }
.lgx { display: grid; gap: var(--s3); }
.lgx .exh { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.lgx .exh b { font: 700 var(--t-lg)/1.1 var(--f-display); letter-spacing: -.01em; }
.exh .tools { display: flex; gap: 6px; align-items: center; }
.exh .tool { min-height: 36px; padding: 0 10px; border-radius: 999px; background: var(--raised); font: 600 var(--t-xs) var(--f); color: var(--muted); }
.tgt { display: flex; gap: 6px; flex-wrap: wrap; }
.colh, .setrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px 48px; gap: 6px; align-items: center; }
.colh { font: 600 var(--t-xs) var(--f); color: var(--faint); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.setrow input { width: 100%; min-width: 0; height: 48px; font: 600 var(--t-md) var(--f-num); text-align: center; padding: 0 4px; border-radius: var(--r-sm); border: 1.5px solid transparent; background: var(--raised); color: var(--ink); }
.setrow input:focus { outline: none; border-color: var(--coral); }
.setrow input::placeholder { color: var(--faint); font-weight: 500; }
.setrow .ok { height: 48px; border-radius: var(--r-sm); background: var(--raised); display: grid; place-items: center; }
.setrow .ok svg { width: 20px; height: 20px; stroke: var(--faint); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.setrow.done .ok { background: var(--better); }
.setrow.done .ok svg { stroke: #0B0B0D; }
.setrow.done input { background: color-mix(in srgb, var(--better) 10%, var(--raised)); }
.setrow.pr .ok { background: var(--pb); box-shadow: 0 0 14px var(--pb); }
.setrow .sn { height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; font: 600 var(--t-sm) var(--f-num); color: var(--muted); border: 1.5px dashed var(--edge-2); }
.setrow.warm .sn { color: var(--worse); border-color: color-mix(in srgb, var(--worse) 60%, transparent); }
.setrow .prev { grid-column: 2 / 4; margin-top: -2px; font: 500 var(--t-xs) var(--f-num); color: var(--faint); text-align: center; }
.setrow input.need { border-color: var(--alert); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.exh .more { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.exh .more svg { width: 20px; height: 20px; fill: currentColor; }
.lgx.skipped { opacity: .5; }
.lgx .sum { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.lgx .sum .tick { width: 28px; height: 28px; border-radius: 50%; background: var(--better); display: grid; place-items: center; flex: none; }
.lgx .sum .tick svg { width: 15px; height: 15px; stroke: #0B0B0D; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.plates { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: var(--s4) 0; }
.plates i { display: grid; place-items: center; width: 30px; border-radius: 6px; background: var(--raised); border: 1px solid var(--edge-2); font: 700 var(--t-xs) var(--f-num); font-style: normal; color: var(--ink); }
.plates .bar { width: 46px; height: 10px; border-radius: 4px; background: var(--faint); }
.rest { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--edge-2); color: var(--ink); padding: 6px; border-radius: 999px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px; }
.rest button { color: inherit; font: 600 var(--t-sm) var(--f); min-height: 44px; padding: 0 12px; border-radius: 999px; background: var(--raised); min-width: 52px; }
.rest .clock { font: 700 1.5rem/1 var(--f-num); padding: 0 12px; min-width: 84px; text-align: center; color: var(--coral-ink); }
.rest.go { background: var(--better); color: #0B0B0D; border-color: var(--better); }
.rest.go .clock { color: #0B0B0D; }

/* ---------- forms ---------- */
.field, .field2 { display: grid; gap: 6px; }
.field label, .field2 label { font: 600 var(--t-xs)/1.2 var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field input, .field2 input, .inp { width: 100%; min-height: 52px; border-radius: var(--r-sm); border: 1.5px solid var(--edge); background: var(--raised); color: var(--ink); padding: 0 14px; font: 500 var(--t-md) var(--f); }
.field input:focus, .field2 input:focus, .inp:focus { outline: none; border-color: var(--coral); }
.field input::placeholder, .field2 input::placeholder, .inp::placeholder { color: var(--faint); }
.inp.big { font: 700 var(--t-3xl) var(--f-display); text-align: center; min-height: 84px; letter-spacing: -.03em; }
.inp.time { font-family: var(--f-num); }
.err { color: var(--alert); font-size: var(--t-sm); font-weight: 600; margin: 0; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.opt2 { min-height: 48px; border-radius: var(--r-sm); background: var(--raised); color: var(--ink); font: 600 var(--t-base) var(--f); text-align: center; border: 1.5px solid transparent; }
.opt2[aria-pressed="true"] { background: var(--ink); color: var(--void); }
.opt2.sm { min-height: 44px; padding: 0 14px; font-size: var(--t-sm); }
.logmodes { display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; }
.logmodes .opt2 { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: var(--t-sm); }
.chk { display: flex; align-items: center; gap: 12px; font-size: var(--t-base); min-height: 44px; }
.chk input { width: 22px; height: 22px; accent-color: var(--coral); flex: none; }
.adj { display: grid; gap: var(--s3); padding-top: var(--s3); border-top: var(--rule); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 56px; padding: 0 14px; border-radius: var(--r-sm); background: var(--raised); text-align: left; font-weight: 500; }
.toggle .sw { width: 50px; height: 30px; border-radius: 99px; background: var(--edge-2); position: relative; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s var(--ease); }
.toggle[aria-pressed="true"] .sw { background: var(--coral); }
.toggle[aria-pressed="true"] .sw::after { left: 23px; }
.st { font: 600 var(--t-xs) var(--f); } .st.wait { color: var(--worse); } .st.done { color: var(--better); }

/* ---------- lock ---------- */
.setup { display: grid; gap: var(--s5); padding-top: max(12vh, 48px); max-width: 440px; width: 100%; margin: 0 auto; }
.setup .logo { display: flex; align-items: center; gap: var(--s3); }
.setup .logo svg { width: 44px; height: 44px; }
.setup .logo b { display: none; }
.setup h2 { margin: 0; font: 800 4rem/.95 var(--f-display); letter-spacing: -.05em; }
.setup p { margin: 0; color: var(--muted); font-size: var(--t-md); }
.setup form { display: grid; gap: var(--s4); }
.setup .passwrap { position: relative; }
.setup .passwrap input { padding-right: 76px; }
.setup .passwrap button { position: absolute; right: 4px; top: 4px; bottom: 4px; padding: 0 14px; border-radius: 8px; font: 600 var(--t-xs) var(--f); color: var(--coral-ink); }
.setup .fine { font-size: var(--t-xs); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.setup .fine svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.setup .cta { background: var(--coral); color: var(--on-coral); }

/* ---------- floating pill tab bar ---------- */
.tabbar { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--nav); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--edge-2); border-radius: 999px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; box-shadow: var(--shadow); }
.tabbar [data-tab], .tabbar .logbtn { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 52px; border-radius: 999px; font: 600 .6875rem var(--f); color: var(--muted); }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabbar [aria-current="page"] { color: var(--ink); background: var(--raised); }
.tabbar .logbtn { background: var(--coral); color: var(--on-coral); box-shadow: 0 6px 20px color-mix(in srgb, var(--coral) 45%, transparent); }
.tabbar .logbtn span { display: contents; }

/* ---------- panes & sheets ---------- */
.pane, .sheet { position: fixed; z-index: 45; inset: 0; background: var(--scrim); display: grid; align-items: end; animation: fadein .2s ease; }
.sheet { z-index: 50; }
.pane .sheetbox, .sheet .panel { background: var(--void); border: 1px solid var(--edge-2); border-bottom: 0; border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 10px max(var(--s4), env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px));
  display: grid; gap: var(--s4); max-width: 640px; width: 100%; margin: 0 auto; box-shadow: var(--shadow); animation: fadein .2s ease; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--edge-2); justify-self: center; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.ph h2, .pane-title { margin: 0; font: 800 var(--t-xl)/1.1 var(--f-display); letter-spacing: -.03em; }
.sec { background: var(--surface); border: var(--rule); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); }
.sec .lab { padding: 0; border: 0; }
.sheet textarea { width: 100%; min-height: 240px; border-radius: var(--r-sm); border: var(--rule); background: var(--raised); color: var(--ink); font: var(--t-sm)/1.55 var(--f-num); padding: var(--s3); resize: vertical; }
.menu .panel { gap: var(--s2); }
.menu .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 var(--s4); border-radius: var(--r-sm); background: var(--surface); font: 500 var(--t-md) var(--f); text-align: left; gap: var(--s3); }
.menu .opt.danger { color: var(--alert); }
.menu .opt small { color: var(--muted); font-size: var(--t-xs); }
.srcs { display: grid; grid-template-columns: 18px 1fr; gap: 10px; line-height: 1.45; }
.srcs b { font-weight: 600; }
.srcs .g { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--ink); }
.srcs .g.est { background: transparent; border: 1.5px dashed var(--ink); }
.srcs .g.calc { background: transparent; border: 1.5px solid var(--ink); }
.layer { display: grid; grid-template-columns: 28px 1fr; gap: 10px; line-height: 1.45; }
.layer .n { font: 600 var(--t-sm) var(--f-num); color: var(--muted); }
.explain-what { margin: 0; font-size: var(--t-md); line-height: 1.55; }
.divide { display: grid; gap: var(--s3); padding-top: var(--s4); border-top: var(--rule); }
.tpl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); }
.tpl button { display: grid; justify-items: center; gap: 6px; padding: 14px 4px; border-radius: var(--r); background: var(--surface); border: var(--rule); font: 600 var(--t-xs) var(--f); }
.tpl button svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; }
.cues { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; line-height: 1.5; }
.md h1, .md h2, .md h3 { font-family: var(--f-display); letter-spacing: -.02em; margin: var(--s4) 0 var(--s2); }
.md p, .md li { color: var(--muted); line-height: 1.55; }
.md table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.md td, .md th { border-bottom: var(--rule); padding: 6px 4px; text-align: left; }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--void); border-radius: 999px;
  min-height: 48px; padding: 8px 18px; font: 600 var(--t-sm) var(--f); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); animation: drop .22s var(--ease); }
.toast.pr { background: var(--pb); color: #0B0B0D; }
.toast button { font: 700 var(--t-sm) var(--f); color: inherit; text-decoration: underline; padding: 6px 2px; }

/* ---------- loading ---------- */
.skel { display: grid; gap: var(--s3); padding-top: var(--s4); }
.skel i { display: block; border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 30%, var(--raised) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.fade { animation: fadein .25s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes drop { from { transform: translate(-50%, -10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- journey (calibration) ---------- */
.journey { list-style: none; margin: 0; padding: 0; }
.journey li { display: grid; grid-template-columns: 26px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: var(--rule); }
.journey li:first-child { border-top: 0; }
.journey .jk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--edge-2); display: grid; place-items: center; font: 800 12px/1 var(--f); }
.journey li.done .jk { background: var(--better); border-color: var(--better); color: #0B0B0D; }
.journey .jt { display: grid; min-width: 0; } .journey .jt b { font-weight: 600; } .journey .jt span { font-size: var(--t-sm); color: var(--muted); }
.journey .jr { display: grid; justify-items: end; gap: 6px; text-align: right; }
.journey .jn { font: 600 var(--t-md) var(--f-num); }
.journey .boxes i { width: 16px; height: 16px; font-size: 10px; border-radius: 5px; }
@media (max-width: 420px) { .journey li { grid-template-columns: 26px 1fr; } .journey .jr { grid-column: 2; justify-items: start; text-align: left; } }

/* ---------- responsive ---------- */
/* ---------- days that don't go to plan: easy-day card, choice line, still to eat, add exercise, offline ---------- */
.easy { display: grid; gap: var(--s3); border-color: color-mix(in srgb, var(--worse) 45%, var(--edge)); }
.easy h2, .toeat h2 { margin: 0; font: 700 var(--t-lg)/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }

.easy li { position: relative; padding-left: 14px; font-size: var(--t-sm); line-height: 1.45; }
.easy li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--worse); }
.easy .also li { color: var(--muted); }
.easy .also li::before { background: var(--faint); }
.easy .acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.easy .acts .cta { min-height: 52px; padding: 0 10px; font-size: var(--t-base); }
.chline { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin: 0; min-height: 44px; font-size: var(--t-sm); color: var(--muted); }
.chline > span:not(.pill) { flex: 1; min-width: 0; }
.chline .undo { min-height: 44px; padding: 0 6px; color: var(--coral-ink); font: 600 var(--t-sm) var(--f); }
.toeat { display: grid; gap: var(--s3); }
.toeat .li .q { font: 600 var(--t-base) var(--f-num); white-space: nowrap; text-align: right; }
.addex { width: 100%; min-height: 56px; border: 1.5px dashed var(--edge-2); border-radius: var(--r); color: var(--coral-ink); font: 600 var(--t-base) var(--f); display: flex; align-items: center; justify-content: center; gap: 8px; }
.pick { display: grid; gap: var(--s1); }
.pick button { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 48px; padding: 0 var(--s3); border-radius: var(--r-sm); background: var(--surface); text-align: left; font: 500 var(--t-base) var(--f); }

.pick button.new { color: var(--coral-ink); font-weight: 600; border: 1.5px dashed var(--edge-2); background: transparent; }
.offpill { justify-self: start; margin-top: 2px; }
/* relay sync chip (design §6): 44px target, small pill inside */
.syncchip { min-height: 44px; display: grid; place-items: center; flex: none; padding: 0; background: none; border: 0; }
.syncchip .pill { min-height: 28px; border: var(--rule); }
.syncchip .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.syncchip .pill.busy i { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.rq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--s2); align-items: center; }
.rq .acts { grid-column: 1 / -1; display: flex; gap: var(--s2); flex-wrap: wrap; }
.syncchip .sh { display: none; }
@media (max-width: 420px) { .syncchip .lg { display: none; } .syncchip .sh { display: inline; } .head h1 { white-space: nowrap; } }

.col { display: grid; align-content: start; gap: var(--s3); min-width: 0; }
@media (max-width: 370px) {
  .serif-h { font-size: 1.9rem; }
  .dialcard { grid-template-columns: 1fr; justify-items: center; } .dlegend { width: 100%; }
  .colh, .setrow { grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr) 50px 44px; gap: 4px; }
  .tpl { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tli { grid-template-columns: 46px 26px 1fr auto; }
}
@media (hover: hover) {

  .btn.primary:hover, .btn.train:hover { background: var(--coral); filter: brightness(1.08); }
  .cta:hover { filter: brightness(1.06); }
  .signals button:hover, .menu .opt:hover, .tpl button:hover, .pick button:hover { background: var(--edge); }
  button.nrow:hover .lbl > span:first-child { color: var(--coral-ink); }
}
@media (min-width: 1000px) {
  :root { --nav-h: 0px; }
  .wrap { max-width: 1320px; padding: 0 var(--s7) var(--s8); }
  .tabbar { position: sticky; top: 12px; bottom: auto; left: auto; right: auto; margin: 12px auto 0; width: 520px; }
  .cols { grid-template-columns: 1.1fr 1fr 1fr; column-gap: var(--s5); align-items: start; }
  .cols.two { grid-template-columns: 1fr 1fr; }
  .one { margin: var(--s3) 0 0; border-radius: var(--r); }
  .view.narrow { max-width: 760px; }
  .pane { align-items: stretch; justify-items: end; }
  .pane .sheetbox { max-width: 480px; max-height: none; height: 100%; margin: 0; border-radius: 0; border: 0; border-left: 1px solid var(--edge-2); }
  .sheet { align-items: center; }
  .sheet .panel { border-radius: var(--r-lg); border-bottom: 1px solid var(--edge-2); max-height: 86vh; }
  .grab { display: none; }
  .rest { bottom: 24px; }

<body>
<nav class="tabbar" id="tabs" aria-label="Main" hidden>
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17"/><path d="M9 2.5h6v3H9zM8.5 10h7M8.5 14h7M8.5 18h4"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>Train</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>Progress</button>
  <button class="logbtn" id="fab" aria-label="Log weight, a meal, water or supplements"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Log</button>
</nav>
<div class="wrap" id="app">
  <header class="head" id="head" hidden>
    <div class="t"><h1 id="greet">Cut Log</h1><span class="lbl" id="dateline">—</span><span class="pill warn offpill" id="offline" role="status" hidden></span></div>
    <button class="syncchip" id="sync" hidden aria-label="Sync with your coach"></button>
    <button class="roundbtn" id="refresh" aria-label="Refresh data"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="roundbtn avatar" id="settings" aria-label="You: profile, appearance and privacy">CL</button>
  </header>

  <section id="v-setup" class="setup" hidden aria-labelledby="setup-h">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="12" fill="var(--coral)"/><path d="M12 12v20M18 15v17M24 18v14M30 21v11" stroke="var(--on-coral)" stroke-width="3.4" stroke-linecap="round"/></svg></div>
    <h2 id="setup-h">Cut Log.</h2>
    <p>Unlock once on this phone. Your log stays here.</p>
    <form id="setup-form" novalidate>
      <div class="field"><label for="f-pass">Password</label><div class="passwrap"><input id="f-pass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="setup-err"><button type="button" id="peek" aria-pressed="false">Show</button></div></div>
      <p class="err" id="setup-err" role="alert" hidden></p>
      <button class="cta" type="submit" id="unlock">Unlock</button>
      <button class="cta ghost" type="button" id="forget" hidden>Remove password from this phone</button>
    </form>
    <span class="fine"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Decrypted on this phone only. The password never leaves it.</span>
  </section>

  <div id="loading" class="skel" hidden aria-label="Loading your data" role="status"><i style="height:120px"></i><i style="height:180px"></i><i style="height:120px"></i></div>
  <section id="v-today" hidden aria-label="Today"></section>
  <section id="v-progress" hidden aria-label="Progress"></section>
  <section id="v-train" hidden aria-label="Train"></section>
</div>

<div class="pane" id="pane" hidden><div class="sheetbox" id="pane-box" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
<div class="rest" id="rest" hidden role="timer" aria-label="Rest timer"><button data-rest="-15" aria-label="15 seconds less">−15</button><span class="clock" id="rest-clock">0:00</span><button data-rest="15" aria-label="15 seconds more">+15</button><button data-rest="skip">Skip</button></div>
<div class="sheet menu" id="menu" hidden><div class="panel" id="menu-panel" role="dialog" aria-modal="true" aria-label="Options"></div></div>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="ph"><h2 id="sheet-title">Check in</h2><button class="btn" id="sheet-close">Close</button></div>
  <label class="muted" for="sheet-text" style="font-size:var(--t-sm)">Fill the blanks, then copy and paste into Claude. Blank lines are fine.</label>
  <textarea id="sheet-text" spellcheck="false"></textarea>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)"><button class="cta" id="sheet-copy">Copy</button><a class="cta ghost" href="https://claude.ai/code" target="_blank" rel="noopener">Open Claude</a></div>
  <button class="cta ghost" id="sheet-clear" hidden style="width:100%">Sent it: clear this workout from the phone</button>
</div></div>


<script>
(() => {
  const KEY = "cutlog.v1";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
  };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v, d = 0) => (v == null || Number.isNaN(+v) ? null : Number(v).toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const nice = (s) => String(s || "").replace(/_/g, " ");
  const stripId = (s) => String(s || "").replace(/^SUB-\d{4} /, "").replace(/ \(\d+ g P\)$/, "");
  const pOf = (s) => (String(s || "").match(/\((\d+) g P\)/) || [])[1];
  let TAB_LOGGING = false;
  let D = null, TAB = "today", RANGE = 30, SEL = null, FOODSEL = null, TRAINSEL = null;

  const dubaiISO = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dubai", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const dubaiHour = () => +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", hour12: false }).format(new Date());
  const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const isoOf = (dt) => dt.toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
  const dowOf = (iso) => DOW[parse(iso).getUTCDay()];
  const menuLabel = (iso) => `${dowOf(iso)} ${iso.slice(8, 10)}`;
  const mondayOf = (iso) => { const g = parse(iso).getUTCDay(); return addDays(iso, g === 0 ? -6 : 1 - g); };
  const longDate = (iso) => parse(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });

  const b64d = (x) => Uint8Array.from(atob(x), (ch) => ch.charCodeAt(0));
  const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function deriveKey(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter }, base, 256);
    return b64e(bits);
  }
  async function decryptBlob(blob, rawKeyB64) {
    const key = await crypto.subtle.importKey("raw", b64d(rawKeyB64), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(blob.iv) }, key, b64d(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function fetchBlob() {
    const r = await fetch(`data.enc.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "No data published yet. Ask your coach to publish." : `Couldn't load (${r.status}). Try again.`);
    // sw.js answers from its cache when the network is down and says so (x-cutlog-offline, x-cutlog-cached-at)
    fetchBlob.last = { offline: r.headers.get("x-cutlog-offline") === "1", at: r.headers.get("x-cutlog-cached-at") };
    return r.json();
  }
  // offline: the shell and the last data come from this phone; say from when
  function showOffline(on, at) {
    const el = $("#offline"); if (!el) return;
    el.hidden = !on; if (!on) return;
    const d = at ? new Date(at) : null, ok = d && !Number.isNaN(+d);
    const hm = ok ? new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", minute: "2-digit", hour12: false }).format(d) : "";
    el.textContent = ok ? `Offline: showing data from ${hm}${dubaiISO(d) !== dubaiISO() ? ", " + longDate(dubaiISO(d)) : ""}` : "Offline: showing the last saved data";
  }
  async function load({ quiet } = {}) {
    const cfg = store.get();
    if (!cfg.key) { showSetup(); return; }
    if (!D) $("#loading").hidden = false;
    $("#refresh").classList.add("spin");
    try {
      const blob = await fetchBlob();
      let key = cfg.key;
      if (cfg.salt !== blob.salt || cfg.iter !== blob.iter) {
        if (!cfg.pass) throw new Error("The lock changed. Type your password again.");
        key = await deriveKey(cfg.pass, blob.salt, blob.iter);
      }
      try { D = await decryptBlob(blob, key); }
      catch { store.set({ cache: cfg.cache }); throw new Error("Password no longer matches. Type the current one."); }
      const off = fetchBlob.last && fetchBlob.last.offline;
      store.set({ ...store.get(), key, salt: blob.salt, iter: blob.iter, cache: D, cachedAt: off ? fetchBlob.last.at || store.get().cachedAt : new Date().toISOString() });
      render();
      showOffline(off || !navigator.onLine, off ? fetchBlob.last.at : store.get().cachedAt);
    } catch (e) {
      const c = store.get();
      if (c.cache && c.key) { D = c.cache; render(); $("#dateline").textContent = "Offline copy. " + e.message; showOffline(true, c.cachedAt); }
      else if (!quiet) showSetup(e.message);
    } finally { $("#refresh").classList.remove("spin"); }
  }

  function showSetup(err) {
    ["today", "train", "progress"].forEach((t) => ($(`#v-${t}`).hidden = true));
    $("#v-setup").hidden = false; $("#tabs").hidden = true; $("#loading").hidden = true; $("#pane").hidden = true; $("#head").hidden = !D;
    const c = store.get();
    $("#forget").hidden = !c.key;
    $("#setup-err").hidden = !err; $("#setup-err").textContent = err || "";
  }
  function showTab(t) {
    if (t === "trend" || t === "health") t = "progress";
    TAB = t; $("#v-setup").hidden = true; $("#loading").hidden = true;
    ["today", "train", "progress"].forEach((x) => ($(`#v-${x}`).hidden = x !== t));
    document.querySelectorAll("#tabs [data-tab]").forEach((b) => (b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    try { localStorage.setItem(KEY + ".tab", t); } catch {}
    const v = $(`#v-${t}`); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade");
    requestAnimationFrame(() => requestAnimationFrame(animateRings));
  }

  const seriesMap = () => Object.fromEntries((D.series || []).map((s) => [s.date, s]));
  const menuRows = () => Object.values(D.menus || {}).flat();
  // the user's own changes (data/meal_plan/overrides.yaml) arrive applied: a cancelled slot is null and listed here
  const cancelledOf = (m, slot) => !!(m && (m.cancelled || []).includes(slot));
  // menus are matched by date when data.json has it (older data: by "Tue 03" label)
  const menuFor = (iso) => menuRows().find((r) => (r.date ? r.date === iso : r.day === menuLabel(iso))) || null;
  // ---------- week schedule (training/week_plan.yaml via data.json; default Mon/Tue/Thu/Fri when absent) ----------
  const progById = (id) => (D.program || []).find((p) => p.id === id) || null;
  const schedStart = () => mondayOf((D.generated_at || dubaiISO()).slice(0, 10));
  const inSched = (iso) => !!(D.schedule && D.schedule.days) && iso >= schedStart() && iso < addDays(schedStart(), 14);
  const planOf = (iso) => (inSched(iso) ? D.schedule.days.find((r) => r.date === iso) || null : null);
  function sessionFor(iso) {
    if (inSched(iso)) { const r = planOf(iso); return r && r.status !== "missed" && r.status !== "skipped" ? progById(r.logged || r.session) : null; }
    const i = (D.gym_days || []).indexOf(dowOf(iso)); return i >= 0 ? (D.program || [])[i] : null;
  }
  const isGym = (iso) => !!sessionFor(iso);
  const weekNote = (iso) => (D.schedule && D.schedule.notes && D.schedule.notes[isoWeek(iso)]) || null;
  function isoWeek(iso) { const d = parse(iso); const t = new Date(d); t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7)); const y = t.getUTCFullYear(), w1 = new Date(Date.UTC(y, 0, 4)); return `${y}-W${String(1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getUTCDay() + 6) % 7)) / 7)).padStart(2, "0")}`; }
  // ---------- supplements from profile/supplements.yaml (names, doses, timing as recorded) ----------
  const supList = () => D.supplements || [];
  const supAt = (re) => supList().filter((x) => re.test(x.timing || "") && !["whey", "creatine"].includes(x.id));
  function shakeTxt() { const s = supMap(); if (!s.whey) return null; return `${s.whey.dose || ""} ${s.whey.brand || s.whey.name}${s.creatine ? ` + ${s.creatine.dose || ""} creatine`.replace("  ", " ") : ""}`.trim(); }
  const supNames = (xs) => xs.map((x) => x.name).join(" + ");
  const supMap = () => Object.fromEntries((D.supplements || []).map((x) => [x.id, x]));

  function animateRings() { document.querySelectorAll("[data-fill]").forEach((c) => (c.style.width = c.dataset.fill)); document.querySelectorAll("[data-left]").forEach((c) => (c.style.left = c.dataset.left)); document.querySelectorAll("[data-off]").forEach((c) => (c.style.strokeDashoffset = c.dataset.off)); }

  function spark(vals, color, W = 300, H = 56) {
    const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
    if (pts.length < 2) return "";
    const ys = pts.map((p) => p[1]), a = Math.min(...ys), b = Math.max(...ys), n = vals.length - 1;
    const X = (i) => 4 + (i / Math.max(1, n)) * (W - 8), Y = (v) => 6 + (1 - (v - a) / Math.max(0.1, b - a)) * (H - 12);
    const d = pts.map((p, k) => `${k ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    const id = "g" + Math.random().toString(36).slice(2, 7), last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>
      <path d="${d}L${X(last[0])},${H}L${X(pts[0][0])},${H}Z" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  // ---------- DEVICE (Zepp, DEVICE source; absent = not provided, never defaulted) ----------
  const DEV = () => (D.device && D.device.latest) || null;
  const dv = (o, k) => (o && o[k] != null && !Number.isNaN(+o[k]) ? +o[k] : null);
  const SRC = '<span class="src">Watch (Zepp)</span>';
  // data.device.unverified: dotted path prefixes imported but not yet checked against the Zepp app
  const isUnv = (p) => !!p && ((D.device && D.device.unverified) || []).some((x) => (x.endsWith(".") ? p.startsWith(x) : p === x || p.startsWith(x + ".")));
  const UNV = '<span class="src unv" title="Imported from Zepp, not yet checked against the Zepp app">Unverified</span>';
  const tags = (p) => `<span class="tags">${SRC}${isUnv(p) ? UNV : ""}</span>`;
  const dval = (o, k, nd = 0) => { const v = o ? o[k] : null; return v == null ? null : typeof v === "boolean" ? (v ? "yes" : "no") : Number.isNaN(+v) ? esc(v) : fmt(+v, nd); };
  // ---------- body state: the fatigue rule's verdict + sleep / HRV / resting HR against your own baselines ----------
  // deviation bar: centre = baseline, hatched = the rule's normal zone, block = today's deviation
  function vitalsPanel() {
    const R = D.recovery || {}, T = D.targets, pr = R.params || {}, today = dubaiISO();
    const when = R.date ? (R.date === today ? "last night" : "night before " + longDate(R.date)) : "";
    const sl = R.sleep_today, hrv = R.hrv_today, rhr = R.rhr_today, hb = R.hrv_baseline, rb = R.rhr_baseline, hd = R.hrv_delta_pct, rdl = R.rhr_delta;
    const drop = pr.hrv_drop_pct || 15, up = pr.rhr_elevated_bpm || 5;
    const okSleep = sl != null && sl >= T.sleep_min, okH = hrv != null && hb != null && hrv >= hb * (1 - drop / 100), okR = rhr != null && rb != null && rhr <= rb + up;
    const arcs = [
      { k: "sleep", r: 64, v: sl != null ? Math.min(1, sl / T.sleep_min) : null, ok: okSleep },
      { k: "hrv", r: 52, v: hrv != null && hb ? Math.min(1, hrv / hb) : null, ok: okH },
      { k: "rhr", r: 40, v: rhr != null && rb ? Math.min(1, rb / rhr) : null, ok: okR },
    ];
    let word, cls, say;

  // explanations read the CURRENT targets, so they never contradict the charts after a target change
  function explainOf(k) {
    const T = D.targets, sp = T.steps_plan, w = T.water || [2.5, 3.5];

    return {
      trend: { title: "Trend weight", what: "The average of your last 7 morning weigh-ins. Daily weight swings up to 1.5 kg with water, salt and carbs; the average shows the real direction.", src: [["■", "Measured", "Scale weigh-ins, mornings."], ["□", "Calculated", "7-day average and weekly change. Needs 4+ weigh-ins in 7 days."]] },
      protein: { title: "Protein", what: `Keeps your muscle while you lose fat. Your target is ${T.protein.low}–${T.protein.high} g a day; never below ${T.protein_floor} g.`, src: [["■", "Label", "Meal-plan nutrition from the provider."], ["≈", "Estimate", "Add-ons and anything without a label, as a range."]] },
      kcal: { title: "Calories", what: `Energy eaten. Your target is ${fmt(T.kcal.low)}–${fmt(T.kcal.high)} kcal; the floor is ${fmt(T.kcal_floor)}. Your watch's "calories burned" is never added back.`, src: [["■", "Label", "Meal-plan nutrition."], ["≈", "Estimate", "Everything else, as a range."]] },
      sleep: { title: "Sleep", what: `Hours asleep from your watch. Under 6 hours means an easier gym session; the target is ${T.sleep_min}+.`, src: [["■", "Device", "Your watch, synced from Zepp."]] },
      steps: { title: "Steps", what: `Daily movement outside the gym. Your target now is ${fmt(T.steps_min)}.${stepsPlan}`, src: [["■", "Device", "Your watch, synced from Zepp. Today's count lands after the day ends."]] },
      hrv: { title: "Heart rate variability", what: `Measured overnight by your watch. Lower than your own 28-day baseline for ${(D.recovery && D.recovery.params && D.recovery.params.hrv_drop_pct) || 15}%+ on 2+ days in a row is one trigger of the fatigue rule. One low night means little.`, src: [["■", "Device", "Your watch, synced from Zepp."], ["□", "Calculated", "Baseline: median of the last 28 days (needs 14+ nights)."]] },
      rhr: { title: "Resting heart rate", what: `Your lowest steady heart rate overnight. ${(D.recovery && D.recovery.params && D.recovery.params.rhr_elevated_bpm) || 5}+ bpm above your 28-day baseline on 2+ days in a row is one trigger of the fatigue rule. It also rises with heat, alcohol, late meals and illness.`, src: [["■", "Device", "Your watch, synced from Zepp."], ["□", "Calculated", "Baseline: median of the last 28 days (needs 14+ nights)."]] },
      water: { title: "Water", what: `${w[0]}–${w[1]} L a day, plus 0.5–1 L per hour of training. Dubai heat counts.`, src: [["■", "You said", "What you log."]] },
    }[k];
  }
  function explainPane(k) {

      : k === "protein" ? bars(s, "protein", "var(--protein)", { low: T.protein.low, high: T.protein.high, floor: T.protein_floor })
      : k === "kcal" ? bars(s, "kcal", "var(--kcal)", { low: T.kcal.low, high: T.kcal.high, floor: T.kcal_floor })

      <button class="cta" data-ask="${esc(q)}" style="width:100%">Copy a question for your coach</button>

  function saveLd(d) { try { localStorage.setItem(LD_KEY, JSON.stringify(d)); } catch {} }
  let LD = null;

  function logPane(mode) {

        <span class="lab" style="margin-top:2px">How do you feel? 1 is low, 5 is great</span><div class="opts">${[1, 2, 3, 4, 5].map((n) => o("feel", n, n)).join("")}</div>`}

        ${planned ? `<b style="font-weight:600">${esc(planned)}</b>` : `<span class="muted">${cancelledOf(m, LD.meal) ? `${LD.meal === "lunch" ? "Lunch" : "Dinner"} is cancelled today. Ate something anyway? Describe it below.` : "No plan meal today: describe it below or attach a photo in Claude."}</span>`}
        ${planned ? `<div class="opts">${o("ate", "all", "All")}${o("ate", "most", "Most ¾")}${o("ate", "half", "Half")}${o("ate", "none", "Skipped")}</div>
        ${m && m.addon && LD.meal === "dinner" ? `<label class="chk"><input type="checkbox" data-ldc="addon" ${LD.addon ? "checked" : ""}>With the add-on: ${esc(m.addon.items)}</label>` : ""}
        <button class="linkbtn" data-ld-toggle aria-expanded="${!!LD.adj}">${LD.adj ? "Hide adjustments" : "Adjust amount, sauce or extras"}<span aria-hidden="true">${LD.adj ? "−" : "›"}</span></button>
        ${LD.adj ? `<div class="adj"><span class="lab">How much</span><div class="opts">${["¼", "½", "¾", "1", "1½"].map((v) => o("portion", v, v)).join("")}</div>
          <span class="lab">Sauce or dressing</span><div class="opts">${o("sauce", "none", "None")}${o("sauce", "some", "Some")}${o("sauce", "lots", "Lots")}${o("sauce", "unsure", "Not sure")}</div>
          <label class="lab" for="ld-out">Left out</label><input class="inp" id="ld-out" data-ldi="out" placeholder="e.g. half the bread, no cheese" value="${esc(LD.out)}">

      </section>` : ""}
      ${show("water") ? `<section class="sec"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">Water</span><span class="num" style="font:300 var(--t-xl) var(--f)">+${(LD.water / 1000).toFixed(2)} <span class="muted" style="font-size:var(--t-sm)">L to add</span></span></div>
        <div class="opts"><button class="opt2" data-water="250">+250 ml</button><button class="opt2" data-water="500">+500 ml</button><button class="opt2" data-water="0">Reset</button></div></section>` : ""}
      ${show("sleep") ? `<section class="sec"><span class="lab">Sleep</span>

  // [key, label] for the Log checkboxes: each recorded supplement (with its timing), whey + creatine as one "Shake"
  function supChoices() {
    const out = supList().filter((x) => !["whey", "creatine"].includes(x.id)).map((x) => [x.id, x.name + (x.timing ? ` (${x.timing})` : "")]);
    const sh = shakeTxt(); if (sh) out.push(["shake", `Shake: ${sh}`]);

  }
  function ldMessage() {
    const d = LD, today = dubaiISO(), m = menuFor(today), lines = [];
    if (d.weight) lines.push(`MORNING ${today}`, `Weight (kg): ${num(d.weight)}`, `Feel (1-5): ${d.feel}`);
    if (d.ate) {
      const planned = m ? stripId(d.meal === "lunch" ? m.lunch : m.dinner) : "";
      lines.push(`MEAL ${today} ${d.meal}`, `What: ${planned ? "plan meal (" + planned + ")" : "see notes"}`, `Ate: ${d.ate}${d.portion ? " (portion " + d.portion + ")" : ""}`);
      if (d.sauce) lines.push(`Sauce/dressing: ${d.sauce}`);
      if (d.out) lines.push(`Left out: ${d.out}`);
      if (d.added) lines.push(`Added: ${d.added}`);
      if (d.meal === "dinner" && m && m.addon) lines.push(`Add-on eaten: ${d.addon ? m.addon.items : "no"}`);
    }
    const sups = Object.entries(d.sup).filter(([, v]) => v).map(([k]) => k);
    if (d.water || sups.length || d.free) lines.push(`NOTE ${today}`);
    if (d.water) lines.push(`Water: +${(d.water / 1000).toFixed(2)} L`);
    const supName = (k) => (k === "shake" ? "shake" : (supMap()[k] || {}).name || k);
    if (sups.length) lines.push(`Supplements taken: ${sups.map(supName).join(", ")}`);
    if (d.free) lines.push(`Also: ${d.free}`);
    if (d.nap_from || d.nap_to || d.bed || d.wake) {
      lines.push(`SLEEP ${today}`);
      if (d.nap_from || d.nap_to) lines.push(`Nap: ${d.nap_from || "?"}-${d.nap_to || "?"}`);
      if (d.bed) lines.push(`Went to bed: ${d.bed}`);
      if (d.wake) lines.push(`Woke up: ${d.wake}`);
    }
    // ticked plan items not yet sent: the coach records them
    const tk = ticks(today), sentT = new Set(d.sentTicks || []), its = dayItems(today).filter((x) => tk[x.id] && !x.auto && !sentT.has(x.id));
    if (its.length) lines.push(`DONE ${today}`, ...its.map((x) => `- ${x.t} ${x.b}: ${x.s}`));
    // plan changes made on this phone (easy version, added exercises …), not sent yet
    lines.push(...pendingPlan().map((x) => x.text));
    return lines.length ? lines.join("\n") + "\n(sent from Cut Log)" : "";
  }
