<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cut Log">
<meta name="theme-color" content="#0E1B22" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDF2F2" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..700&family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,1,400&display=swap">
<style>
/* Cut Log design system: "Dusk".
   A personal cut companion read mostly at night after training. Petrol-ink night, sand for actions,
   four metric hues (energy, protein, movement, sleep) with equal weight; status colours always paired with words.
   Hanken Grotesk carries UI and numerals (tabular); Newsreader is reserved for the coach's voice. */
:root {
  --bg: #0E1B22; --surface: #142530; --raised: #1B2F3B; --sunken: #0B161C;
  --line: rgba(205, 228, 238, .085); --line-2: rgba(205, 228, 238, .16);
  --ink: #E7EEF0; --muted: #98ABB5; --faint: #8299A4;
  --accent: #E8D3A6; --on-accent: #14222A; --accent-ink: #E8D3A6;
  --kcal: #F2A766; --protein: #72D9C0; --steps: #ADB6FF; --sleep: #8BC0F0;
  --ok: #86DB9F; --warn: #F2C66B; --bad: #FF8F80; --info: #8BC0F0;
  --scrim: rgb(3 9 12 / .62); --nav: rgba(14, 27, 34, .92); --shadow: 0 18px 50px rgb(0 0 0 / .38);
  --f: "Hanken Grotesk", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  /* type scale (15px base, ~1.2 ratio) */
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.3125rem; --t-xl: 1.75rem; --t-2xl: 2.375rem; --t-3xl: 3.25rem;
  /* spacing */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;
  /* radii: hierarchy, not one size for all */
  --r-xs: 6px; --r-sm: 12px; --r: 18px; --r-lg: 28px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --nav-h: 64px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #EDF2F2; --surface: #FFFFFF; --raised: #F3F7F7; --sunken: #E3EAEA;
  --line: rgba(16, 40, 50, .08); --line-2: rgba(16, 40, 50, .16);
  --ink: #10232C; --muted: #3F555F; --faint: #5A6E77;
  --accent: #23404D; --on-accent: #F3F7F7; --accent-ink: #7A5A1E;
  --kcal: #C9661E; --protein: #0E8C75; --steps: #5260D6; --sleep: #2A77C0;
  --ok: #1D8546; --warn: #9C6300; --bad: #C2372B; --info: #2A77C0;
  --scrim: rgb(16 35 44 / .38); --nav: rgba(255, 255, 255, .94); --shadow: 0 18px 50px rgb(16 35 44 / .16); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #EDF2F2; --surface: #FFFFFF; --raised: #F3F7F7; --sunken: #E3EAEA;
  --line: rgba(16, 40, 50, .08); --line-2: rgba(16, 40, 50, .16);
  --ink: #10232C; --muted: #3F555F; --faint: #5A6E77;
  --accent: #23404D; --on-accent: #F3F7F7; --accent-ink: #7A5A1E;
  --kcal: #C9661E; --protein: #0E8C75; --steps: #5260D6; --sleep: #2A77C0;
  --ok: #1D8546; --warn: #9C6300; --bad: #C2372B; --info: #2A77C0;
  --scrim: rgb(16 35 44 / .38); --nav: rgba(255, 255, 255, .94); --shadow: 0 18px 50px rgb(16 35 44 / .16); color-scheme: light; }

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 var(--t-base)/1.5 var(--f); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: var(--r-xs); }
::selection { background: color-mix(in srgb, var(--accent-ink) 35%, transparent); }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--f-serif); }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* ---------- shell ---------- */
.wrap { max-width: 600px; margin: 0 auto; padding: var(--s3) var(--gutter) calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--s5); }
.view { display: grid; gap: var(--s4); }
.head { display: flex; align-items: center; gap: var(--s3); padding-top: var(--s2); }
.head .t { flex: 1; min-width: 0; }
.eyebrow, .lbl { font: 500 var(--t-sm)/1.3 var(--f); color: var(--muted); letter-spacing: 0; }
#dateline { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.head h1 { margin: 2px 0 0; font: 600 var(--t-xl)/1.1 var(--f); letter-spacing: -0.025em; text-wrap: balance; }
.roundbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; transition: background .2s; }
.roundbtn:hover { background: var(--raised); }
.roundbtn svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.roundbtn.spin svg { animation: spin .9s linear infinite; }
.avatar { font: 650 var(--t-sm) var(--f); letter-spacing: .02em; background: var(--accent); color: var(--on-accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.stale { color: var(--warn); }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r); padding: var(--s5); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.card-h h2, .h2 { margin: 0; font: 600 var(--t-md)/1.25 var(--f); letter-spacing: -0.01em; }
.card-h .aside { font-size: var(--t-sm); color: var(--muted); text-align: right; }
.note { font-size: var(--t-sm); line-height: 1.5; color: var(--muted); margin: var(--s3) 0 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }

/* ---------- pills, tags, status ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 10px; border-radius: 999px; font: 500 var(--t-xs)/1.2 var(--f); background: var(--raised); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill .dot, .pill::before { flex: none; }
.pill.ok::before, .pill.warn::before, .pill.bad::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.btn { min-height: 44px; padding: 0 14px; font-weight: 600; font-size: var(--t-sm); color: var(--ink); }
.src { display: inline-flex; align-items: center; gap: 5px; font: 500 var(--t-xs)/1 var(--f); color: var(--faint); white-space: nowrap; }
.src::before { content: ""; width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid currentColor; }
.src.unv { color: var(--warn); }
.src.unv::before { border-style: dotted; }
.src.est::before { border-style: dashed; }
.tags { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }

/* ---------- buttons ---------- */
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); background: var(--raised); color: var(--ink); font: 600 var(--t-sm) var(--f); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: background .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: color-mix(in srgb, var(--raised) 80%, var(--ink) 8%); }
.btn:active, .cta:active, .opt2:active { transform: scale(.97); }
.btn.primary, .cta { background: var(--accent); color: var(--on-accent); }
.btn.train { background: var(--accent); color: var(--on-accent); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 14px; font: 650 var(--t-base) var(--f); text-decoration: none; transition: filter .15s, transform .1s; }
.cta:hover { filter: brightness(1.06); }
.cta.ghost { background: var(--raised); color: var(--ink); }
.cta[disabled] { opacity: .6; cursor: progress; }
.linkbtn { color: var(--accent-ink); font: 600 var(--t-sm) var(--f); text-align: left; min-height: 44px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
.addset { justify-self: start; font: 600 var(--t-sm) var(--f); color: var(--accent-ink); min-height: 44px; padding: 0 8px 0 2px; }

/* ---------- daily brief (no card: it is the page's lead) ---------- */
.brief { display: grid; gap: var(--s3); padding: var(--s2) 0 var(--s1); }
.who { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--muted); }
.who i { width: 8px; height: 8px; border-radius: 50%; background: var(--protein); box-shadow: 0 0 0 3px color-mix(in srgb, var(--protein) 22%, transparent); }
.who.calc i { background: transparent; border: 1.5px solid var(--muted); box-shadow: none; }
.serif-h { margin: 0; font: 400 2.125rem/1.08 var(--f-serif); letter-spacing: -0.015em; text-wrap: balance; }
.brief p { margin: 0; color: var(--muted); font-size: var(--t-md); line-height: 1.55; max-width: 62ch; }
.one { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s2); padding: var(--s4); border-radius: var(--r); background: var(--surface); box-shadow: inset 3px 0 0 var(--accent-ink); }
.one .t { flex: 1; display: grid; gap: 2px; min-width: 0; }
.one .t > span:last-child { font-size: var(--t-base); line-height: 1.45; font-weight: 500; }

/* ---------- fuel meters ---------- */
.meters { display: grid; gap: var(--s5); }
.meter { display: grid; gap: var(--s2); width: 100%; border-radius: var(--r-sm); }
.meter .mh { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.meter .mv { display: flex; align-items: baseline; gap: 6px; }
.meter .mv b { font: 300 var(--t-2xl)/1 var(--f); letter-spacing: -0.035em; }
.meter .mv small { font-size: var(--t-sm); color: var(--muted); }
.meter .ml { display: inline-flex; align-items: center; gap: 8px; font: 600 var(--t-sm) var(--f); }
.meter .ml i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.meter .mf { font-size: var(--t-sm); color: var(--muted); display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--raised); }
.track u { position: absolute; top: -3px; bottom: -3px; border-radius: 4px; border: 1.5px dashed color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); }
.track s { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--c); transition: width 1s var(--ease); }
.track.sm { height: 6px; }
.track.sm u { top: -2px; bottom: -2px; }

/* ---------- the cut ruler (signature) ---------- */
.cut { display: grid; gap: var(--s4); }
.cut-top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.cut-now { display: grid; gap: 2px; }
.cut-now b { font: 300 var(--t-3xl)/.95 var(--f); letter-spacing: -0.045em; }
.cut-now b small { font: 500 var(--t-base) var(--f); color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.cut-side { text-align: right; display: grid; gap: 2px; font-size: var(--t-sm); color: var(--muted); }
.cut-side b { color: var(--ink); font-size: var(--t-md); font-weight: 600; }
.ruler { position: relative; height: 58px; margin: 0 6px; }
.ruler .base { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-bottom: 1.5px solid var(--line-2); }
.ruler .tk { position: absolute; top: 14px; width: 1.5px; height: 16px; margin-left: -.75px; background: var(--line-2); }
.ruler .tk.maj { top: 4px; height: 26px; background: var(--faint); }
.ruler .tl { position: absolute; top: 36px; transform: translateX(-50%); font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }
.ruler .tl.end { color: var(--muted); font-weight: 600; }
.ruler .done { position: absolute; top: 26px; height: 5px; border-radius: 3px; background: var(--protein); transition: width 1.1s var(--ease); }
.ruler .mark { position: absolute; top: -2px; width: 3px; height: 34px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); transition: left 1.1s var(--ease); }
.ruler .mark::after { content: ""; position: absolute; left: 50%; top: -7px; width: 11px; height: 11px; transform: translateX(-50%); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--surface); }
.cut .legend2 { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: var(--t-xs); color: var(--muted); }
.cut .legend2 span { display: inline-flex; align-items: center; gap: 6px; }
.cut .legend2 i { width: 12px; height: 4px; border-radius: 2px; background: var(--protein); }
.cut .legend2 i.m { width: 3px; height: 12px; background: var(--ink); }

/* ---------- next up ---------- */
.nx { display: grid; grid-template-columns: 52px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.nx:first-of-type { border-top: 0; padding-top: 0; }
.nx .tm { font: 600 var(--t-sm) var(--f); color: var(--muted); }
.nx .w { display: grid; min-width: 0; }
.nx .w b { font-weight: 600; }
.nx .w span { font-size: var(--t-sm); color: var(--muted); overflow-wrap: anywhere; }

/* ---------- signal strip (sleep / steps / water) ---------- */
.signals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); }
.signals button { display: grid; gap: 2px; padding: var(--s4); min-width: 0; border-left: 1px solid var(--line); transition: background .15s; }
.signals button:first-child { border-left: 0; border-radius: var(--r) 0 0 var(--r); }
.signals button:last-child { border-radius: 0 var(--r) var(--r) 0; }
.signals button:hover { background: var(--raised); }
.signals .k { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--muted); font-weight: 500; }
.signals .k i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.signals b { font: 400 var(--t-lg)/1.2 var(--f); letter-spacing: -0.02em; }
.signals b small { font-size: var(--t-xs); color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.signals .g { font-size: var(--t-xs); color: var(--faint); }
.insight { margin: 0; font-size: var(--t-sm); line-height: 1.5; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.insight::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--muted); transform: translateY(-1px); }
.sig { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 14%, transparent); font-size: var(--t-sm); font-weight: 500; color: var(--warn); }
.sig i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- stat tiles ---------- */
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.stat3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat3 > div { background: var(--raised); border-radius: var(--r-sm); padding: var(--s3); min-width: 0; display: grid; gap: 4px; align-content: start; }
.stat3 .eyebrow { font-size: var(--t-xs); }
.stat3 b { display: block; font: 500 var(--t-md) var(--f); }
.rec b { font: 300 var(--t-xl)/1 var(--f); letter-spacing: -0.03em; margin-top: 2px; }
.rec b small { font: 500 var(--t-xs) var(--f); color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.rec .u { font-size: var(--t-xs); color: var(--muted); }
.rec .u.unv { color: var(--warn); }
.kvg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.kvg > div { background: var(--raised); border-radius: var(--r-sm); padding: 10px; min-width: 0; display: grid; gap: 3px; align-content: start; justify-items: start; }
.kvg .k { font-size: var(--t-xs); line-height: 1.25; color: var(--muted); }
.kvg b { font: 500 var(--t-md) var(--f); }
.kvg b small { font: 500 var(--t-xs) var(--f); color: var(--muted); }

/* ---------- lists ---------- */
.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; padding-top: 0; }
.li:last-child { padding-bottom: 0; }
.li .sub { grid-column: 1 / -1; color: var(--muted); font-size: var(--t-sm); min-width: 0; }
.li b { font-weight: 600; }

/* ---------- segmented controls & day chips ---------- */
.seg { display: inline-flex; background: var(--raised); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button { min-height: 40px; padding: 0 12px; border-radius: 9px; font: 600 var(--t-sm) var(--f); color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.seg.wide { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; background: var(--surface); }
.seg.wide button[aria-pressed="true"] { background: var(--raised); box-shadow: none; }
.scroller { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 2px var(--gutter); scroll-snap-type: x mandatory; }
.scroller::-webkit-scrollbar { display: none; }
.chipday, .daychips button { flex: none; scroll-snap-align: start; min-width: 60px; padding: 10px 12px; border-radius: 14px; background: var(--surface); display: grid; gap: 1px; text-align: center; transition: background .2s, color .2s; }
.chipday .l, .daychips .l { font: 500 var(--t-xs) var(--f); color: var(--muted); }
.chipday .n { font: 600 var(--t-md) var(--f); }
.chipday[aria-pressed="true"], .daychips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chipday[aria-pressed="true"] .l, .daychips button[aria-pressed="true"] .l { color: var(--bg); opacity: .7; }
.daychips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
.daychips .nm { font: 600 var(--t-sm) var(--f); }

/* ---------- food ---------- */
.meal { display: grid; grid-template-columns: 40px 1fr auto; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; padding-top: 0; }
.meal:last-child { padding-bottom: 0; }
.meal .ic { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); }
.meal .ic svg { width: 20px; height: 20px; stroke: var(--c, var(--ink)); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.meal .nm { min-width: 0; }
.meal .nm b { display: block; font-weight: 600; }
.meal .nm span { color: var(--muted); font-size: var(--t-sm); }
.meal .q { text-align: right; font-size: var(--t-xs); color: var(--muted); }
.meal .q b { display: block; color: var(--ink); font: 600 var(--t-base) var(--f); white-space: nowrap; }

/* ---------- charts ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--faint); font: 500 10.5px var(--f); font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit.on { fill: var(--ink); fill-opacity: .07; }
.chart-tip { min-height: 20px; font-size: var(--t-sm); color: var(--muted); margin-top: var(--s2); }
.chart-tip b { color: var(--ink); font-weight: 600; }
.empty { display: grid; place-items: center; gap: 6px; text-align: center; padding: var(--s6) var(--s4); border-radius: var(--r-sm); background: var(--raised); color: var(--muted); font-size: var(--t-sm); }

<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="ph"><h2 id="sheet-title">Check in</h2><button class="btn" id="sheet-close">Close</button></div>
  <label class="muted" for="sheet-text" style="font-size:var(--t-sm)">Fill the blanks, then copy and paste into Claude. Blank lines are fine.</label>
  <textarea id="sheet-text" spellcheck="false"></textarea>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)"><button class="cta" id="sheet-copy">Copy</button><a class="cta ghost" href="https://claude.ai/code" target="_blank" rel="noopener">Open Claude</a></div>
  <button class="cta ghost" id="sheet-clear" hidden style="width:100%">Sent it: clear this workout from the phone</button>
</div></div>

<nav class="tabbar" id="tabs" aria-label="Main" hidden>
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>Train</button>
  <button class="logbtn" id="fab" aria-label="Log weight, a meal, water or supplements"><span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Log</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M5 11h14a7 7 0 0 1-14 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>Food</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>Progress</button>
</nav>

<script>
(() => {
  const KEY = "cutlog.v1";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
  };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v, d = 0) => (v == null || Number.isNaN(+v) ? null : Number(v).toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d }));
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const nice = (s) => String(s || "").replace(/_/g, " ");
  const stripId = (s) => String(s || "").replace(/^SUB-\d{4} /, "").replace(/ \(\d+ g P\)$/, "");
  const pOf = (s) => (String(s || "").match(/\((\d+) g P\)/) || [])[1];
  let TAB_LOGGING = false;
  let D = null, TAB = "today", RANGE = 30, SEL = null, FOODSEL = null, TRAINSEL = null;

  const dubaiISO = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dubai", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const dubaiHour = () => +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", hour12: false }).format(new Date());
  const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const isoOf = (dt) => dt.toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
  const dowOf = (iso) => DOW[parse(iso).getUTCDay()];
  const menuLabel = (iso) => `${dowOf(iso)} ${iso.slice(8, 10)}`;
  const mondayOf = (iso) => { const g = parse(iso).getUTCDay(); return addDays(iso, g === 0 ? -6 : 1 - g); };
  const longDate = (iso) => parse(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });

  const b64d = (x) => Uint8Array.from(atob(x), (ch) => ch.charCodeAt(0));
  const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function deriveKey(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(salt), iterations: iter }, base, 256);
    return b64e(bits);
  }
  async function decryptBlob(blob, rawKeyB64) {
    const key = await crypto.subtle.importKey("raw", b64d(rawKeyB64), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(blob.iv) }, key, b64d(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function fetchBlob() {
    const r = await fetch(`data.enc.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "No data published yet. Ask your coach to publish." : `Couldn't load (${r.status}). Try again.`);
    return r.json();
  }
  async function load({ quiet } = {}) {
    const cfg = store.get();
    if (!cfg.key) { showSetup(); return; }
    if (!D) $("#loading").hidden = false;
    $("#refresh").classList.add("spin");
    try {
      const blob = await fetchBlob();
      let key = cfg.key;
      if (cfg.salt !== blob.salt || cfg.iter !== blob.iter) {
        if (!cfg.pass) throw new Error("The lock changed. Type your password again.");
        key = await deriveKey(cfg.pass, blob.salt, blob.iter);
      }
      try { D = await decryptBlob(blob, key); }
      catch { store.set({ cache: cfg.cache }); throw new Error("Password no longer matches. Type the current one."); }
      store.set({ ...store.get(), key, salt: blob.salt, iter: blob.iter, cache: D });
      render();
    } catch (e) {
      const c = store.get();
      if (c.cache && c.key) { D = c.cache; render(); $("#dateline").textContent = "Offline copy. " + e.message; }
      else if (!quiet) showSetup(e.message);
    } finally { $("#refresh").classList.remove("spin"); }
  }

  function showSetup(err) {
    ["today", "train", "food", "progress"].forEach((t) => ($(`#v-${t}`).hidden = true));
    $("#v-setup").hidden = false; $("#tabs").hidden = true; $("#loading").hidden = true; $("#pane").hidden = true; $("#head").hidden = !D;
    const c = store.get();
    $("#forget").hidden = !c.key;
    $("#setup-err").hidden = !err; $("#setup-err").textContent = err || "";
  }
  function showTab(t) {
    if (t === "trend" || t === "health") t = "progress";
    TAB = t; $("#v-setup").hidden = true; $("#loading").hidden = true;
    ["today", "train", "food", "progress"].forEach((x) => ($(`#v-${x}`).hidden = x !== t));
    document.querySelectorAll("#tabs [data-tab]").forEach((b) => (b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    try { localStorage.setItem(KEY + ".tab", t); } catch {}
    const v = $(`#v-${t}`); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade");
    requestAnimationFrame(() => requestAnimationFrame(animateRings));
  }

  const seriesMap = () => Object.fromEntries((D.series || []).map((s) => [s.date, s]));
  const menuRows = () => Object.values(D.menus || {}).flat();
  // menus are matched by date when data.json has it (older data: by "Tue 03" label)
  const menuFor = (iso) => menuRows().find((r) => (r.date ? r.date === iso : r.day === menuLabel(iso))) || null;
  // ---------- week schedule (training/week_plan.yaml via data.json; default Mon/Tue/Thu/Fri when absent) ----------
  const progById = (id) => (D.program || []).find((p) => p.id === id) || null;
  const schedStart = () => mondayOf((D.generated_at || dubaiISO()).slice(0, 10));
  const inSched = (iso) => !!(D.schedule && D.schedule.days) && iso >= schedStart() && iso < addDays(schedStart(), 14);
  const planOf = (iso) => (inSched(iso) ? D.schedule.days.find((r) => r.date === iso) || null : null);
  function sessionFor(iso) {
    if (inSched(iso)) { const r = planOf(iso); return r && r.status !== "missed" && r.status !== "skipped" ? progById(r.logged || r.session) : null; }
    const i = (D.gym_days || []).indexOf(dowOf(iso)); return i >= 0 ? (D.program || [])[i] : null;
  }
  const isGym = (iso) => !!sessionFor(iso);
  const weekNote = (iso) => (D.schedule && D.schedule.notes && D.schedule.notes[isoWeek(iso)]) || null;
  function isoWeek(iso) { const d = parse(iso); const t = new Date(d); t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7)); const y = t.getUTCFullYear(), w1 = new Date(Date.UTC(y, 0, 4)); return `${y}-W${String(1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getUTCDay() + 6) % 7)) / 7)).padStart(2, "0")}`; }
  // ---------- supplements from profile/supplements.yaml (names, doses, timing as recorded) ----------
  const supList = () => D.supplements || [];
  const supAt = (re) => supList().filter((x) => re.test(x.timing || "") && !["whey", "creatine"].includes(x.id));
  function shakeTxt() { const s = supMap(); if (!s.whey) return null; return `${s.whey.dose || ""} ${s.whey.brand || s.whey.name}${s.creatine ? ` + ${s.creatine.dose || ""} creatine`.replace("  ", " ") : ""}`.trim(); }
  const supNames = (xs) => xs.map((x) => x.name).join(" + ");
  const supMap = () => Object.fromEntries((D.supplements || []).map((x) => [x.id, x]));

  function animateRings() { document.querySelectorAll("[data-fill]").forEach((c) => (c.style.width = c.dataset.fill)); document.querySelectorAll("[data-left]").forEach((c) => (c.style.left = c.dataset.left)); }

  function spark(vals, color, W = 300, H = 56) {
    const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
    if (pts.length < 2) return "";
    const ys = pts.map((p) => p[1]), a = Math.min(...ys), b = Math.max(...ys), n = vals.length - 1;
    const X = (i) => 4 + (i / Math.max(1, n)) * (W - 8), Y = (v) => 6 + (1 - (v - a) / Math.max(0.1, b - a)) * (H - 12);
    const d = pts.map((p, k) => `${k ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    const id = "g" + Math.random().toString(36).slice(2, 7), last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>
      <path d="${d}L${X(last[0])},${H}L${X(pts[0][0])},${H}Z" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  // ---------- DEVICE (Zepp, DEVICE source; absent = not provided, never defaulted) ----------
  const DEV = () => (D.device && D.device.latest) || null;
  const dv = (o, k) => (o && o[k] != null && !Number.isNaN(+o[k]) ? +o[k] : null);
  const SRC = '<span class="src">Watch (Zepp)</span>';
  // data.device.unverified: dotted path prefixes imported but not yet checked against the Zepp app
  const isUnv = (p) => !!p && ((D.device && D.device.unverified) || []).some((x) => (x.endsWith(".") ? p.startsWith(x) : p === x || p.startsWith(x + ".")));
  const UNV = '<span class="src unv" title="Imported from Zepp, not yet checked against the Zepp app">Unverified</span>';
  const tags = (p) => `<span class="tags">${SRC}${isUnv(p) ? UNV : ""}</span>`;
  const dval = (o, k, nd = 0) => { const v = o ? o[k] : null; return v == null ? null : typeof v === "boolean" ? (v ? "yes" : "no") : Number.isNaN(+v) ? esc(v) : fmt(+v, nd); };
  function recoveryCard() {
    const d = DEV(); if (!d) return "";
    const r = d.readiness, today = dubaiISO();
    const tile = (label, v, unit, sub, path) => `<div><span class="eyebrow">${label}</span><b class="num">${v != null ? fmt(v) + (unit ? `<small>${unit}</small>` : "") : "—"}</b><span class="u">${v != null ? sub : "— missing"}</span>${v != null && isUnv(path) ? `<span class="u unv">Unverified</span>` : ""}</div>`;
    const st = dv(r, "status");
    return `<section class="card" aria-label="Recovery from your watch"><div class="card-h"><h2>Recovery</h2><span class="src">${d.date === today ? "Today" : esc(longDate(d.date))}, from your watch</span></div>
      <div class="stat3 two rec">
        ${tile("Readiness", dv(r, "score"), "", st != null ? `score, status ${fmt(st)}` : "score out of 100", "device.readiness.score")}
        ${tile("BioCharge", dv(d.biocharge, "wake"), "", "on waking", "device.biocharge.wake")}
        ${tile("Sleep HRV", dv(r, "sleep_hrv"), "ms", dv(r, "hrv_baseline") != null ? `baseline ${fmt(dv(r, "hrv_baseline"))} ms` : "overnight", "device.readiness.sleep_hrv")}
        ${tile("Stress", dv(d.stress, "avg"), "", "day average", "device.stress.avg")}
      </div>
      <p class="note">Watch readings are trend signals, not a diagnosis. Read them with how you feel.${((D.device || {}).unverified || []).length ? ' "Unverified" values haven\'t been checked against the Zepp app yet.' : ""}</p>
      <button class="linkbtn" data-open-pane="watch" style="margin-top:var(--s1)">All watch details<span aria-hidden="true">›</span></button></section>`;
  }
  // one pane section: fields [label, key, unit, decimals]; tags per value only where the section is mixed
  function devSec(title, blk, fields, extra = "", after = "") {
    const d = DEV(), o = d && d[blk], paths = fields.map((f) => `device.${blk}.${f[1]}`);
    const allUnv = paths.every(isUnv);
    const items = fields.map(([label, k, unit, nd], i) => { const v = dval(o, k, nd);
      return `<div><span class="k">${label}</span><b>${v != null ? v + (unit ? `<small>${unit}</small>` : "") : "—"}</b>${!allUnv && isUnv(paths[i]) ? UNV : ""}</div>`; }).join("");
    return `<div class="sec"><div class="row"><span class="lab">${title}</span><span class="tags">${SRC}${allUnv ? UNV : ""}</span></div>
      ${o && typeof o === "object" ? extra + `<div class="kvg">${items}</div>` : `<p class="muted" style="margin:0;font-size:var(--t-sm)">— missing (not recorded by the watch that day)</p>`}${after}</div>`;
  }
  function stackBar(parts, label) {
    const have = parts.filter((p) => p.v != null && p.v > 0), tot = have.reduce((a, p) => a + p.v, 0);
    if (!tot) return "";
    return `<div class="stack" role="img" aria-label="${esc(label)}">${have.map((p) => `<i style="width:${(p.v / tot * 100).toFixed(2)}%;background:${p.c};opacity:${p.o ?? 1}"></i>`).join("")}</div>
      <div class="lgd">${parts.map((p) => `<span><i style="background:${p.c};opacity:${p.o ?? 1}"></i>${p.l} <b class="num">${p.v != null ? fmt(p.v) + p.u : "—"}</b></span>`).join("")}</div>`;
  }
  function watchPane() {
    const d = DEV();
    if (!d) return `<div class="grab"></div><div class="ph"><h2>Watch details</h2><button class="btn" data-close-pane>Close</button></div><p class="muted">— missing: no watch data yet.</p>`;
    const s = d.sleep, st = d.stress, hm = (m) => `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")} min`;
    const asleep = s ? ["deep_min", "light_min", "rem_min"].map((k) => dv(s, k)).filter((v) => v != null) : [];
    const sleepBar = s ? stackBar([{ l: "Deep", v: dv(s, "deep_min"), u: " min", c: "var(--sleep)" }, { l: "Light", v: dv(s, "light_min"), u: " min", c: "var(--sleep)", o: .55 },
      { l: "REM", v: dv(s, "rem_min"), u: " min", c: "var(--sleep)", o: .3 }, { l: "Awake", v: dv(s, "awake_min"), u: " min", c: "var(--line-2)" }], "Sleep stages") : "";
    const sleepSec = `<div class="sec"><div class="row"><span class="lab">Sleep stages</span>${tags("device.sleep")}</div>
      ${s ? `<div class="num" style="font-size:var(--t-base);font-weight:500">${asleep.length ? `Asleep ${hm(asleep.reduce((a, b) => a + b, 0))}${asleep.length < 3 ? " (partial)" : ""}` : "Asleep —"} · woke ${dv(s, "wake_count") != null ? fmt(dv(s, "wake_count")) + "×" : "—"}</div>${sleepBar}` : `<p class="muted" style="margin:0;font-size:var(--t-sm)">— missing (not recorded by the watch that day)</p>`}</div>`;
    const stressBar = st ? stackBar([{ l: "Relaxed", v: dv(st, "relax_pct"), u: "%", c: "var(--sleep)" }, { l: "Normal", v: dv(st, "normal_pct"), u: "%", c: "var(--ok)" },
      { l: "Medium", v: dv(st, "medium_pct"), u: "%", c: "var(--warn)" }, { l: "High", v: dv(st, "high_pct"), u: "%", c: "var(--bad)" }], "Time in stress zones") : "";
    const stp = d.steps, km = dv(stp, "distance_m");
    return `<div class="grab"></div><div class="ph"><span class="src">${d.date === dubaiISO() ? "Today" : esc(longDate(d.date))}, from your watch</span><button class="btn" data-close-pane>Close</button></div>
      <h2 class="pane-title">Watch details</h2>
      ${devSec("Readiness", "readiness", [["Score", "score"], ["Sleep HRV", "sleep_hrv", " ms"], ["Sleep RHR", "sleep_rhr", " bpm"], ["HRV baseline", "hrv_baseline", " ms"], ["RHR baseline", "rhr_baseline", " bpm"],
        ["HRV score", "hrv_score"], ["RHR score", "rhr_score"], ["Mental", "mental_score"], ["Physical", "physical_score"], ["Skin temp", "skin_temp_score"], ["Skin temp calibrated", "skin_temp_calibrated"]])}
      ${devSec("BioCharge", "biocharge", [["On waking", "wake"], ["Day low", "min"], ["Day high", "max"], ["Physical, waking", "physical_wake"], ["Mental, waking", "mental_wake"]])}
      ${sleepSec}
      ${devSec("Stress", "stress", [["Average", "avg"], ["Low", "min"], ["High", "max"]], stressBar)}
      ${devSec("PAI", "pai", [["Today", "day", "", 1], ["This week", "week_total", "", 1], ["Low zone", "low_zone_min", " min"], ["Medium zone", "medium_zone_min", " min"], ["High zone", "high_zone_min", " min"], ["Rest HR", "rest_hr", " bpm"], ["Max HR", "max_hr", " bpm"]])}
      ${devSec("Night SpO2", "spo2", [["ODI", "odi", "", 1], ["Events", "odi_events"], ["Score", "score"]], "", `<span class="muted" style="font-size:var(--t-sm)">Trend only, not a diagnosis.</span>`)}
      <div class="sec"><div class="row"><span class="lab">Steps detail</span>${tags("device.steps")}</div>
        ${stp ? `<div class="kvg"><div><span class="k">Distance</span><b>${km != null ? fmt(km / 1000, 2) + "<small> km</small>" : "—"}</b></div><div style="grid-column:span 2"><span class="k">Calories</span><b>${dv(stp, "kcal") != null ? fmt(dv(stp, "kcal")) + "<small> kcal</small>" : "—"}</b><span class="k">watch estimate, never eaten back</span></div></div>`
          : `<p class="muted" style="margin:0;font-size:var(--t-sm)">— missing (not recorded by the watch that day)</p>`}</div>
      <span class="muted" style="font-size:var(--t-xs);text-align:center">"Unverified": imported from Zepp, not yet checked against the Zepp app.</span>`;
  }
  function deviceTrendCard() {
    const ser = (D.device && D.device.series) || [], core = D.series || [];
    const coreHas = core.some((x) => x.sleep != null || x.rhr != null || x.hrv != null);
    if (!ser.length && !coreHas) return "";
    const ends = [ser.length && ser[ser.length - 1].date, core.length && core[core.length - 1].date].filter(Boolean).sort();
    const end = ends[ends.length - 1], n = 30, by = Object.fromEntries(ser.map((x) => [x.date, x])), cb = Object.fromEntries(core.map((x) => [x.date, x]));
    const days = Array.from({ length: n }, (_, i) => addDays(end, i - n + 1));
    const C = (k) => (x) => dv(cb[x], k), Dv = (blk, k) => (x) => dv(by[x] && by[x][blk], k);
    const rows = [["Sleep", C("sleep"), "h", 1, "var(--sleep)", "recovery.sleep_h"], ["Resting HR", C("rhr"), "bpm", 0, "var(--kcal)", "recovery.rhr_bpm"],
      ["HRV", C("hrv"), "ms", 0, "var(--protein)", "recovery.hrv_ms"], ["Deep sleep", Dv("sleep", "deep_min"), "min", 0, "var(--sleep)", "device.sleep.deep_min"],
      ["Readiness", Dv("readiness", "score"), "", 0, "var(--protein)", "device.readiness.score"], ["BioCharge on waking", Dv("biocharge", "wake"), "", 0, "var(--sleep)", "device.biocharge.wake"],
      ["Stress average", Dv("stress", "avg"), "", 0, "var(--warn)", "device.stress.avg"], ["PAI this week", Dv("pai", "week_total"), "", 1, "var(--steps)", "device.pai.week_total"],
      ["Night SpO2 ODI", Dv("spo2", "odi"), "", 1, "var(--muted)", "device.spo2.odi"]];
    const pre = core.find((x) => x.pre_plan && days.includes(x.date) && (x.sleep != null || x.rhr != null || x.hrv != null));
    return `<div class="card span"><div class="card-h"><h2>Recovery trends</h2><span class="src">Watch, last ${n} days</span></div><div class="dtrs">
      ${rows.map(([label, get, unit, nd, c, path]) => {
        const vals = days.map(get), have = vals.filter((v) => v != null), last = [...vals].reverse().find((v) => v != null);
        const sp = spark(vals, c, 132, 34);
        return `<div class="dtr"><div><div class="eyebrow">${label}${isUnv(path) ? UNV : ""}</div><div class="val num">${last != null ? fmt(last, nd) + (unit ? ` <small>${unit}</small>` : "") : "— missing"} <small>${have.length ? `latest, ${have.length} day${have.length > 1 ? "s" : ""} recorded` : ""}</small></div></div>
          ${sp || `<span class="muted" style="font-size:var(--t-xs);text-align:right">${have.length ? "Needs 2+ days" : "— missing"}</span>`}</div>`;
      }).join("")}</div>
      <p class="note">Gaps are days the watch didn't record. Trend only; weight and food decide targets. SpO2 ODI is not a diagnosis.${pre ? ` Days before the plan start (${esc(longDate(D.plan.start_date))}) are watch history only.` : ""}</p></div>`;
  }
  function watchWorkoutsCard() {
    const d = DEV(), w = d && Array.isArray(d.workouts) ? d.workouts : null;
    if (!w || !w.length) return "";
    const v = (x, k, u = "", nd = 0) => (dv(x, k) != null ? fmt(dv(x, k), nd) : "—") + u;
    return `<div class="card"><div class="card-h"><h2>Detected by your watch</h2><span class="src">${d.date === dubaiISO() ? "Today" : esc(longDate(d.date))}</span></div>
      <p class="muted" style="margin:calc(-1 * var(--s2)) 0 var(--s3);font-size:var(--t-sm)">Auto-detected activity, not your gym log.</p>
      <div class="list">${w.map((x) => `<div class="li"><b>${x.type_code != null ? "Type " + esc(x.type_code) : "Type — missing"}<span class="muted" style="font-weight:400;font-size:var(--t-sm)">, ${x.start ? esc(x.start) : "—"}</span></b><span class="num">${v(x, "duration_min", " min")}</span>
        <span class="sub num">HR ${v(x, "avg_hr")} avg, ${v(x, "max_hr")} max, load ${v(x, "load")}, ${v(x, "kcal", " kcal")}${dv(x, "kcal") != null ? " watch estimate" : ""}</span>
        ${["aerobic_te", "anaerobic_te", "sets"].some((k) => dv(x, k) != null) ? `<span class="sub num">TE aerobic ${v(x, "aerobic_te", "", 1)}, anaerobic ${v(x, "anaerobic_te", "", 1)}${dv(x, "sets") != null ? `, ${fmt(dv(x, "sets"))} sets` : ""}</span>` : ""}</div>`).join("")}</div>
      <p class="note">Zepp's type numbers are shown until you confirm their names. Watch calories are never eaten back.</p></div>`;
  }

  // ---------- TODAY ----------
  // one list drives both the whole-day timeline and "Next up"; supplements, shake and session come from data
  function dayPlan(iso) {
    const m = menuFor(iso), s = sessionFor(iso), wkend = ["Sat", "Sun"].includes(dowOf(iso)), sup = supMap(), T = D.targets;
    const am = supAt(/morning/i), pm = supAt(/dinner|night|evening/i), shake = shakeTxt(), it = [];
    it.push({ t: "07:00", c: "var(--protein)", b: "Weigh in", s: "After the toilet, before food or drink" + (am.length ? `, then ${supNames(am)}` : "") });
    if (m) it.push({ t: "13:00", c: "var(--kcal)", b: "Lunch", s: stripId(m.lunch), kv: pOf(m.lunch) ? `${pOf(m.lunch)} g protein (label)` : "", act: "meal" });
    else it.push({ t: "13:00", c: "var(--kcal)", b: wkend ? "Lunch out" : "Lunch", s: "Grilled protein, one carb, sauce on the side. Photo it.", act: "meal" });
    it.push({ t: "15:00", c: "var(--faint)", b: "Last tea", s: "Later caffeine costs sleep. Milk + sugar ≈ 60–100 kcal a cup." });
    if (s) {
      it.push({ t: "16:30", c: "var(--faint)", b: "Pre-gym snack", s: "Banana + eggs, if lunch was 5+ hours ago" });
      it.push({ t: "18:00", c: "var(--steps)", b: s.name.split(" (")[0], s: `${s.exercises.length} exercises, ${s.duration} min${/upper/.test(s.id) ? " + 20 min incline walk" : ""}`, act: "gym" });
      if (shake) {
        const ne = sup.whey && sup.whey.nutrition_estimate;
        it.push({ t: "19:30", c: "var(--protein)", b: "Shake", s: shake, kv: ne ? `≈ ${ne.protein_g.best} g protein, ${ne.kcal.best} kcal (estimate)` : "", act: "meal" });
      }
    } else if (!wkend) it.push({ t: "18:00", c: "var(--faint)", b: "Rest day", s: "Walk 10 minutes after lunch and dinner for steps" });
    if (m) it.push({ t: "20:30", c: "var(--kcal)", b: m.addon ? "Dinner + add-on" : "Dinner", s: stripId(m.dinner) + (m.addon ? `, plus ${m.addon.items}` : ""), kv: m.addon ? `day ≈ ${fmt(m.addon.kcal)} kcal, ${m.addon.protein} g protein` : "", act: "meal" });
    else it.push({ t: "20:30", c: "var(--kcal)", b: wkend ? "Dinner out" : "Dinner", s: "Photo every plate; aim for 40+ g protein", act: "meal" });
    if (pm.length) it.push({ t: "21:00", c: "var(--faint)", b: "Supplements", s: supNames(pm) });
    it.push({ t: "22:30", c: "var(--sleep)", b: "Wind down", s: `Lights low, screens off, aim for ${T.sleep_min}+ hours` });
    return it;
  }
  function timeline(iso) {
    return `<div class="tl">${dayPlan(iso).map((x) => `<div class="ti"><div class="time">${x.t}</div><div class="rail"><i style="--c:${x.c}"></i></div>
      <div class="body"><b>${esc(x.b)}</b><span>${esc(x.s)}</span>${x.kv ? `<span class="kv">${esc(x.kv)}</span>` : ""}</div></div>`).join("")}</div>`;
  }

  // ---------- brief, one thing, explanations ----------
  const coachFresh = () => { const c = D.coach; if (!c || !c.written_at) return null; const t = new Date(c.written_at.replace(" ", "T") + ":00+04:00"); return (Date.now() - t) / 36e5 <= 36 ? c : null; };
  function calcBrief() {
    const T = D.targets, tr = D.trend, L = D.latest, today = dubaiISO();
    if (!L.date) return { title: "Day one. Start with the scale.", body: "Weigh in after the toilet, before food or drink. Everything else builds from that number." };
    const parts = [];
    if (tr.change != null) parts.push(`Your trend moved ${tr.change > 0 ? "+" : ""}${tr.change.toFixed(2)} kg this week (target −${T.loss_band.low} to −${T.loss_band.high}).`);
    else parts.push(`Trend needs ${tr.avg7 == null ? "4 weigh-ins in 7 days" : "two weeks of weigh-ins"} before it means much.`);
    if (L.date === today && L.protein != null) parts.push(`Protein so far: ${fmt(L.protein)} of ${T.protein.best} g.`);
    return { title: L.date === today && L.weight != null ? "Logged in. Here's where you stand." : "New day. Start with the scale.", body: parts.join(" ") };
  }
  function oneThing() {
    const c = coachFresh(), L = D.latest, today = dubaiISO(), h = dubaiHour(), m = menuFor(today), s = sessionFor(today);
    const weighed = L.date === today && L.weight != null;
    // a note from last night doesn't outrank this morning's weigh-in; once weighed (or from noon) the coach's one thing leads
    if (c && c.one_thing && (weighed || h >= 12 || (c.written_at || "").slice(0, 10) === today)) return { text: c.one_thing, who: "coach" };
    if (!weighed) return { text: h < 12 ? "Weigh in now: after the toilet, before food or drink." + (c && c.one_thing ? ` Then: ${c.one_thing}` : "") : "Log today's weight if you weighed in this morning.", who: "rule", act: "log" };
    if (m && m.addon && h < 20) return { text: `Plan the add-on: ${m.addon.items}.`, who: "rule" };
    if (s && h < 18) return { text: `${s.name.split(" (")[0]} at 18:00. Pre-gym snack around 16:30.`, who: "rule" };
    return { text: "Log what you ate so today's numbers are complete.", who: "rule", act: "log" };
  }
  function outbox() { try { return JSON.parse(localStorage.getItem(KEY + ".outbox")) || []; } catch { return []; } }
  function setOutbox(v) { try { localStorage.setItem(KEY + ".outbox", JSON.stringify(v.slice(-30))); } catch {} }
  function entryStatus(x) { const gen = new Date((D.generated_at || "").replace(" ", "T") + ":00+04:00"); return gen > new Date(x.at) ? "done" : "wait"; }

  // ---------- shared components ----------
  // meter: a value against a target band (low–high) with an optional floor tick. Range targets, never a single "goal".
  function meter({ label, v, lo, hi, floor, unit, c, explain, est, done, nd = 0 }) {
    const max = hi * 1.18, P = (x) => `${Math.max(0, Math.min(100, (x / max) * 100)).toFixed(2)}%`;
    let foot = "";
    if (v == null) foot = `<span>Nothing logged yet</span>`;
    else if (v > hi) foot = `<span>${fmt(v - hi, nd)} ${unit} over the range</span>`;
    else if (v >= lo) foot = `<span>In range</span>`;
    else if (floor != null && v < floor) foot = `<span>${done ? `Below the ${fmt(floor, nd)} ${unit} floor` : `${fmt(lo - v, nd)}–${fmt(hi - v, nd)} ${unit} to go`}</span>`;
    else foot = `<span>${fmt(lo - v, nd)}–${fmt(hi - v, nd)} ${unit} to go</span>`;
    return `<${explain ? `button data-explain="${explain}"` : "div"} class="meter" style="--c:var(${c})" aria-label="${esc(label)}: ${v != null ? fmt(v, nd) + " " + unit : "not logged"}, target ${fmt(lo, nd)} to ${fmt(hi, nd)} ${unit}${floor != null ? ", floor " + fmt(floor, nd) : ""}">
      <span class="mh"><span class="ml"><i></i>${esc(label)}</span><span class="mv"><b>${v != null ? fmt(v, nd) : "—"}</b><small>/ ${fmt(lo, nd)}–${fmt(hi, nd)} ${unit}</small></span></span>
      <span class="track" aria-hidden="true"><u style="left:${P(lo)};width:calc(${P(hi)} - ${P(lo)})"></u>${floor != null ? `<s style="left:${P(floor)}"></s>` : ""}<i data-fill="${P(v || 0)}"></i></span>
      <span class="mf">${foot}<span>${est || (floor != null ? `floor ${fmt(floor, nd)}` : "")}</span></span>
    </${explain ? "button" : "div"}>`;
  }
  // the cut ruler: start weight → goal on a tape, trend marker, distance covered filled
  function cutRuler() {
    const L = D.latest, tr = D.trend, today = dubaiISO(), start = +D.start_weight_kg, goal = +D.goal_kg;
    const cur = tr.avg7 != null ? tr.avg7 : L.weight != null ? L.weight : null, isAvg = tr.avg7 != null;
    const hi = Math.ceil(Math.max(start, cur ?? start)) + 1, lo = Math.floor(goal) - 1, P = (x) => `${(((hi - x) / (hi - lo)) * 100).toFixed(2)}%`;
    let ticks = "";
    for (let k = hi; k >= lo; k--) { const maj = k % 5 === 0; ticks += `<span class="tk${maj ? " maj" : ""}" style="left:${P(k)}"></span>${maj && k !== start && k !== goal ? `<span class="tl" style="left:${P(k)}">${k}</span>` : ""}`; }
    const lost = cur != null ? start - cur : null, left = cur != null ? cur - goal : null;
    return `<section class="card cut" aria-label="The cut: from ${start} to ${goal} kg">
      <div class="cut-top">
        <button class="cut-now" data-explain="trend" style="text-align:left"><span class="eyebrow">${isAvg ? "Trend weight, 7-day average" : cur != null ? (L.date === today ? "Today's scale" : "Last weigh-in, " + esc(longDate(L.date))) : "Trend weight"}</span><b class="num">${cur != null ? fmt(cur, 1) : "—"}<small>kg</small></b></button>
        <div class="cut-side"><span>${left != null ? `<b class="num">${fmt(Math.max(0, left), 1)} kg</b> to ${goal} kg` : `Goal <b>${goal} kg</b>`}</span><span>${lost != null ? (lost >= 0 ? `${fmt(lost, 1)} kg down from ${start}` : `${fmt(-lost, 1)} kg above the ${start} kg start`) : "Log a weigh-in to start"}</span></div>
      </div>
      <div class="ruler" role="img" aria-label="Weight scale from ${start} kg start to ${goal} kg goal${cur != null ? `, now ${fmt(cur, 1)} kg` : ""}">
        <span class="base"></span>${ticks}
        ${cur != null && cur < start ? `<span class="done" style="left:${P(start)};width:0" data-fill="calc(${P(cur)} - ${P(start)})"></span>` : ""}
        <span class="tl end" style="left:${P(start)}">${start} start</span><span class="tl end" style="left:${P(goal)}">${goal} goal</span>
        ${cur != null ? `<span class="mark" style="left:${P(start)}" data-left="${P(cur)}"></span>` : ""}
      </div>
      ${isAvg ? "" : `<p class="note" style="margin:0">${cur != null ? "This is one scale reading. " : ""}The trend line needs 4 weigh-ins in 7 days; single days swing up to 1.5 kg with water and salt.</p>`}
    </section>`;
  }

  function viewToday() {
    const T = D.targets, today = dubaiISO(), L = D.latest, isToday = L.date === today;
    const c = coachFresh(), brief = c ? { title: c.title, body: c.body } : calcBrief(), one = oneThing();
    const waiting = outbox().filter((x) => x.date === today && entryStatus(x) === "wait").length;
    const prot = isToday ? L.protein : null, kcal = isToday ? L.kcal : null, done = isToday && L.complete;
    const nowMin = dubaiHour() * 60 + +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", minute: "2-digit" }).format(new Date());
    const items = nextUp(today).filter((x) => { const [hh, mm] = x.t.split(":").map(Number); return hh * 60 + mm >= nowMin - 60; }).slice(0, 3);
    const ins = (D.insights || [])[0];
    const kEst = isToday && L.kcal_low != null && L.kcal_high != null ? `estimate ${fmt(L.kcal_low)}–${fmt(L.kcal_high)}` : "";
    const sg = (k, label, v, unit, goalTxt, c) => `<button data-explain="${k}" style="--c:var(${c})"><span class="k"><i></i>${label}</span><b class="num">${v != null ? v + `<small>${unit}</small>` : "—"}</b><span class="g">${v != null ? goalTxt : "— missing"}</span></button>`;
    const dayKind = dayKindOf(today), nMeals = ((D.meals || {})[today] || { items: [] }).items.length;
    return `
      ${waiting ? `<div class="span"><button class="sig" data-open-pane="entries"><i></i>${waiting} sent to your coach, waiting</button></div>` : ""}
      <section class="brief span" aria-label="Daily brief">
        <span class="who ${c ? "" : "calc"}"><i></i>${c ? "Your coach, " + ((c.written_at || "").slice(0, 10) === today ? "" : (c.written_at || "").slice(0, 10) === addDays(today, -1) ? "yesterday " : esc(longDate((c.written_at || today).slice(0, 10))) + " ") + esc((c.written_at || "").slice(11)) : "Calculated from your data. No coach note yet"}</span>
        <h2 class="serif-h">${esc(brief.title || "")}</h2>
        <p>${esc(brief.body || "")}</p>
        <div class="one"><span class="t"><span class="lbl">One thing today</span><span>${esc(one.text)}</span></span>${one.act === "log" ? `<button class="btn primary" data-open-pane="log">Log</button>` : ""}</div>
      </section>
      <section class="card" aria-label="Today's food">
        <div class="card-h"><h2>Today's food</h2><span class="aside">${isToday ? (done ? "Day fully logged" : "Logged so far") : "Nothing logged today"}</span></div>
        <div class="meters">
          ${meter({ label: "Protein", v: prot, lo: T.protein.low, hi: T.protein.high, floor: T.protein_floor, unit: "g", c: "--protein", explain: "protein", done })}
          ${meter({ label: "Calories", v: kcal, lo: T.kcal.low, hi: T.kcal.high, floor: T.kcal_floor, unit: "kcal", c: "--kcal", explain: "kcal", est: kEst, done })}
        </div>
        ${nMeals ? `<button class="linkbtn" data-open-pane="meals" style="margin-top:var(--s3)">What's logged: ${nMeals} item${nMeals > 1 ? "s" : ""}<span aria-hidden="true">›</span></button>` : ""}
      </section>
      ${cutRuler()}
      <section class="card" aria-label="Next up">
        <div class="card-h"><h2>Next up</h2><span class="pill">${dayKind}</span></div>
        ${items.length ? items.map((x) => `<div class="nx"><span class="tm num">${x.t}</span><span class="w"><b>${esc(x.b)}</b><span>${esc(x.s)}</span></span>${x.act === "meal" ? `<button class="btn" data-open-pane="log">Log</button>` : x.act === "gym" ? `<button class="btn train" data-go-train>Start</button>` : ""}</div>`).join("") : `<p class="muted" style="margin:0">Nothing else planned today. Wind down for 7+ hours of sleep.</p>`}
        <button class="linkbtn" data-open-pane="day" style="margin-top:var(--s2)">Whole day plan<span aria-hidden="true">›</span></button>
      </section>
      <div style="display:grid;gap:var(--s3)">
        <div class="signals" role="group" aria-label="Sleep, steps and water today">
          ${sg("sleep", "Sleep", L.sleep != null && isToday ? fmt(L.sleep, 1) : null, " h", `target ${T.sleep_min}+ h`, "--sleep")}
          ${sg("steps", "Steps", L.steps != null && isToday ? fmt(L.steps) : null, "", `target ${fmt(T.steps_min)}`, "--steps")}
          ${sg("water", "Water", L.water != null && isToday ? fmt(L.water, 1) : null, " L", `target ${T.water ? T.water[0] + "–" + T.water[1] : "2.5–3.5"} L`, "--sleep")}
        </div>
        ${ins ? `<p class="insight">${esc(ins.text)}</p>` : ""}
      </div>
      ${recoveryCard()}`;
  }
  const nextUp = (iso) => dayPlan(iso).filter((x) => x.b !== "Last tea");


  // explanations read the CURRENT targets, so they never contradict the charts after a target change
  function explainOf(k) {
    const T = D.targets, sp = T.steps_plan, w = T.water || [2.5, 3.5];
    const stepsPlan = sp && sp.wk1_2_min ? ` The plan: ${fmt(sp.wk1_2_min)} in weeks 1–2, ${fmt(sp.wk3_4_min)} in weeks 3–4, ${fmt(sp.wk5_plus_min)} from week 5.` : "";
    return {
      trend: { title: "Trend weight", what: "The average of your last 7 morning weigh-ins. Daily weight swings up to 1.5 kg with water, salt and carbs; the average shows the real direction.", src: [["■", "Measured", "Scale weigh-ins, mornings."], ["□", "Calculated", "7-day average and weekly change. Needs 4+ weigh-ins in 7 days."]] },
      protein: { title: "Protein", what: `Keeps your muscle while you lose fat. Your target is ${T.protein.low}–${T.protein.high} g a day; never below ${T.protein_floor} g.`, src: [["■", "Label", "Meal-plan nutrition from the provider."], ["≈", "Estimate", "Add-ons and anything without a label, as a range."]] },
      kcal: { title: "Calories", what: `Energy eaten. Your target is ${fmt(T.kcal.low)}–${fmt(T.kcal.high)} kcal; the floor is ${fmt(T.kcal_floor)}. Your watch's "calories burned" is never added back.`, src: [["■", "Label", "Meal-plan nutrition."], ["≈", "Estimate", "Everything else, as a range."]] },
      sleep: { title: "Sleep", what: `Hours asleep from your watch. Under 6 hours means an easier gym session; the target is ${T.sleep_min}+.`, src: [["■", "Device", "Your watch, synced from Zepp."]] },
      steps: { title: "Steps", what: `Daily movement outside the gym. Your target now is ${fmt(T.steps_min)}.${stepsPlan}`, src: [["■", "Device", "Your watch, synced from Zepp. Today's count lands after the day ends."]] },
      water: { title: "Water", what: `${w[0]}–${w[1]} L a day, plus 0.5–1 L per hour of training. Dubai heat counts.`, src: [["■", "You said", "What you log."]] },

  }

      : k === "protein" ? bars(s, "protein", "var(--protein)", { low: T.protein.low, high: T.protein.high, floor: T.protein_floor })
      : k === "kcal" ? bars(s, "kcal", "var(--kcal)", { low: T.kcal.low, high: T.kcal.high, floor: T.kcal_floor })
      : k === "sleep" ? bars(s, "sleep", "var(--sleep)", { low: T.sleep_min, high: 9 })
      : k === "steps" ? bars(s, "steps", "var(--steps)", { low: T.steps_min }) : `<p class="muted" style="margin:0">Today: ${L.water != null ? fmt(L.water, 1) + " L" : "— missing"}</p>`;

    const gl = { "■": "", "≈": "est", "□": "calc" };

      <div class="divide"><span class="lab" style="font-weight:600">Where the numbers come from</span><div class="srcs">${e.src.map((x) => `<span class="g ${gl[x[0]] || ""}" aria-hidden="true"></span><span><b>${x[1]}.</b> <span class="muted">${x[2]}</span></span>`).join("")}</div></div>

      <span class="muted" style="font-size:var(--t-xs);text-align:center">Copies a question with these numbers. Nothing else is shared.</span>`;
  }

  // ---------- log pane ----------
  const LD_KEY = KEY + ".logdraft";

        <span class="lab" style="margin-top:2px">How do you feel? 1 is low, 5 is great</span><div class="opts">${[1, 2, 3, 4, 5].map((n) => o("feel", n, n)).join("")}</div>`}
